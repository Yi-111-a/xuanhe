<style>
  @font-face{font-family:"Noto Serif SC";font-weight:200 900;font-style:normal;font-display:block;src:url("assets/fonts/NotoSerifSC-VF.ttf") format("truetype");}
  @font-face{font-family:"Noto Sans SC";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");}
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* 宣和 trailer: captions sit inside the bottom letterbox bar (y 940–1080), film-subtitle style */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: 948px;
    height: 124px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 84%;
    padding: 0;
    background: transparent;
    border: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 0.1em 0.5em;
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.2;
    letter-spacing: 0.06em;
  }
  .caption-word {
    display: inline-block;
    padding: 0 0.04em 0.06em;
    color: rgba(239, 233, 220, 0.42);
    border-bottom: 3px solid transparent;
  }
  .caption-word.is-active {
    color: #efe9dc;
    border-bottom-color: #e8792e;
    text-shadow: 0 0 18px rgba(232, 121, 46, 0.35);
  }
  .caption-word.is-spoken {
    color: rgba(239, 233, 220, 0.86);
    border-bottom-color: transparent;
    text-shadow: none;
  }
  .caption-word.cap-brand { font-family: "Noto Serif SC", serif; }
  .caption-word.cap-num { font-family: "Noto Sans SC", sans-serif; }
  .caption-word.cap-cta { text-decoration: none; }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div

>

    <div id="caption-stage" class="caption-stage"></div>

</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.

I 来演","start":42.544,"end":43.301}]},{"id":"caption-group-26","frame":8,"start":43.553,"end":44.407,"text":"钱粮兵马","words":[{"id":"caption-word-26-0","text":"钱粮兵马","start":43.553,"end":44.287}]},{"id":"caption-group-27","frame":8,"start":44.491,"end":45.632,"text":"由引擎结算","words":[{"id":"caption-word-27-0","text":"由引擎结算","start":44.491,"end":45.512}]},{"id":"caption-group-28","frame":9,"start":47.998,"end":48.719,"text":"宣和","words":[{"id":"caption-word-28-0","text":"宣和","start":47.998,"end":48.599}]}];
  var DURATION = 50.5;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? Math.min(DURATION, Number(group.end) + 0.5) : Math.min(Number(next.start), Number(group.end) + 0.3); // last group clears after its line
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.9 }, { scale: 1, duration: 0.16, ease: "back.out(2.2)" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
