<template id="f01-glory-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face{font-family:"Zhi Mang Xing";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ZhiMangXing-Regular.ttf") format("truetype");}

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      --f01-ink: #0b0907;
      --f01-ember: #e8792e;
      --f01-red: #c23a26;
      --f01-gold: #d6b46a;
      --f01-snow: #efe9dc;
    }
    #root .f01-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }

    /* ground */
    #f01-ground { background: #0b0907; }

    /* camera: world (kicks) > push (slow push toward palace + fireworks) */
    #f01-world { position: absolute; inset: 0; transform-origin: 50% 45%; }
    #f01-push {
      position: absolute;
      left: -30px;
      top: 90px;
      width: 1980px;
      height: 1320px;
      transform-origin: 69% 13%;
    }
    #f01-plate {
      position: absolute;
      left: 0;
      top: 0;
      width: 1980px;
      height: 1320px;
      display: block;
      object-fit: cover;
      filter: saturate(1) brightness(1);
    }
    #f01-sparks { position: absolute; left: 0; top: 0; width: 1980px; height: 1320px; }
    .f01-burst { position: absolute; width: 0; height: 0; }
    .f01-bglow {
      position: absolute;
      left: -70px; top: -70px; width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,236,190,0.9) 0%, rgba(232,121,46,0.45) 35%, rgba(232,121,46,0) 70%);
    }
    .f01-sp {
      position: absolute;
      left: -3px; top: -3px; width: 6px; height: 6px;
      border-radius: 50%;
    }

    /* vignette + type scrim */
    #f01-vignette {
      background:
        radial-gradient(ellipse 75% 70% at 55% 48%, rgba(11,9,7,0) 45%, rgba(11,9,7,0.62) 100%),
        linear-gradient(180deg, rgba(11,9,7,0.35) 0px, rgba(11,9,7,0) 360px);
    }
    #f01-scrim {
      background: radial-gradient(ellipse 760px 230px at 960px 790px, rgba(11,9,7,0.78) 0%, rgba(11,9,7,0.5) 50%, rgba(11,9,7,0) 100%);
    }

    /* scene 1 ember */
    #f01-pre { position: absolute; left: 960px; top: 900px; width: 0; height: 0; }
    #f01-pre-halo {
      position: absolute;
      left: -260px; top: -260px; width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,121,46,0.32) 0%, rgba(214,180,106,0.12) 35%, rgba(11,9,7,0) 70%);
    }
    #f01-pre-core {
      position: absolute;
      left: -6px; top: -6px; width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff4d6;
      box-shadow: 0 0 10px 4px rgba(214,180,106,0.95), 0 0 28px 10px rgba(232,121,46,0.6);
    }

    /* rising embers (screen space) */
    #f01-embers { position: absolute; inset: 0; }
    .f01-em {
      position: absolute;
      left: 0; top: 0;
      border-radius: 50%;
      background: #ffcf8a;
      box-shadow: 0 0 8px 3px rgba(232,121,46,0.75);
    }

    /* label: 宣和二年 · 汴京 */
    #f01-label {
      position: absolute;
      left: 120px;
      top: 168px;
      display: flex;
      align-items: center;
      gap: 22px;
      font-family: "Zhi Mang Xing", serif;
      font-size: 76px;
      line-height: 1.2;
      color: #d6b46a;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(11,9,7,0.95), 0 2px 4px rgba(11,9,7,0.9);
      --f01-w: 112%;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 var(--f01-w), rgba(0,0,0,0) calc(var(--f01-w) + 12%));
      mask-image: linear-gradient(90deg, #000 0%, #000 var(--f01-w), rgba(0,0,0,0) calc(var(--f01-w) + 12%));
    }
    #f01-label .f01-dot {
      display: block;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #d6b46a;
      box-shadow: 0 0 8px rgba(11,9,7,0.9);
    }
    #f01-rule {
      position: absolute;
      left: 122px;
      top: 274px;
      width: 560px;
      height: 2px;
      background: linear-gradient(90deg, #d6b46a 0%, rgba(214,180,106,0.6) 70%, rgba(214,180,106,0) 100%);
      transform-origin: 0% 50%;
    }

    /* main line: 天下第一繁华 */
    #f01-mainwrap {
      position: absolute;
      left: 560px;
      top: 712px;
      width: 800px;
      height: 150px;
      transform-origin: 50% 55%;
    }
    #f01-main {
      position: absolute;
      left: 0; top: 0;
      width: 800px;
      text-align: center;
      font-family: "Zhi Mang Xing", serif;
      font-size: 120px;
      line-height: 1.15;
      letter-spacing: 10px;
      color: #efe9dc;
      white-space: nowrap;
      text-shadow: 0 0 24px rgba(11,9,7,0.95), 0 0 8px rgba(11,9,7,0.8), 0 3px 6px rgba(11,9,7,0.9);
      --f01-w: 112%;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 var(--f01-w), rgba(0,0,0,0) calc(var(--f01-w) + 10%));
      mask-image: linear-gradient(90deg, #000 0%, #000 var(--f01-w), rgba(0,0,0,0) calc(var(--f01-w) + 10%));
    }
    #f01-nib {
      position: absolute;
      left: 0; top: 78px;
      width: 0; height: 0;
    }
    #f01-nib-core {
      position: absolute;
      left: -9px; top: -9px; width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff1cf;
      box-shadow: 0 0 14px 6px rgba(232,121,46,0.85), 0 0 40px 16px rgba(214,180,106,0.35);
    }

    /* flash */
    #f01-flash {
      background: radial-gradient(ellipse 70% 70% at 50% 45%, #fff6e2 0%, #f3c98a 40%, #e8792e 100%);
    }

    /* grain */
    #f01-grain-wrap { overflow: hidden; }
    #f01-grain {
      position: absolute;
      left: -480px; top: -270px;
      width: 2880px; height: 1620px;
      opacity: 0.075;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* letterbox */
    .f01-bar { position: absolute; left: 0; width: 1920px; height: 140px; background: #0b0907; }
    #f01-bar-top { top: 0; }
    #f01-bar-bot { top: 940px; }
  </style>

  <div id="root" data-composition-id="01-glory" data-width="1920" data-height="1080" data-start="0" data-duration="6">
    <!-- ink ground -->
    <div id="f01-ground" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="0"></div>

    <!-- the painting world -->
    <div id="f01-stage" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="1">
      <div id="f01-world">
        <div id="f01-push">
          <img id="f01-plate" src="assets/t_glory.jpg" alt="" />
          <div id="f01-sparks"></div>
        </div>
      </div>
      <div id="f01-vignette" class="f01-layer"></div>
      <div id="f01-scrim" class="f01-layer"></div>
    </div>

    <!-- embers: scene-1 lone ember + rising embers -->
    <div id="f01-fx" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="2">
      <div id="f01-embers"></div>
      <div id="f01-pre">
        <div id="f01-pre-halo"></div>
        <div id="f01-pre-core"></div>
      </div>
    </div>

    <!-- type -->
    <div id="f01-type" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="3">
      <div id="f01-label"><span>宣和二年</span><i class="f01-dot"></i><span>汴京</span></div>
      <div id="f01-rule"></div>
      <div id="f01-mainwrap">
        <div id="f01-main">天下第一繁华</div>
        <div id="f01-nib"><div id="f01-nib-core"></div></div>
      </div>
    </div>

    <!-- flash -->
    <div id="f01-flashclip" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="4">
      <div id="f01-flash" class="f01-layer"></div>
    </div>

    <!-- film grain -->
    <div id="f01-grain-wrap" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="5">
      <div id="f01-grain"></div>
    </div>

    <!-- letterbox bars, full duration, above the pictures -->
    <div id="f01-bars" class="clip f01-layer" data-start="0" data-duration="6" data-track-index="6">
      <div id="f01-bar-top" class="f01-bar"></div>
      <div id="f01-bar-bot" class="f01-bar"></div>
    </div>
  </div>

  <script>
    (function () {
      var D = 6;
      var FPS = 30;
      var T_BOOM = 0.95;   // low-boom, painting slams in
      var T_YEAR = 1.45;   // 宣和二年
      var T_GLORY = 3.57;  // 天下第一繁华
      var root = document.querySelector('[data-composition-id="01-glory"]');
      var q = function (sel) { return root.querySelector(sel); };

      // seeded PRNG (mulberry32) — deterministic
      function rng(seed) {
        var a = seed >>> 0;
        return function () {
          a = (a + 0x6D2B79F5) >>> 0;
          var t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hash(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0–0.95): lone gold ember rises in the dark ---------- */
      var pre = q("#f01-pre");
      tl.fromTo(pre, { y: 0 }, { y: -360, duration: T_BOOM, ease: "power2.in" }, 0);
      tl.fromTo(pre, { x: -10 }, { x: 14, duration: T_BOOM, ease: "sine.inOut" }, 0);
      tl.fromTo("#f01-pre-core", { scale: 0.6, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
      tl.fromTo("#f01-pre-halo", { scale: 0.4, opacity: 0.2 }, { scale: 1.6, opacity: 1, duration: T_BOOM, ease: "power2.in" }, 0);
      // flare just before the boom
      tl.to("#f01-pre-core", { scale: 3.2, duration: 0.1, ease: "power2.in" }, T_BOOM - 0.1);
      tl.set(pre, { opacity: 0 }, T_BOOM);

      /* ---------- Scene 2 (0.95): flash, painting slams in ---------- */
      var flash = q("#f01-flash");
      tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T_BOOM);
      tl.to(flash, { opacity: 0, duration: 0.3, ease: "power2.out" }, T_BOOM + 2 / FPS);
      // secondary warm pulse on 天下第一繁华
      tl.to(flash, { opacity: 0.38, duration: 0.001 }, T_GLORY);
      tl.to(flash, { opacity: 0, duration: 0.22, ease: "power2.out" }, T_GLORY + 1 / FPS);

      // world appears hard on the boom
      tl.fromTo("#f01-world", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T_BOOM);
      tl.fromTo("#f01-vignette", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T_BOOM);
      // slow push toward palace + fireworks, slight lateral drift, across the rest of the frame
      tl.fromTo("#f01-push", { scale: 1.0, x: 0, y: 0 }, { scale: 1.1, x: -22, y: 6, duration: D - T_BOOM, ease: "power2.inOut" }, T_BOOM);
      // saturation drain from 5.2s
      tl.fromTo("#f01-plate", { filter: "saturate(1) brightness(1)" }, { filter: "saturate(0.75) brightness(0.9)", duration: D - 5.2, ease: "power1.in" }, 5.2);

      /* ---------- camera kicks: seek-safe procedural driver ---------- */
      // impulses: [time, shake px, roll deg, scale punch]
      var kicks = [
        [T_BOOM, 11, 0.7, 0.075],
        [T_YEAR, 4, 0.25, 0.012],
        [T_GLORY, 9, 0.6, 0.05]
      ];
      var world = q("#f01-world");
      var grain = q("#f01-grain");
      function camAt(t) {
        var x = 0, y = 0, r = 0, s = 1;
        for (var i = 0; i < kicks.length; i++) {
          var k = kicks[i];
          var dt = t - k[0];
          if (dt < 0 || dt > 0.6) continue;
          var f = Math.floor(dt * FPS); // per-frame jitter, deterministic
          var env = Math.exp(-dt * 16);
          var sx = hash(i * 97 + f) * 2 - 1;
          var sy = hash(i * 131 + f + 7) * 2 - 1;
          var sr = hash(i * 173 + f + 13) * 2 - 1;
          x += k[1] * env * (f % 2 === 0 ? 1 : -1) * (0.6 + 0.4 * Math.abs(sx));
          y += k[1] * env * sy;
          r += k[2] * env * sr;
          s += k[3] * Math.exp(-dt * 7);
        }
        gsap.set(world, { x: x, y: y, rotation: r, scale: s });
        // film grain re-seeds 12×/s
        var g = Math.floor(t * 12);
        gsap.set(grain, { x: (hash(g * 3 + 1) - 0.5) * 480, y: (hash(g * 5 + 2) - 0.5) * 270 });
      }
      var driver = {};
      var tv = 0;
      Object.defineProperty(driver, "t", {
        get: function () { return tv; },
        set: function (v) { tv = v; camAt(v); }
      });
      camAt(0);
      tl.to(driver, { t: D, duration: D, ease: "none" }, 0);

      /* ---------- firework sparkles over the sky (inside the pushed plate) ---------- */
      var sparks = q("#f01-sparks");
      var R = rng(20260118);
      var COLORS = ["#ffe2a3", "#d6b46a", "#e8792e", "#efe9dc", "#ff9c6b", "#c23a26"];
      // plate-local coords (plate is offset -30,+90 on screen)
      var bursts = [
        [1.00, 1500, 120, 1.0], [1.18, 1180, 190, 0.8], [1.40, 1790, 140, 0.9],
        [1.75, 1330, 90, 0.85], [2.05, 980, 160, 0.7], [2.35, 1640, 200, 0.9],
        [2.70, 1420, 150, 0.8], [3.05, 1860, 90, 0.75],
        [3.57, 1560, 150, 1.25], [3.62, 1120, 120, 0.95],
        [4.00, 1720, 210, 0.8], [4.40, 1290, 160, 0.85], [4.85, 1610, 95, 0.75], [5.30, 1050, 200, 0.7]
      ];
      bursts.forEach(function (b, bi) {
        var t0 = b[0], cx = b[1] + (R() - 0.5) * 60, cy = b[2] + (R() - 0.5) * 40, size = b[3];
        var burst = document.createElement("div");
        burst.className = "f01-burst";
        burst.style.left = cx + "px";
        burst.style.top = cy + "px";
        var glow = document.createElement("div");
        glow.className = "f01-bglow";
        burst.appendChild(glow);
        sparks.appendChild(burst);
        tl.fromTo(glow, { scale: 0.2, opacity: 0 }, { scale: 1.3 * size, opacity: 0.85, duration: 0.08, ease: "power2.out" }, t0);
        tl.to(glow, { scale: 1.8 * size, opacity: 0, duration: 0.6, ease: "power2.out" }, t0 + 0.08);
        var n = 18;
        var col = COLORS[Math.floor(R() * COLORS.length)];
        var col2 = COLORS[Math.floor(R() * COLORS.length)];
        for (var i = 0; i < n; i++) {
          var a = (i / n) * Math.PI * 2 + R() * 0.3;
          var rad = (55 + R() * 55) * size;
          var sp = document.createElement("div");
          sp.className = "f01-sp";
          var c = i % 3 === 0 ? col2 : col;
          sp.style.background = c;
          sp.style.boxShadow = "0 0 6px 2px " + c;
          burst.appendChild(sp);
          var life = 0.9 + R() * 0.5;
          tl.fromTo(sp, { x: 0, y: 0, scale: 1.2 },
            { x: Math.cos(a) * rad, y: Math.sin(a) * rad + 26 * size, scale: 0.35, duration: life, ease: "power3.out" }, t0);
          tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.001 }, t0);
          tl.to(sp, { opacity: 0, duration: life, ease: "power2.in" }, t0 + 0.002);
        }
      });

      /* ---------- rising embers (screen space) ---------- */
      var embers = q("#f01-embers");
      var E = rng(907);
      for (var e = 0; e < 30; e++) {
        var em = document.createElement("div");
        em.className = "f01-em";
        var sz = 2 + E() * 4;
        em.style.width = sz + "px";
        em.style.height = sz + "px";
        embers.appendChild(em);
        var start = T_BOOM + E() * 4.3;
        var x0 = 60 + E() * 1800;
        var y0 = 900 + E() * 80;
        var rise = 420 + E() * 520;
        var dur = 1.6 + E() * 1.8;
        var sway = (E() - 0.5) * 120;
        var peak = 0.45 + E() * 0.5;
        tl.fromTo(em, { x: x0, y: y0, opacity: 0 }, { x: x0 + sway, y: y0 - rise, opacity: peak, duration: dur, ease: "none" }, start);
        tl.to(em, { opacity: 0, duration: dur * 0.35, ease: "power1.in" }, start + dur * 0.65);
      }
      // a burst of sparks thrown up by the boom
      for (var s2 = 0; s2 < 16; s2++) {
        var ks = document.createElement("div");
        ks.className = "f01-em";
        var ksz = 3 + E() * 4;
        ks.style.width = ksz + "px";
        ks.style.height = ksz + "px";
        embers.appendChild(ks);
        var ang = -Math.PI / 2 + (E() - 0.5) * 2.2;
        var dist = 260 + E() * 420;
        var kd = 0.9 + E() * 0.7;
        tl.fromTo(ks, { x: 960, y: 540, scale: 1.4 },
          { x: 960 + Math.cos(ang) * dist, y: 540 + Math.sin(ang) * dist, scale: 0.3, duration: kd, ease: "power3.out" }, T_BOOM);
        tl.fromTo(ks, { opacity: 0 }, { opacity: 1, duration: 0.001 }, T_BOOM);
        tl.to(ks, { opacity: 0, duration: kd * 0.6, ease: "power1.in" }, T_BOOM + kd * 0.4);
      }

      /* ---------- 宣和二年 · 汴京 (1.45): gold script writes on, done by 2.8 ---------- */
      tl.set("#f01-label", { visibility: "hidden" }, 0);  // the mask var is unset before 1.45s, so hide the label outright
      tl.set("#f01-label", { visibility: "visible" }, T_YEAR);
      tl.fromTo("#f01-label", { "--f01-w": "-4%" }, { "--f01-w": "100%", duration: 2.8 - T_YEAR, ease: "power2.out" }, T_YEAR);
      tl.fromTo("#f01-label", { x: -36 }, { x: 0, duration: 0.5, ease: "power4.out" }, T_YEAR);
      tl.fromTo("#f01-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "expo.out" }, T_YEAR + 0.05);
      // label micro-drift (never frozen)
      tl.to("#f01-label", { x: 10, duration: D - 2.0, ease: "none" }, 2.0);

      /* ---------- Scene 3 (3.57): 天下第一繁华 writes on center-low ---------- */
      tl.fromTo("#f01-scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, T_GLORY - 0.1);
      tl.fromTo("#f01-main", { "--f01-w": "-3%" }, { "--f01-w": "100%", duration: 0.9, ease: "power2.out" }, T_GLORY);
      tl.fromTo("#f01-mainwrap", { scale: 1.16, y: 10 }, { scale: 1, y: 0, duration: 0.35, ease: "power4.out" }, T_GLORY);
      tl.to("#f01-mainwrap", { scale: 1.035, duration: D - (T_GLORY + 0.35), ease: "none" }, T_GLORY + 0.35);
      // glowing brush nib rides the wipe's leading edge
      tl.fromTo("#f01-nib", { x: 16 }, { x: 830, duration: 0.9, ease: "power2.out" }, T_GLORY);
      tl.fromTo("#f01-nib", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, T_GLORY);
      tl.to("#f01-nib", { opacity: 0, duration: 0.2, ease: "power1.in" }, T_GLORY + 0.75);

      window.__timelines["01-glory"] = tl;
    })();
  </script>
</template>
