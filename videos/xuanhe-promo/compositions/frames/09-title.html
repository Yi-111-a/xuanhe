      var wctx = work.getContext("2d", { willReadFrequently: true });
      var rim = document.createElement("canvas");
      rim.width = W / LOW; rim.height = H / LOW;
      var rctx = rim.getContext("2d");
      var INK_END = 1.55;
      var blobs = (function () {
        var r = lcg(0x09b100d5), list = [];
        for (var i = 0; i < 11; i++) {
          var a = (i / 11) * Math.PI * 2 + r() * 0.5;
          var outer = i % 2 === 1;
          list.push({
            dx: Math.cos(a), dy: Math.sin(a) * 0.82,
            dist: outer ? 0.92 + 0.22 * r() : 0.5 + 0.25 * r(),
            size: outer ? 0.16 + 0.1 * r() : 0.34 + 0.16 * r(),
            lag: 0.02 + 0.1 * r(),
            wob: 0.04 + 0.05 * r(), wf: 3 + Math.floor(r() * 4), wp: r() * Math.PI * 2
          });
        }
        return list;
      })();
      function inkRadius(t) {
        if (t <= 0.04) return 0;
        if (t < 0.5) return 330 * easeOutCubic((t - 0.04) / 0.46);
        return 330 + (1380 - 330) * easeOutQuart(clamp01((t - 0.5) / 1.0));
      }
      function paintInk(t) {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, W, H);
        if (t >= INK_END) return;
        ctx.fillStyle = "#0b0907";
        ctx.fillRect(0, 0, W, H);
        var R = inkRadius(t);
        if (R <= 0.5) return;
        wctx.filter = "none";
        wctx.clearRect(0, 0, work.width, work.height);
        wctx.filter = "blur(7px)";
        wctx.fillStyle = "#ffffff";
        wctx.beginPath();
        wctx.arc(CX / LOW, CY / LOW, (R * 0.86) / LOW, 0, Math.PI * 2);

        for (var i = 0; i < blobs.length; i++) {
          var b = blobs[i];

          var wob = Math.sin(t * b.wf * 2.2 + b.wp) * b.wob * Rb;
          var x = CX + b.dx * (b.dist * Rb) + wob * b.dy;
          var y = CY + b.dy * (b.dist * Rb) - wob * b.dx;
          var rr = b.size * Rb;
          if (rr < 1) continue;
          wctx.beginPath();
          wctx.arc(x / LOW, y / LOW, rr / LOW, 0, Math.PI * 2);
          wctx.fill();
        }
        wctx.filter = "none";
        var img = wctx.getImageData(0, 0, work.width, work.height);
        var d = img.data;
        for (var j = 3; j < d.length; j += 4) {
          var a = (d[j] / 255) * 22 - 9;
          d[j] = a <= 0 ? 0 : a >= 1 ? 255 : Math.round(a * 255);

        wctx.putImageData(img, 0, 0);
        // ember halo = blurred hole, tinted
        rctx.globalCompositeOperation = "source-over";
        rctx.filter = "none";

      var splats = (function () {

        var cols = ["#c23a26", "#e8792e", "#c23a26", "#7a1f12"];
        for (var i = 0; i < 28; i++) {

          list.push({ el: c, dx: Math.cos(a), dy: Math.sin(a), dist: 220 + 380 * r(), rad: 3 + (i % 5 === 0 ? 18 : 9) * r(), sp: 0.7 + 0.5 * r() });

        var nl = Math.max(0, Math.min(LABEL.length, Math.floor((t - LABEL_T0) / LABEL_STEP + 1e-6) + 1));
