  <div id="root" data-composition-id="03-fall" data-width="1920" data-height="1080" data-duration="6.3">

  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var root = document.querySelector('[data-composition-id="03-fall"]');
      function $(sel) { return root.querySelector(sel); }
      var DUR = 6.3;
      var W = 1920, H = 1080;
      var TAU = Math.PI * 2;
      var CUTS = [0.30, 1.90, 3.43, 5.04];
      var FADE_START = 5.9;

      // deterministic hash (no Math.random)
      function rnd(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      function frac(x) { return x - Math.floor(x); }

      var tl = gsap.timeline({ paused: true });

      /* ---------- shots + camera pushes ---------- */
      var shots = [$("#f03-shot1"), $("#f03-shot2"), $("#f03-shot3"), $("#f03-shot4")];

      // Shot 1: fast push 1.0 -> 1.15, the cavalry rushes the lens (accelerates into the cut)
      tl.fromTo("#f03-push1", { scale: 1.0, x: 0, y: 0 }, { scale: 1.15, x: -10, y: 14, duration: CUTS[1] - CUTS[0], ease: "power1.in" }, CUTS[0]);
      // Shot 2: push with lateral drift right
      tl.fromTo("#f03-push2", { scale: 1.04, x: -10 }, { scale: 1.13, x: 70, duration: CUTS[2] - CUTS[1], ease: "power2.inOut" }, CUTS[1]);
      // Shot 3: slow push into the burning gate
      tl.fromTo("#f03-push3", { scale: 1.02 }, { scale: 1.12, duration: CUTS[3] - CUTS[2], ease: "power1.inOut" }, CUTS[2]);
      // Shot 4: slow pull 1.08 -> 1.0
      tl.fromTo("#f03-push4", { scale: 1.08 }, { scale: 1.0, duration: DUR - CUTS[3], ease: "power2.out" }, CUTS[3]);

      // camera kick on the three loud slams (3 frames + settle); punch-in on the cut
      var kicks = [
        { t: CUTS[0], x: 12, y: -8, r: -0.6, s: 1.07 },
        { t: CUTS[1], x: -12, y: 7, r: 0.6, s: 1.06 },
        { t: CUTS[2], x: 10, y: 10, r: -0.5, s: 1.08 }
      ];
      kicks.forEach(function (k, i) {
        tl.fromTo("#f03-kick", { x: k.x, y: k.y, rotation: k.r, scale: k.s },
          { x: -k.x * 0.6, y: -k.y * 0.6, rotation: -k.r * 0.6, scale: k.s - 0.02, duration: 0.034, ease: "none", immediateRender: i === 0 }, k.t);
        tl.to("#f03-kick", { x: k.x * 0.3, y: k.y * 0.3, rotation: k.r * 0.3, scale: 1.02, duration: 0.033, ease: "none" }, k.t + 0.034);
        tl.to("#f03-kick", { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.2, ease: "power3.out" }, k.t + 0.067);
      });
      // (before the first cut the shot is ink; the kick's start state is invisible there)

      /* ---------- slams ---------- */
      function slam(i, t, opts) {
        var word = "#f03-word" + i, echo = "#f03-echo" + i;
        tl.fromTo(word,
          { autoAlpha: 0, scale: opts.from || 1.35, filter: "blur(10px)" },
          { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power4.out" }, t);
        // continued micro-settle so the word never freezes
        tl.fromTo(word, { scale: 1 }, { scale: opts.drift || 0.965, duration: opts.hold, ease: "none", immediateRender: false }, t + 0.12);
        if (opts.echo !== false) {
          tl.fromTo(echo, { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 1.55, duration: 0.42, ease: "power2.out" }, t);
        }
      }
      slam(1, CUTS[0], { hold: CUTS[1] - CUTS[0] - 0.12 });
      slam(2, CUTS[1], { hold: CUTS[2] - CUTS[1] - 0.12 });
      slam(3, CUTS[2], { from: 1.45, hold: CUTS[3] - CUTS[2] - 0.12, drift: 1.04 });
      // Shot 4: the blow lands quiet — no flash, no kick, no splatter
      tl.fromTo("#f03-word4",
        { autoAlpha: 0, scale: 1.12, filter: "blur(8px)" },
        { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, CUTS[3]);
      tl.fromTo("#f03-word4", { scale: 1 }, { scale: 0.975, duration: DUR - CUTS[3] - 0.3, ease: "none", immediateRender: false }, CUTS[3] + 0.3);

      // ink swash behind 汴京城破 (wipes in left -> right on the hit)
      tl.fromTo("#f03-swash3", { scaleX: 0, opacity: 0.86 }, { scaleX: 1, duration: 0.14, ease: "expo.out" }, CUTS[2] - 0.02);

      // heat pulse on the burning gate
      tl.fromTo("#f03-heat", { opacity: 0.9 }, { opacity: 0.25, duration: 0.6, ease: "power2.out" }, CUTS[2]);
      tl.to("#f03-heat", { opacity: 0.5, duration: DUR - CUTS[2] - 0.6 - 1.4, ease: "sine.inOut" }, CUTS[2] + 0.6);

      /* ---------- ink / cinnabar splatter bursts ---------- */
      function splatter(i, t, count, reach, seed) {
        var host = $("#f03-splat" + i);
        for (var b = 0; b < count; b++) {
          var a = TAU * rnd(seed + b * 3.1);
          var d = reach * (0.35 + 0.65 * rnd(seed + b * 5.7));
          var size = 8 + 54 * Math.pow(rnd(seed + b * 7.3), 2);
          var isRed = rnd(seed + b * 9.9) > 0.45;
          var el = document.createElement("div");
          el.className = "f03-blob";
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.marginLeft = (-size / 2) + "px";
          el.style.marginTop = (-size / 2) + "px";
          el.style.background = isRed ? "#c23a26" : "#0b0907";
          host.appendChild(el);
          var tx = Math.cos(a) * d * 1.6, ty = Math.sin(a) * d * 0.7;
          var stretch = 1 + 1.8 * rnd(seed + b * 2.2);
          var rot = a * 180 / Math.PI;
          tl.fromTo(el,
            { x: 0, y: 0, scaleX: 0.2, scaleY: 0.2, rotation: rot, opacity: 0 },
            { x: tx, y: ty, scaleX: stretch, scaleY: 1, opacity: 0.95, duration: 0.16, ease: "power4.out" }, t);
          tl.to(el, { x: tx * 1.12, y: ty * 1.12 + 18, scaleX: 1, opacity: 0, duration: 0.55 + 0.4 * rnd(seed + b), ease: "power2.in" }, t + 0.16);
        }
      }
      splatter(1, CUTS[0], 22, 360, 11);
      splatter(2, CUTS[1], 22, 360, 211);
      splatter(3, CUTS[2], 34, 520, 411);

      /* ---------- particles (positions are pure functions of time) ---------- */
      var field = $("#f03-particles");
      function mk(cls, size, op) {
        var el = document.createElement("div");
        el.className = "f03-p " + cls;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.marginLeft = (-size / 2) + "px";
        el.style.marginTop = (-size / 2) + "px";
        el.style.opacity = op;
        field.appendChild(el);
        return el;
      }
      // Shot 1: snow rushing at the lens (radial stream from the vanishing point)
      var rush = [];
      for (var i = 0; i < 120; i++) {
        var s = 2 + 4 * rnd(i + 40);
        rush.push({ el: mk("f03-flake", s, 1), a: TAU * rnd(i + 1000), ph: rnd(i + 2000), sp: 0.9 + 0.9 * rnd(i + 3000), base: rnd(i + 4000) });
      }
      // Shots 2–3: embers rising
      var embers = [];
      for (var j = 0; j < 80; j++) {
        var es = 3 + 5 * rnd(j + 500);
        embers.push({ el: mk("f03-ember", es, 1), x: rnd(j + 600) * W, ph: rnd(j + 700), sp: 0.35 + 0.5 * rnd(j + 800), sw: 20 + 60 * rnd(j + 900), sf: 0.6 + 1.4 * rnd(j + 950), fl: TAU * rnd(j + 990) });
      }
      // Shot 4 (+ light in shot 2): slow falling snow
      var fall = [];
      for (var k = 0; k < 110; k++) {
        var depth = rnd(k + 5000);
        var fs = 2 + 9 * depth * depth;
        var fe = mk("f03-flake", fs, 0.35 + 0.4 * depth);
        if (depth > 0.85) fe.style.filter = "blur(2px)";
        fall.push({ el: fe, x: frac(k * 0.6180339887 + 0.07) * W, ph: frac(k * 0.41421356 + 0.37), sp: 0.12 + 0.18 * depth, sw: 8 + 22 * depth, sf: 0.5 + rnd(k + 5100), sph: TAU * rnd(k + 5200), op: 0.35 + 0.4 * depth });
      }

      var shakeEl = $("#f03-shake");
      var grainEl = $("#f03-grain-tex");
      var flashEl = $("#f03-flash");
      var flashEmberEl = $("#f03-flash-ember");
      var lastShot = -2;

      function shotAt(t) {
        if (t < CUTS[0]) return -1;
        if (t < CUTS[1]) return 0;
        if (t < CUTS[2]) return 1;
        if (t < CUTS[3]) return 2;
        return 3;
      }
      function flashAt(t, at, len) {
        var d = t - at;
        if (d < 0 || d >= len) return 0;
        return 1 - d / len;
      }

      function render(t) {
        var sh = shotAt(t);
        if (sh !== lastShot) {
          for (var q = 0; q < shots.length; q++) shots[q].style.visibility = q === sh ? "visible" : "hidden";
          lastShot = sh;
        }

        // flash cuts: 2-frame snow flash on cuts 1 & 2, ember flash on cut 3, none on cut 4
        flashEl.style.opacity = Math.max(flashAt(t, CUTS[0], 0.09), flashAt(t, CUTS[1], 0.09) * 0.92).toFixed(3);
        flashEmberEl.style.opacity = (flashAt(t, CUTS[2], 0.12) * 0.95).toFixed(3);

        // handheld rumble that spikes after each loud slam
        var amp = sh < 0 ? 0 : 1.4;
        var strengths = [1.0, 0.85, 1.15];
        for (var c = 0; c < 3; c++) {
          if (t >= CUTS[c]) amp += strengths[c] * 13 * Math.exp(-(t - CUTS[c]) * 6.5);
        }
        if (sh === 3) amp = 0.9;
        var sx = amp * (0.6 * Math.sin(t * 13.7) + 0.4 * Math.sin(t * 23.1 + 1.3));
        var sy = amp * 0.8 * (0.6 * Math.sin(t * 15.3 + 0.7) + 0.4 * Math.sin(t * 29.7 + 2.1));
        var sr = amp * 0.03 * Math.sin(t * 9.1 + 0.3);
        shakeEl.style.transform = "translate(" + sx.toFixed(2) + "px," + sy.toFixed(2) + "px) rotate(" + sr.toFixed(3) + "deg)";

        // grain: jumps every 1/24s
        var gf = Math.floor(t * 24);
        grainEl.style.transform = "translate(" + Math.round((rnd(gf + 77) - 0.5) * 400) + "px," + Math.round((rnd(gf + 133) - 0.5) * 240) + "px)";

        // snow rush (shot 1)
        var showRush = sh === 0;
        for (var r = 0; r < rush.length; r++) {
          var f = rush[r];
          if (!showRush) { f.el.style.visibility = "hidden"; continue; }
          var z = frac(f.ph + t * f.sp);
          var dist = 30 + z * z * 1250;
          var px = 900 + Math.cos(f.a) * dist * 1.15;
          var py = 470 + Math.sin(f.a) * dist * 0.8;
          var sc = 0.4 + z * 1.5;
          var stretch = 1 + z * 3.2;
          f.el.style.visibility = "visible";
          f.el.style.opacity = (Math.min(1, z * 3) * (0.55 + 0.35 * f.base)).toFixed(3);
          f.el.style.transform = "translate(" + px.toFixed(1) + "px," + py.toFixed(1) + "px) rotate(" + (f.a * 180 / Math.PI).toFixed(1) + "deg) scale(" + (sc * stretch).toFixed(2) + "," + sc.toFixed(2) + ")";
        }

        // embers (shots 2 & 3; denser and faster in 3)
        var showEmb = sh === 1 || sh === 2;
        var boost = sh === 2 ? 1.5 : 1.0;
        for (var e = 0; e < embers.length; e++) {
          var m = embers[e];
          if (!showEmb || (sh === 1 && e % 3 === 0)) { m.el.style.visibility = "hidden"; continue; }
          var yy = frac(m.ph + t * m.sp * boost);
          var ey = H + 40 - yy * (H + 120);
          var ex = m.x + m.sw * Math.sin(t * m.sf * TAU * 0.5 + m.fl) + yy * 120;
          var flick = 0.55 + 0.45 * Math.sin(t * 17 + m.fl * 3);
          m.el.style.visibility = "visible";
          m.el.style.opacity = (flick * Math.min(1, (1 - yy) * 3)).toFixed(3);
          m.el.style.transform = "translate(" + ex.toFixed(1) + "px," + ey.toFixed(1) + "px)";
        }

        // falling snow (light in shot 2, full in shot 4)
        var showFall = sh === 1 || sh === 3;
        for (var g = 0; g < fall.length; g++) {
          var fl = fall[g];
          if (!showFall || (sh === 1 && g % 2 === 0)) { fl.el.style.visibility = "hidden"; continue; }
          var fy = frac(fl.ph + t * fl.sp);
          var yv = -20 + fy * (H + 40);
          var xv = fl.x + fl.sw * Math.sin(t * fl.sf * TAU * 0.4 + fl.sph) - fy * 60;
          fl.el.style.visibility = "visible";
          fl.el.style.transform = "translate(" + xv.toFixed(1) + "px," + yv.toFixed(1) + "px)";
        }
      }

      var clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      // 5.9s: the music drops out — the picture sinks to ink by 6.3s (packet-specified)
      tl.fromTo("#f03-ink", { opacity: 0 }, { opacity: 1, duration: DUR - FADE_START, ease: "power1.in" }, FADE_START);

      render(0);
      window.__timelines["03-fall"] = tl;
    })();
  </script>
</template>
