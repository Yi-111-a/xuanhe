                  <svg id="f08-ct2" class="f08-ctick" viewBox="0 0 46 46" style="top:355px;"><path class="f08-ctp" d="M6 25 L18 37 L41 9" fill="none" stroke="#d6b46a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var D = 6.5;
      var FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="08-engine"]') || document;
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      // seeded PRNG (deterministic)
      var seed = 80808;
      function rnd() {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      var tl = gsap.timeline({ paused: true });

      // ---------- embers (built once, each one linear rise across the whole shot) ----------
      var emberLayer = q("#f08-embers");
      for (var i = 0; i < 46; i++) {
        var e = document.createElement("div");
        e.className = "f08-ember";
        var sz = 2 + rnd() * 4.5;
        var x0 = rnd() * 1920;
        var y0 = 260 + rnd() * 900;
        e.style.width = sz.toFixed(1) + "px";
        e.style.height = sz.toFixed(1) + "px";
        e.style.left = x0.toFixed(1) + "px";
        e.style.top = y0.toFixed(1) + "px";
        emberLayer.appendChild(e);
        var rise = 420 + rnd() * 520;
        var drift = (rnd() - 0.5) * 160;
        var op = 0.35 + rnd() * 0.6;
        tl.fromTo(e, { x: 0, y: 0, opacity: op }, { x: drift, y: -rise, opacity: op * 0.55, duration: D, ease: "none" }, 0);
      }

      // ---------- grain: stepped deterministic jitter ----------
      var grain = q("#f08-grain-tex");
      for (var g = 0; g * 0.083 < D; g++) {
        tl.set(grain, { x: Math.round((rnd() - 0.5) * 400), y: Math.round((rnd() - 0.5) * 300) }, g * 0.083);
      }

      // ---------- macro camera: slow push under everything ----------
      tl.fromTo("#f08-cam", { scale: 1.0 }, { scale: 1.035, duration: D, ease: "none" }, 0);

      function kick(t, dir) {
        tl.to("#f08-cam", { x: 9 * dir, y: -7, rotation: 0.6 * dir, duration: FR, ease: "none" }, t);
        tl.to("#f08-cam", { x: -7 * dir, y: 5, rotation: -0.45 * dir, duration: FR, ease: "none" }, t + FR);
        tl.to("#f08-cam", { x: 0, y: 0, rotation: 0, duration: FR, ease: "none" }, t + 2 * FR);
      }

      function splatter(sel, t) {
        var host = q(sel);
        var cols = ["#c23a26", "#c23a26", "#e8792e", "#8e2416"];
        for (var k = 0; k < 22; k++) {
          var b = document.createElement("div");
          b.className = "f08-blob";
          var r = k < 4 ? 13 + rnd() * 13 : 3 + rnd() * 9;
          b.style.width = (2 * r).toFixed(1) + "px";
          b.style.height = (2 * r).toFixed(1) + "px";
          b.style.left = (-r).toFixed(1) + "px";
          b.style.top = (-r).toFixed(1) + "px";
          b.style.background = cols[k % cols.length];
          host.appendChild(b);
          var ang = rnd() * Math.PI * 2;
          var dist = (k < 4 ? 60 : 110) + rnd() * 250;
          var dx = Math.cos(ang) * dist * 1.25, dy = Math.sin(ang) * dist * 0.4;
          tl.fromTo(b, { x: 0, y: 0, scale: 0.15, opacity: 0 },
            { x: dx, y: dy, scale: 1, opacity: 0.85, duration: 0.16, ease: "power4.out" }, t);
          tl.to(b, { opacity: 0.26, scale: 1.08, duration: 0.9, ease: "power2.out" }, t + 0.18);
        }
      }

      function slam(sel, t, tilt) {
        tl.fromTo(sel, { scale: 1.35, opacity: 0, rotation: tilt * 2.2, filter: "blur(6px)" },
          { scale: 1, opacity: 1, rotation: tilt, filter: "blur(0px)", duration: 0.12, ease: "power4.out" }, t);
      }

      // =========================== Scene 1 (0 – 2.55) ===========================
      tl.set("#f08-s2", { autoAlpha: 0 }, 0);
      tl.set("#f08-s1", { autoAlpha: 1 }, 0);

      // shimmer @0.3: ember flare in the ground
      tl.fromTo("#f08-ground", { opacity: 0.75 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.25);

      // 「满朝文武」 slam @0.50
      splatter("#f08-splat1", 0.5);
      slam("#f08-slam1", 0.5, -2);
      kick(0.5, 1);
      tl.to("#f08-slam1", { x: 10, duration: 2.0, ease: "none" }, 0.62);

      // 童贯 reply card whips in behind (just ahead of 「由 AI 来演」)
      tl.fromTo("#f08-aud", { x: 300, rotationY: 0, rotation: 6, scale: 0.68, opacity: 0, filter: "blur(10px)" },
        { x: 0, rotation: 2.5, scale: 0.68, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 1.36);
      tl.to("#f08-aud", { x: -14, duration: 0.74, ease: "none" }, 1.61);

      // 「由 AI 来演」 @1.54: three minister cards fan in from below, staggered 0.1s
      var fans = [
        { id: "#f08-fan1", cx: 610, tilt: -7, t: 1.54 },
        { id: "#f08-fan2", cx: 960, tilt: -1, t: 1.64 },
        { id: "#f08-fan3", cx: 1310, tilt: 6, t: 1.74 }
      ];
      fans.forEach(function (f) {
        tl.fromTo(f.id, { x: (960 - f.cx) * 0.55, y: 640, rotation: f.tilt * 3.2, scale: 0.66, opacity: 1 },
          { x: 0, y: 0, rotation: f.tilt, scale: 0.8, duration: 0.42, ease: "power4.out" }, f.t);
        tl.to(f.id, { y: -8, duration: 2.42 - (f.t + 0.42), ease: "none" }, f.t + 0.42);
      });

      // gold label
      tl.fromTo("#f08-label1", { clipPath: "inset(0% 100% 0% 0%)", x: -16 },
        { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.45, ease: "power3.out" }, 1.92);

      // =========================== Scene 2 (2.55 – 6.5) ===========================
      // cards whip away (down / right), hard cut on the drum with an ember flash
      tl.to("#f08-fan1", { y: 820, x: -120, rotation: -22, duration: 0.2, ease: "expo.in" }, 2.36);
      tl.to("#f08-fan2", { y: 860, rotation: 10, duration: 0.2, ease: "expo.in" }, 2.39);
      tl.to("#f08-fan3", { y: 820, x: 160, rotation: 24, duration: 0.2, ease: "expo.in" }, 2.42);
      tl.to("#f08-aud", { x: 1300, rotation: 10, duration: 0.2, ease: "expo.in" }, 2.36);

      tl.set("#f08-s1", { autoAlpha: 0 }, 2.55);
      tl.set("#f08-s2", { autoAlpha: 1 }, 2.55);
      tl.set("#f08-flash", { opacity: 0.85 }, 2.55);
      tl.to("#f08-flash", { opacity: 0, duration: 0.07, ease: "none" }, 2.55 + 2 * FR);

      // 「钱粮兵马」 slam @2.55
      splatter("#f08-splat2", 2.55);
      slam("#f08-slam2", 2.55, 1.5);
      kick(2.55, -1);
      tl.to("#f08-slam2", { x: 8, duration: 3.8, ease: "none" }, 2.67);

      // 「由引擎结算」 @3.49: ledger intel card whips in
      tl.fromTo("#f08-ledger", { x: 520, rotationY: -22, opacity: 0, filter: "blur(12px)" },
        { x: 0, rotationY: -5, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 3.49);
      kick(3.49, 1);

      // zoom-to-target (nested wrappers: outer scales, inner counter-translates by -offset)
      // initial view: scroll + 度支 column (source centre 1207.5,540) at 0.79
      // target: 度支 rows 国库→民心 (source centre 1582,390) at 1.42 → offset (622,-150)
      tl.fromTo("#f08-zo", { scale: 0.79 }, { scale: 1.42, duration: 1.0, ease: "power3.inOut" }, 3.62);
      tl.fromTo("#f08-zi", { x: -247.5, y: 0 }, { x: -622, y: 150, duration: 1.0, ease: "power3.inOut" }, 3.62);
      tl.fromTo("#f08-vig", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 3.62);

      // four 期初→期末 rows get gold ticks in sequence (3.65 – 4.55), mirrored in the left settlement log
      var TICKS = [3.65, 3.95, 4.25, 4.55];
      var ctp = qa(".f08-ctp");
      var ltp = qa(".f08-tickp");
      TICKS.forEach(function (t, n) {
        var k = n + 1;
