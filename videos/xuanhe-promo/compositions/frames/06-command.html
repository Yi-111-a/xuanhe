    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var ID = "06-command";
        var FPS = 30;
        var F = 1 / FPS;
        var SVGNS = "http://www.w3.org/2000/svg";
        var $ = function (id) { return document.getElementById(id); };

        // VO cues (seconds, frame-local)
        var T_EDICT = 0.15;   // 一纸诏书
        var T_CHARGE = 1.23;  // 调西军北上
        var T_FAR = 2.5;      // 千里之外
        var T_ORDER = 3.45;   // 军令要走好几季
        var T_STAMP = 4.62;   // 令达于下季 lands
        var END = 5.95;

        // deterministic PRNG (mulberry32)
        function rng(seed) {
          var a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            var t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        var tl = gsap.timeline({ paused: true });

        // ---------- helpers ----------
        function kick(t, amp) {
          var k = document.querySelectorAll("#f06-s1-bg .f06-kick, #f06-s1-card .f06-kick, #f06-s1-slam .f06-kick, #f06-s2-bg .f06-kick, #f06-s2-slam .f06-kick, #f06-s3-map .f06-kick, #f06-s3-text .f06-kick, #f06-s4-card .f06-kick, #f06-s4-slam .f06-kick");
          var a = amp || 1;
          tl.set(k, { x: 8 * a, y: -6 * a, rotation: 0.6 * a }, t);
          tl.set(k, { x: -7 * a, y: 5 * a, rotation: -0.5 * a }, t + F);
          tl.set(k, { x: 4 * a, y: -2 * a, rotation: 0.25 * a }, t + 2 * F);
          tl.set(k, { x: 0, y: 0, rotation: 0 }, t + 3 * F);
        }
        function slam(el, t, rot) {
          tl.fromTo(el, { scale: 1.35, rotation: rot || 0 }, { scale: 1, rotation: rot || 0, duration: 0.12, ease: "power4.out" }, t);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, t);
        }
        function splatter(svg, seed, cx, cy, spreadX, spreadY, color, n, t) {
          var r = rng(seed);
          var dots = [];
          for (var i = 0; i < n; i++) {
            var c = document.createElementNS(SVGNS, "circle");
            var ang = r() * Math.PI * 2;
            var dist = Math.pow(r(), 0.7);
            var big = i < 5;
            c.setAttribute("cx", (cx + Math.cos(ang) * spreadX * dist * (big ? 0.35 : 1)).toFixed(1));
            c.setAttribute("cy", (cy + Math.sin(ang) * spreadY * dist * (big ? 0.35 : 1)).toFixed(1));
            c.setAttribute("fill", color);
            c.setAttribute("r", "0");
            svg.appendChild(c);
            var rad = big ? 20 + r() * 26 : 3 + r() * 13;
            dots.push(c);
            tl.fromTo(c, { attr: { r: 0 }, opacity: 0.95 }, { attr: { r: rad }, duration: 0.16 + r() * 0.08, ease: "expo.out" }, t + r() * 0.04);
            tl.to(c, { opacity: big ? 0.5 : 0.35, duration: 0.6, ease: "power1.out" }, t + 0.2);
          }
          return dots;
        }
        function measureDraw(el) {
          var len = el.getTotalLength();
          el.style.strokeDasharray = len + " " + len;
          el.style.strokeDashoffset = String(len);
          return len;
        }

        // ================= Scene 1 (0 - 1.23) =================
        tl.fromTo("#f06-court-img", { scale: 1.0, x: 0 }, { scale: 1.08, x: -30, duration: T_CHARGE, ease: "none" }, 0);
        // intel-card whip in
        tl.fromTo("#f06-edict-card",
          { x: 240, rotationY: -14, transformPerspective: 1800, opacity: 0, filter: "blur(10px)" },
          { x: 0, rotationY: -7, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, T_EDICT);
        // zoom-to-target onto the edict clause list (source centre 960,390)
        var EC = 1180 / 1920;
        tl.fromTo("#f06-edict-outer", { scale: 1 }, { scale: 1.42, duration: 0.55, ease: "power3.inOut" }, 0.42);
        tl.fromTo("#f06-edict-inner", { x: 0, y: 0 }, { x: 0, y: -(390 - 540) * EC, duration: 0.55, ease: "power3.inOut" }, 0.42);
        tl.to("#f06-edict-outer", { scale: 1.48, duration: T_CHARGE - 0.97, ease: "none" }, 0.97);
        tl.fromTo("#f06-edict-card .f06-card-sheen", { xPercent: -60 }, { xPercent: 60, duration: 0.7, ease: "power2.inOut" }, 0.3);
        // slam-sm 一纸诏书
        slam("#f06-slam1", 0.24);
        kick(0.36, 0.8);

        // ================= Scene 2 (1.23 - 2.50) =================
        tl.set("#f06-flash", { opacity: 1 }, T_CHARGE);
        tl.to("#f06-flash", { opacity: 0, duration: 2 * F, ease: "none" }, T_CHARGE + F);
        tl.fromTo("#f06-xijun-img", { scale: 1.04, x: 0, y: 0 }, { scale: 1.2, x: -36, y: 6, duration: T_FAR - T_CHARGE, ease: "power2.out" }, T_CHARGE);
        // dust: streaks + puffs racing left with the cavalry
        (function () {
          var r = rng(606);
          var dust = $("f06-dust");
          var dur = T_FAR - T_CHARGE;
          for (var i = 0; i < 16; i++) {
            var s = document.createElement("div");
            s.className = "f06-streak";
            var w = 160 + r() * 320;
            var y = 520 + r() * 420;
            s.style.width = w.toFixed(0) + "px";
            s.style.top = y.toFixed(0) + "px";
            s.style.left = "0px";
            s.style.opacity = (0.25 + r() * 0.45).toFixed(2);
            dust.appendChild(s);
            var x0 = 1900 + r() * 900;
            var speed = 1700 + r() * 1300;
            tl.fromTo(s, { x: x0, y: 0 }, { x: x0 - speed * dur, y: -40 * r(), duration: dur, ease: "none" }, T_CHARGE);
          }
          for (var j = 0; j < 7; j++) {
            var p = document.createElement("div");
            p.className = "f06-puff";
            var size = 260 + r() * 340;
            p.style.width = size.toFixed(0) + "px";
            p.style.height = (size * 0.6).toFixed(0) + "px";
            p.style.left = "0px";
            p.style.top = (560 + r() * 320).toFixed(0) + "px";
            dust.appendChild(p);
            var px0 = 200 + r() * 1700;
            tl.fromTo(p, { x: px0, scale: 0.8 }, { x: px0 - 520 - r() * 300, scale: 1.25, duration: dur, ease: "none" }, T_CHARGE);
          }
        })();
        // slam 调西军北上 + cinnabar splatter
        splatter($("f06-splat2"), 2026, 640, 195, 520, 150, "#c23a26", 26, T_CHARGE + 0.03);
        slam("#f06-slam2", T_CHARGE);
        kick(T_CHARGE + 0.12, 1.2);
        tl.to("#f06-slam2", { scale: 1.04, duration: T_FAR - T_CHARGE - 0.12, ease: "none" }, T_CHARGE + 0.12);

        // ================= embers (1.23 - 5.95) =================
        (function () {
          var r = rng(1126);
          var host = $("f06-embers");
          var dur = END - T_CHARGE;
          for (var i = 0; i < 42; i++) {
            var e = document.createElement("div");
            e.className = "f06-ember";
            var sz = 2 + r() * 5;
            e.style.width = sz.toFixed(1) + "px";
            e.style.height = sz.toFixed(1) + "px";
            e.style.left = "0px";
            e.style.top = "0px";
            host.appendChild(e);
            var x0 = 80 + r() * 1900;
            var y0 = 600 + r() * 520;
            var rise = 700 + r() * 900;
            var drift = -(200 + r() * 700);
            var op = 0.45 + r() * 0.5;
            tl.fromTo(e, { x: x0, y: y0, opacity: op }, { x: x0 + drift, y: y0 - rise, opacity: op * 0.6, duration: dur, ease: "none" }, T_CHARGE);
          }
        })();

        // ================= Scene 3 (2.50 - 3.45) =================
        tl.fromTo("#f06-map-cam", { scale: 1.13, filter: "blur(7px)" }, { scale: 1.03, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, T_FAR);
        tl.to("#f06-map-cam", { scale: 1.09, x: 10, duration: END - T_FAR - 0.2, ease: "power1.inOut" }, T_FAR + 0.2);
        // ember route self-draws from the bottom edge north to 燕京 (svg-path-draw, dashed via mask)
        var mPath = $("f06-route-mask-path");
        var routeLen = measureDraw(mPath);
        var head = $("f06-route-head");
        var headGlow = $("f06-route-head-glow");
        var proxy = { p: 0 };
        function drawRoute() {
          var p = proxy.p;
          mPath.style.strokeDashoffset = String(routeLen * (1 - p));
          var pt = mPath.getPointAtLength(routeLen * p);
          head.setAttribute("cx", pt.x.toFixed(2));
          head.setAttribute("cy", pt.y.toFixed(2));
          headGlow.setAttribute("cx", pt.x.toFixed(2));
          headGlow.setAttribute("cy", pt.y.toFixed(2));
        }
        drawRoute();
        tl.fromTo(proxy, { p: 0 }, { p: 1, duration: 0.62, ease: "power2.out", onUpdate: drawRoute }, T_FAR + 0.1);
        // the route lands on 燕京: ring draws round the label
        var ring = $("f06-yan-ring");
        var ringGlow = $("f06-yan-ring-glow");
        var ringLen = measureDraw(ring) * 1.05;
        ring.style.strokeDasharray = ringLen + " " + ringLen;
        ring.style.strokeDashoffset = String(ringLen);
        measureDraw(ringGlow);
        ringGlow.style.strokeDasharray = ringLen + " " + ringLen;
        ringGlow.style.strokeDashoffset = String(ringLen);
        tl.fromTo([ring, ringGlow], { strokeDashoffset: ringLen }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, T_FAR + 0.6);
        tl.fromTo([head, headGlow], { attr: { r: 9 } }, { attr: { r: 14 }, duration: 0.2, ease: "power2.out" }, T_FAR + 0.62);
        // script-sm 千里之外 — soft left→right wipe
        tl.fromTo("#f06-script", { clipPath: "inset(0% 100% 0% 0%)", x: -12 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.42, ease: "power2.out" }, T_FAR + 0.06);

        // ================= Scene 4 (3.45 - 5.95) =================
        tl.fromTo("#f06-map-dim", { opacity: 0 }, { opacity: 0.74, duration: 0.18, ease: "power2.out" }, T_ORDER);
        tl.fromTo("#f06-receipt-card",
          { x: 240, rotationY: -15, transformPerspective: 1800, opacity: 0, filter: "blur(10px)" },
          { x: 0, rotationY: -6, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, T_ORDER);
        // zoom-to-target onto the 「缓」 clause (source window centre 820,765)
        var RC = 1240 / 1920;
        var RZ = 2.3;
        var RX = 820, RY = 765;
        tl.fromTo("#f06-receipt-outer", { scale: 1 }, { scale: RZ, duration: 0.62, ease: "power3.inOut" }, 3.82);
        tl.fromTo("#f06-receipt-inner", { x: 0, y: 0 }, { x: -(RX - 960) * RC, y: -(RY - 540) * RC, duration: 0.62, ease: "power3.inOut" }, 3.82);
        tl.to("#f06-receipt-outer", { scale: 2.38, duration: END - 4.44, ease: "none" }, 4.44);
        tl.fromTo("#f06-receipt-card .f06-card-sheen", { xPercent: -60 }, { xPercent: 60, duration: 0.7, ease: "power2.inOut" }, 3.6);
        // cinnabar marks: ring round 缓, underline under 驿程遥远 · 令达于下季
        var mRing = $("f06-mark-ring");
        var mLine = $("f06-mark-line");
        var mRingLen = measureDraw(mRing);
        var mLineLen = measureDraw(mLine);
        tl.fromTo(mRing, { strokeDashoffset: mRingLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 4.42);
        tl.fromTo(mLine, { strokeDashoffset: mLineLen }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, 4.6);
        // cinnabar stamp 令达于下季 (−4°)
        splatter($("f06-splat3"), 1125, 260, 405, 190, 360, "#7a1e12", 22, T_STAMP - 0.09);
        tl.fromTo("#f06-seal", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power4.out" }, T_STAMP - 0.12);
        slam("#f06-slam3", T_STAMP - 0.12);
        kick(T_STAMP, 1.1);
        tl.fromTo("#f06-slam3-wrap", { scale: 1, rotation: -4 }, { scale: 1.035, rotation: -4, duration: END - T_ORDER, ease: "none" }, T_ORDER);

        // ================= grain (stepped, deterministic) =================
        (function () {
          var r = rng(77);
          var n = Math.ceil(END * 12);
          for (var i = 0; i <= n; i++) {
            tl.set("#f06-grain-svg", { x: Math.round((r() - 0.5) * 100), y: Math.round((r() - 0.5) * 100) }, i / 12);
          }
        })();

        // pad the timeline to the exact frame length
        tl.set({}, {}, END);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
