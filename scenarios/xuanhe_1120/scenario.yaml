# 新手引导：前三季（T0–T2）。target 为前端 data-testid。
tutorial:
  - {turn: 0, step: 1, title: 案上奏疏, target: desk.memorialBook,
     text: 每季中书、枢密院呈上若干奏疏，是朝政的主线。先打开奏疏册。}
  - {turn: 0, step: 2, title: 读奏疏, target: memorial.item.t0_haishang,
     text: 「海上之盟」：先看摘要，再看群臣谏言。谏言各有立场与私心，所言未必尽实。}
  - {turn: 0, step: 3, title: 批答, target: memorial.option.t0_haishang.*,
     text: 选一项批答，即加入诏书草案。各项下的提示写明代价与后果；不批者留待后议；少数奏疏写明不处置即照例施行，须留意。}
  - {turn: 0, step: 4, title: 诏书草案, target: desk.edictScroll,
     text: 批过的奏疏都汇入诏书草案。可以再批几道，也可以留待下季。}
  - {turn: 0, step: 5, title: 预览, target: edict.preview,
     text: 颁布之前先预览回执：每一条将如何执行、要花多少钱粮、有司是否可能稽迟，都会列出。}
  - {turn: 0, step: 6, title: 颁布, target: edict.promulgate,
     text: 确认无误即颁布。诏书一经颁布，本季不能收回。}
  - {turn: 0, step: 7, title: 推演, target: desk.advance,
     text: 颁布后推演一季：钱粮出入、行军、事件依次结算，下季的奏疏随之呈上。}
  - {turn: 1, step: 1, title: 政令卡, target: edict.cards,
     text: 奏疏之外，朝廷日常之事可用政令卡：任免、召还、出征、驻守、赈济、修城等。卡上写明花费与冷却。}
  - {turn: 1, step: 2, title: 填参数、加入草案, target: edict.cardAdd,
     text: 选卡后填写人物、官职、军队或地区，加入草案。卡片不直接增减君威、民心等国势，国势的起落仍看奏疏批答。}
  - {turn: 1, step: 3, title: 召对, target: desk.medallion.audience,
     text: 召对可当面问计于群臣。每季只有三次：面见、书面奏对、遣使问对都算一次，用前想清楚问谁、问什么。}
  - {turn: 1, step: 4, title: 择人召对, target: audience.pick.*,
     text: 在京者可当面召见；不在京者只能遣使问对，回奏于下季送达。}
  - {turn: 1, step: 5, title: 颁布与推演, target: edict.promulgate,
     text: 批答、政令卡都在同一道诏书里。预览无误后颁布，再推演一季。}
  - {turn: 2, step: 1, title: 廷议, target: desk.medallion.debate,
     text: 大事可付廷议，听各派当廷争论后再裁断。每季只有一次。}
  - {turn: 2, step: 2, title: 只有在京者能当廷议, target: debate.pick.*,
     text: 只有身在汴京、不在途中的大臣能当廷议；出守在外者只能递书面议状，其立场下季送达，记入谏言库。}
  - {turn: 2, step: 3, title: 开议, target: debate.start,
     text: 定好议题与与议之人，即可开议。廷议只供参考，裁断仍在陛下。}
  - {turn: 2, step: 4, title: 兵部, target: army.root,
     text: 兵部图上列出各军兵力、统帅是否在营、驻地与行程、可下的军令。统帅忠诚低、野心大或性情轻躁者，军令或被延宕、擅改，预览会标出风险高低。}
  - {turn: 2, step: 5, title: 驿程与危机计, target: desk.advance,
     text: 远方之事有驿程之迟：川峡、闽广奏报晚一季才到，诏令也晚一季才达。顶上的「胡马南牧」是金人南侵之势，只能看到风闻区间。推演吧。}
