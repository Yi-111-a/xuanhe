    - {character: li_bangyan, stance: support, option: tax, line: 陛下，花钱买官的人多着呢，排着队等。不卖白不卖。}
    - {character: li_gang, stance: oppose, option: thrift, requires: {region: bianjing}, line: 以钱得官，必以官取钱。今日入一缗，他日州县民间出十缗。名器一滥，不可复收。}
