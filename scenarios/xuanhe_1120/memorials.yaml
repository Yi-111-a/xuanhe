        - {op: adjust_army, army: xijun_qinfeng, delta: -20000, reason: 抽秦凤兵二万南讨}
        - {op: adjust_army, army: nanzheng, delta: 50000, reason: 南讨西军五万}
        - {op: set_army_commander, army: nanzheng, character: zhong_shizhong, dispatch: true}
        - {op: march, army: nanzheng, to_region: liangzhe, with_commander: false}
        - {op: set_army_posture, army: nanzheng, posture: attack}
        - {op: adjust_resource, resource: treasury, delta: -70, reason: 南讨军费}
