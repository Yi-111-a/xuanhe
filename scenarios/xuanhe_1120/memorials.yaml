- id: t_changsheng
  title: 常胜军可虑
  summary: 郭药师所部常胜军骄悍，衣粮倍于诸军；燕人降将，向背难测。金人治兵之报既至，边臣请分其众，或厚抚以结其心。
  region: hebei_dong
  illustration: event.guo_surrender
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: guo_defected_song, value: true}
      - {kind: flag, key: guo_defected_jin, operator: absent}
      - {kind: flag, key: changsheng_split, operator: absent}
      - {kind: army_strength, army: changsheng, operator: gte, value: 6000}
      - {kind: character_status, character: guo_yaoshi, value: alive}
  proposal: split
  keywords: [常胜军, 郭药师, 燕山, 降将]
  advisors:
    - {character: ma_kuo, stance: support, option: split, requires: {region: bianjing}, line: 药师之众，聚则为患，分则为用。分其半于内地，金人纵来，彼亦无所恃。}
    - {character: guo_yaoshi, stance: oppose, option: favor, requires: {region: [yanshan, hebei_dong]}, line: （自燕山驰表）末将的弟兄跟着末将吃了多少苦！朝廷若信得过，粮饷给足，末将替朝廷守燕山。}
    - {character: tong_guan, stance: oppose, option: keep, line: 药师是老奴招来的，忠心可鉴。无端分他的兵，倒叫降人寒心。}
