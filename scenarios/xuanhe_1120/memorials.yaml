  proposal: settle
  keywords: [燕山, 燕京, 燕人, 馈运]
  advisors:
    - {character: zhao_liangsi, stance: support, option: settle, line: 燕人思汉久矣！今既归朝，宜示以宽大。蠲其租赋，流亡自复。}
    - {character: wang_fu, stance: oppose, option: tax, requires: {office: [shaozai, taizai]}, line: 燕地本富，括其钱粮以给戍兵，正好省了河北转输。}
    - {character: ma_kuo, stance: neutral, option: settle, line: 燕人观望未定，此时取之，必失其心。}
  options:
    - id: settle
      label: 蠲燕地租赋，招集流亡
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 蠲燕地租赋}
        - {op: adjust_region, region: yanshan, stat: order, delta: 8}
        - {op: adjust_region, region: yanshan, stat: prosperity, delta: 4}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 燕人归心}
      hint: 国库 −40；燕京治安 +8、繁荣 +4，君威 +1
    - id: tax
      label: 括燕地钱粮以给戍兵
      ops:
        - {op: adjust_resource, resource: treasury, delta: 30, reason: 括燕地钱粮}
        - {op: adjust_region, region: yanshan, stat: order, delta: -8}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 2}
      hint: 国库 +30；燕京治安 −8，河北东路治安 +2（转输稍省）
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: zhao_liangsi, fact: 宣和四年后，燕民安集之议未行}
      hint: 无增减

- id: t11_taixue
  turn: 11
  title: 陈东上书
  summary: 太学生陈东率诸生伏阙上书，论边事轻举、应奉扰民、佞幸蔽明，语多激切，请陛下亲览。
  region: bianjing
  illustration: event.chen_dong
  conditions:
    all:
      - {kind: character_status, character: chen_dong, value: alive}
      - {kind: character_region, character: chen_dong, region: bianjing}
  proposal: frank
  keywords: [陈东, 太学, 言路, 佞幸]
  advisors:
    - {character: chen_dong, stance: support, option: frank, line: 学生斗胆！今日之患，不在外而在内：花石扰东南，奸佞蔽聪明，此天下所共知也！伏乞陛下容学生说尽。}
    - {character: wang_fu, stance: oppose, option: exile, requires: {office: [shaozai, taizai]}, line: 诸生不读书，聚众伏阙，诋毁大臣，此风断不可长。宜编管远州，以儆其余。}
    - {character: liang_shicheng, stance: neutral, option: keep, line: 官家，太学生年少气盛，说说也就罢了。留中不报，过些日子自然就散了。}
    - {character: li_gang, stance: support, option: frank, requires: {region: bianjing}, line: 诸生之言虽激，其心则忠。罪之，则天下之口自此钳矣。}
