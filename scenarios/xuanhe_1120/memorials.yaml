        - {op: adjust_army, army: xijun_jingyuan, delta: -25000, reason: 抽泾原兵二万五千伐燕}
        - {op: adjust_army, army: xijun_qinfeng, delta: -20000, reason: 抽秦凤兵二万伐燕}
        - {op: adjust_army, army: hebei_army, delta: -25000, reason: 抽河北禁军二万五千伐燕}
        - {op: adjust_army, army: beifa_army, delta: 70000, reason: 伐燕诸军合七万}
        - {op: march, army: beifa_army, to_region: hebei_xi, with_commander: false}
        - {op: set_army_commander, army: beifa_army, character: zhong_shidao}
        - {op: set_army_posture, army: beifa_army, posture: hold}
        - {op: adjust_relation, a: song, b: liao, delta: -100}
        - {op: adjust_relation, a: liao, b: song, delta: -100}
        - {op: adjust_resource, resource: treasury, delta: -150, reason: 伐燕军费}
        - {op: adjust_resource, resource: grain, delta: -60, reason: 先备粮道}
        - {op: adjust_resource, resource: liao_zuo, delta: -3, reason: 宋兵北向}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 宦者不预兵事}
