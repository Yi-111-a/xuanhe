            - {op: adjust_region, region: huainan, stat: prosperity, delta: 2}
        - {op: start_project, name: 漕运勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_caoyun", value: null}]}
      hint: 国库每季 −30 共两季；成后粮储 +80、淮南繁荣 +2；本条四季后再议

- id: s_hedi
  title: 河北和籴
  summary: 河北都转运司奏：沿边诸州边储不足一岁之用，请出钱和籴，以实边储；或言和籴之弊，州县抑配于民，不如折纳现钱。
  region: hebei_xi
  illustration: event.tangluo
  conditions:
    all:
      - {kind: turn, operator: gte, value: 8}
      - {kind: region_controller, region: hebei_xi, faction: song}
  proposal: buy
  keywords: [边储, 和籴, 河北]
  advisors:
    - {character: ma_kuo, stance: support, option: buy, requires: {region: bianjing}, line: 兵无粮则不战自溃。边储一岁，是最少的了。}
    - {character: li_gang, stance: support, option: fair, requires: {region: bianjing}, line: 和籴本为便民，而州县抑配，反成一害。籴之可也，须禁抑配。}
    - {character: li_bangyan, stance: oppose, option: cash, requires: {region: bianjing}, line: 粮食放着会霉，钱放着不会。折成现钱，省事。}
  options:
    - id: buy
      label: 出钱五十万缗和籴边储
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 河北和籴}
        - {op: adjust_resource, resource: grain, delta: 50, reason: 河北和籴入仓}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 边储稍实}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 −50，粮储 +50，武备 +1；本条四季后再议
    - id: cash
      label: 折纳现钱，不籴
      ops:
        - {op: adjust_resource, resource: treasury, delta: 20, reason: 边储折纳现钱}
        - {op: adjust_resource, resource: wubei, delta: -1, reason: 边储空虚}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 折纳之弊}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 +20，武备 −1，吏治积弊 +1；本条四季后再议
    - id: fair
      label: 和籴而禁抑配，遣使按察
      ops:
        - {op: adjust_resource, resource: treasury, delta: -55, reason: 河北和籴并遣使按察}
        - {op: adjust_resource, resource: grain, delta: 40, reason: 河北和籴入仓}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 禁抑配}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 2}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 −55，粮储 +40，吏治积弊 −1，河北西路治安 +2；本条四季后再议

- id: s_kaoke
  title: 考课守令
  summary: 吏部奏：诸路守令考课之法久废，以货得官者众，催科之外无治绩可言。请遣使按察诸路，或严考课以黜庸吏。
  region: bianjing
  illustration: event.court_debate
  conditions: {kind: turn, operator: gte, value: 4}
  proposal: inspect
  keywords: [吏治, 考课, 守令]
  advisors:
    - {character: li_gang, stance: support, option: inspect, requires: {region: bianjing}, line: 守令者，亲民之官。守令得人，则盗贼不起、赋役自均。}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [taizai, shaozai]}, line: 诸路守令多是循吏，一遣按察，人人自危，反误了催科。}
    - {character: cai_jing, stance: neutral, option: strict, line: 考课之法，祖宗所定。行之以渐，不必大张旗鼓。}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 考课不行}
        - {op: start_project, name: 考课勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_kaoke", value: null}]}
      hint: 吏治积弊 +1；本条四季后再议
    - id: strict
      label: 严考课，黜庸吏
      ops:
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 黜庸吏}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 以货得官者被黜}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 黜吏者怨}
        - {op: start_project, name: 考课勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_kaoke", value: null}]}
      hint: 吏治积弊 −2，佞幸 −1，君威 −1；本条四季后再议
    - id: inspect
      label: 遣使按察诸路守令
      ops:
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 遣使按察}
        - {op: adjust_resource, resource: corruption, delta: -3, reason: 按察守令}
        - {op: start_project, name: 考课勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_kaoke", value: null}]}
      hint: 国库 −15，吏治积弊 −3；本条四季后再议

- id: s_taixue
  title: 太学议政
  summary: 太学诸生聚议时政，书生上书者日众，言应奉、边事、宰执之失，辞多激切。或请许其上书、下诏求直言，或请禁太学妄议。
  region: bianjing
  illustration: event.chen_dong
  conditions: {kind: turn, operator: gte, value: 6}
  proposal: frank
  keywords: [太学, 言路, 陈东]
  advisors:
    - {character: chen_dong, stance: support, option: frank, requires: {region: bianjing}, line: 学生斗胆！诸生所言，皆天下所欲言而不敢言者。塞其口，则天下之口皆塞矣！}
    - {character: liang_shicheng, stance: oppose, option: ban, requires: {office: yubi}, line: 一群毛头书生，懂得什么朝政？官家不理他们，他们反倒越说越来劲。}
    - {character: zhao_huan, stance: neutral, option: allow, requires: {office: crown_prince}, line: 此等事，儿臣不敢专。只是……祖宗以来，不以言罪人。}
  options:
    - id: allow
      label: 许诸生上书，不加罪
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 言路稍开}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 士论稍平}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 佞幸 −1，民心 +1；本条五季后再议
    - id: ban
      label: 禁太学妄议时政
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 禁太学妄议}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 言路壅塞}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 士论不平}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 君威 +1，佞幸 +1，民心 −1；本条五季后再议
    - id: frank
      label: 下诏求直言
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 言路大开}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 言者纠弹}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 群言纷起}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 佞幸 −1，吏治积弊 −1，君威 −1；本条五季后再议

- id: s_zhaijiao
  title: 宫观斋醮
  summary: 道录院奏：天下神霄玉清万寿宫岁费不赀，又请于上清宝箓宫设大斋醮，度道士、赐田产。言者谓宫观之费，夺民之食。
  region: bianjing
  illustration: event.daoist_rite
  conditions:
    all:
      - {kind: turn, operator: gte, value: 4}
      - {kind: flag, key: daojiao_curbed, operator: absent}
  proposal: approve
  keywords: [道教, 斋醮, 宫观, 神霄]
  advisors:
    - {character: liang_shicheng, stance: support, option: approve, requires: {office: yubi}, line: 官家是教主道君，斋醮是正经大事，哪能省？}
    - {character: chen_dong, stance: oppose, option: curb, requires: {region: bianjing}, line: 道士衣紫腰金，坐食租税，而河北之民饿死道旁。陛下崇道，道岂在此？}
    - {character: cai_jing, stance: neutral, option: halve, line: 宫观之设，所以奉天；然费不可无节。减其半，可也。}
  options:
    - id: curb
      label: 罢天下神霄宫之费，停度道士
      ops:
        - {op: set_flag, key: daojiao_curbed, value: true}
        - {op: adjust_resource, resource: treasury, delta: 30, reason: 罢神霄宫之费}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 罢宫观之扰}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 方士失势}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 道君自罢其教}
      hint: 国库 +30，民心 +2，佞幸 −2，君威 −1；此后不复有大斋醮之费，本条不再呈上
    - id: halve
      label: 减宫观岁费之半
      ops:
        - {op: adjust_resource, resource: treasury, delta: 15, reason: 减宫观岁费}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 减宫观之费}
        - {op: start_project, name: 宫观勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_zhaijiao", value: null}]}
      hint: 国库 +15，民心 +1；本条五季后再议
    - id: approve
      label: 照准，设大斋醮
      ops:
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 斋醮赏赐}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 道君临坛}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 方士得宠}
        - {op: start_project, name: 宫观勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_zhaijiao", value: null}]}
      hint: 国库 −25，君威 +1，佞幸 +1；本条五季后再议

- id: s_genyue
  title: 艮岳修葺
  summary: 提举万岁山所奏：艮岳峰石多有欹侧，园中珍禽异木须时时补给，又请于东南续取奇石以增胜景。
  region: bianjing
  illustration: event.genyue
  conditions:
    all:
      - {kind: turn, operator: gte, value: 10}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: approve
  keywords: [艮岳, 花石, 宫苑]
  advisors:
    - {character: liang_shicheng, stance: support, option: approve, requires: {office: yubi}, line: 园子是官家的心头好，奴婢日日去瞧，有几处石头真该扶一扶了。}
    - {character: li_gang, stance: oppose, option: halt, requires: {region: bianjing}, line: 艮岳一石，东南百户之产也。今边事方殷，宜罢不急之役。}
    - {character: cai_jing, stance: neutral, option: repair, line: 已成之景，略加修葺可也；续取奇石，则不必。}
  options:
    - id: approve
      label: 照准，修葺并续取奇石
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 艮岳修葺取石}
        - {op: adjust_resource, resource: dongnan, delta: 2, reason: 东南续取奇石}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 御园增胜}
        - {op: start_project, name: 艮岳勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_genyue", value: null}]}
      hint: 国库 −40，东南民怨 +2，君威 +1；本条五季后再议
    - id: halt
      label: 罢艮岳工役
      ops:
        - {op: adjust_resource, resource: treasury, delta: 10, reason: 罢艮岳工役}
        - {op: adjust_resource, resource: dongnan, delta: -2, reason: 罢取石之役}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 罢不急之役}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 御园荒废}
        - {op: start_project, name: 艮岳勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_genyue", value: null}]}
      hint: 国库 +10，东南民怨 −2，佞幸 −1，君威 −1；本条五季后再议
    - id: repair
      label: 只修葺，不取石
      ops:
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 艮岳修葺}
        - {op: start_project, name: 艮岳勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_genyue", value: null}]}
      hint: 国库 −15；本条五季后再议

- id: s_zongshi
  title: 宗室禄廪
  summary: 大宗正司奏：宗室日繁，禄廪、婚嫁、恩赏之费岁增，而疏属多贫不能自存。请或裁冗赐，或置宗学教养。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: turn, operator: gte, value: 8}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: trim
  keywords: [宗室, 禄赐, 宗学]
  advisors:
    - {character: zhao_kai, stance: oppose, option: school, requires: {office: huangcheng}, line: 宗室子弟多有好学者，父皇若置宗学，儿臣愿为之选师。}
    - {character: cai_jing, stance: support, option: trim, line: 宗室之费，近属宜厚，疏属宜裁，此祖宗之法也。}
  options:
    - id: school
      label: 置宗学，教养疏属
      ops:
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 置宗学}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 敦睦宗室}
        - {op: start_project, name: 宗室勘会, region: bianjing, cost_per_turn: {}, turns: 6, on_complete: [{op: set_flag, key: "memorial:s_zongshi", value: null}]}
      hint: 国库 −15，君威 +1；本条六季后再议
    - id: trim
      label: 裁疏属冗赐，宗室禄赐定为每季七万缗
      ops:
        - {op: add_ledger, id: zongshi, name: 宗室禄赐, category: treasury, amount: -7, kind: recurring, reason: 裁冗赐后（游戏折算）, cancellable: false}
