    - {character: gao_qiu, stance: oppose, option: crush, line: 草寇猖獗，当发禁军剿灭，以儆效尤。}
    - {character: chen_dong, stance: neutral, option: amnesty, line: 盗亦民也，激于饥寒。招之可也。}
  options:
