      hint: 武备 −2，民心 −1

- id: t_war_beibei
  title: 善后边备
  summary: 金军虽退，太原、真定诸城经兵残破，河北禁军十不存五。枢密院请修北边诸城、补河北戍兵，以备金人再来。
  region: hedong
  illustration: event.jinjun_review
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, value: true}
      - {kind: region_controller, region: hedong, faction: song}
      - {kind: region_controller, region: hebei_xi, faction: song}
  proposal: fortify
  keywords: [边备, 太原, 真定, 武备]
  advisors:
    - {character: zhang_xiaochun, stance: support, option: fortify, requires: {region: hedong}, line: （自太原驰奏）金人此去，必复再来。城不修、粮不积，下次便守不住了。}
    - {character: ma_kuo, stance: support, option: garrison, requires: {region: bianjing}, line: 河北之兵经此一役，所存无几。不补其额，金人再来，河北无一可战之兵。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 金人既已退去，又修城又募兵，倒像是要跟人家没完。}
  options:
    - id: garrison
      label: 募兵一万五千补河北西路禁军
      ops:
        - {op: adjust_army, army: hebei_army, delta: 15000, reason: 补河北戍兵}
        - {op: adjust_resource, resource: treasury, delta: -45, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 河北补兵}
      hint: 河北西路禁军 +15000（素质不变），国库 −45，武备 +2；此后养兵每季 +4.5 万缗、粮 +1.8 万石
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: 金军退后，边备之议未行}
      hint: 无增减
    - id: fortify
      label: 修太原、真定诸城（两季）
      ops:
        - op: start_project
          name: 修北边诸城
          region: hedong
          cost_per_turn: {treasury: 50}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 10}
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 10}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 北边诸城修治}
      hint: 国库每季 −50 共两季；成后河东、河北西路防务各 +10，武备 +2

