      - {kind: flag, key: haishang_ally, value: true}
      - {kind: flag, key: zhongjing_fallen, value: true}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: flag, key: beifa_started, operator: absent}
      - {kind: character_status, character: tong_guan, value: alive}
      - {kind: office_holder, office: hebei_xuanfu, character: zhong_shidao}
      - {not: {kind: flag, key: "memorial:t8_beifa", operator: exists}}
      - {not: {kind: flag, key: "memorial:t8_beifa_nanzheng", operator: exists}}
  proposal: march
  keywords: [伐燕, 燕京, 夹攻, 燕山]
  advisors:
    - {character: tong_guan, stance: support, option: march, line: 宣抚使持重是持重，只是太慢！官家，伐燕之事，还得老奴亲去督着。}
    - {character: wang_fu, stance: support, option: march, requires: {office: [shaozai, taizai]}, line: 种师道素不欲伐燕，以之专制，必迁延不进。枢密督师，方能如期。}
    - {character: zhong_shidao, stance: oppose, option: zhong_lead, requires: {region: [xibian, guanzhong, hedong, jingxi, hebei_xi, hebei_dong]}, line: （驰奏）老臣仍以为伐燕非义。然既奉诏，请令诸军会于真定，由宣抚司节制，粮道通而后进，不敢浪战。}
    - {character: ma_kuo, stance: neutral, option: zhong_lead, line: 河北既有宣抚，又遣枢密督师，是一军两帅，兵家所忌。}
    - {character: li_bangyan, stance: neutral, option: hold, line: 宣抚使自己都说不该打，那就别打了罢。}
  options:
    - id: zhong_lead
      label: 宣抚使种师道专制出师，伐燕诸军移屯真定与之会师
      memory: {character: zhong_shidao, text: 宣和四年春，以宣抚使专制伐燕诸军}
      ops:
        - {op: set_flag, key: beifa_started, value: true}
