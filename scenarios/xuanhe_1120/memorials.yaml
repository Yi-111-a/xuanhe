# ---- 京城守御（兵临汴京后）：李纲在京 / 宗泽在京 / 张叔夜在京 / 皆不在 ----
- id: t_shoucheng
  title: 京城守御
  summary: >-
    金兵前锋已至河上，京城震恐。城周数十里，守具久弛，禁军阙额。宰执请择大臣总领守御：或以李纲为亲征行营使，专任城守；
    或令殿前司督诸军守城，募京畿丁壮助之。
  region: bianjing
  illustration: event.ligang_defense
  conditions:
    all:
      - {kind: flag, key: bianjing_besieged, value: true}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: flag, key: ligang_defense, operator: absent}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: character_status, character: li_gang, value: alive}
      - {kind: character_region, character: li_gang, region: bianjing}
      - {not: {kind: flag, key: "memorial:t_shoucheng_zong", operator: exists}}
      - {not: {kind: flag, key: "memorial:t_shoucheng_zhang", operator: exists}}
      - {not: {kind: flag, key: "memorial:t_shoucheng_plain", operator: exists}}
  proposal: ligang
  keywords: [守城, 李纲, 汴京, 禁军]
  advisors:
    - {character: li_gang, stance: support, option: ligang, requires: {region: bianjing}, line: 臣愿以死守城！修楼橹、具炮石、分四壁而守，金人虽众，不能一朝而下。}
    - {character: gao_qiu, stance: oppose, option: zhaomu, requires: {office: dianshuai}, line: 禁军守城，臣自有调度，何必另设行营使？多募些丁壮上城便是。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 城守是殿前司的事。另外弄个行营使，令出多门，反倒乱了。}
  options:
    - id: zhaomu
      label: 令殿前司督守，募京畿丁壮二万上城
      ops:
