      - {kind: flag, key: yanjing_jin, operator: absent}
      - {kind: flag_age, key: guo_defected_song, operator: lte, value: 1}
      - {kind: army_strength, army: changsheng, operator: gte, value: 6000}
      - {kind: office_holder, office: changsheng_tong, character: guo_yaoshi}
  proposal: favor
  keywords: [郭药师, 常胜军, 降将, 燕山]
  advisors:
    - {character: tong_guan, stance: support, option: favor, line: 郭药师骁将，得之如得燕京一半！厚赏他，叫燕人都看看朝廷的恩典。}
    - {character: zhao_liangsi, stance: support, option: favor, line: 药师所部皆燕人，厚抚之，则燕人知王师可归。}
    - {character: ma_kuo, stance: neutral, option: watch, line: 臣闻药师先事辽，后杀其监军来归，向背唯利是视。厚之可也，不可不备。}
    - {character: zhong_shidao, stance: oppose, option: split, line: 降人之兵，不可使聚于一处。分屯诸州，杂以官军，乃可久安。}
  options:
    - id: watch
      label: 疑而防之，以河北诸将监其营
      ops:
        - {op: set_flag, key: changsheng_watched, value: true}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
        - {op: adjust_trait, character: guo_yaoshi, trait: fear, delta: 1}
      hint: 郭药师自疑（忠诚 −1）；日后若有变，可早为之备
    - id: favor
      label: 授以节钺，厚赐金帛
      memory: {character: guo_yaoshi, text: 宣和四年秋，来降，朝廷授以节钺，厚赐金帛}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 厚赐降将}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: 2}
        - {op: adjust_trait, character: guo_yaoshi, trait: favor, delta: 2}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 远人来归}
      hint: 国库 −40，君威 +1；郭药师感恩（忠诚 +2）
    - id: split
      label: 分常胜军四千屯河北西路
      memory: {character: guo_yaoshi, text: 宣和四年秋，来降，朝廷分我常胜军之众}
      ops:
        - {op: detach, army: changsheng, strength: 4000, to_region: hebei_xi, new_army_name: 常胜军分屯}
        - {op: set_flag, key: changsheng_split, value: true}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
      hint: 常胜军分兵 4000 屯河北西路（行程见回执）；常胜军已分屯（日后即有变，所部不能尽从）；郭药师不悦（忠诚 −1）

- id: t10_donggong
  turn: 10
  expires_after: 1
  title: 东宫之议
  summary: 风闻王黼与郓王往来甚密，宫中有「郓王贤于东宫」之语；东宫僚属惶惧不安，皇太子谨默而已。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: office_holder, office: crown_prince, character: zhao_huan}
      - {kind: character_status, character: zhao_kai, value: alive}
      - {kind: flag, key: donggong_secure, operator: absent}
      - {kind: flag, key: yichu, operator: absent}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  proposal: yichu
  keywords: [东宫, 太子, 郓王, 储位, 易储]
  advisors:
    - {character: wang_fu, stance: support, option: yichu, line: 臣不敢妄议储贰。只是郓王才学冠绝，廷试第一，天下之人皆以为贤——此陛下教子有方所致。}
    - {character: zhao_kai, stance: neutral, option: keep, line: 父皇明鉴，儿臣从不敢有非分之想。外头的话，儿臣也是听皇城司说的……大哥为人忠厚，只是于时务未免迟疑。}
    - {character: zhao_huan, stance: oppose, option: punish, line: 儿臣……儿臣不敢专。只求父皇明示，儿臣但有过失，愿受责罚。}
    - {character: liang_shicheng, stance: oppose, option: punish, line: 官家，东宫向来谨慎，也无甚过失。外廷这些话，传多了不好听。}
    - {character: li_gang, stance: oppose, option: punish, requires: {region: bianjing}, line: 储贰者，天下之本。宰相交结亲王，窥伺东宫，此祸乱之端。请正其罪，以安天下之心。}
  options:
    - id: punish
      label: 切责王黼，申东宫之分
      memory: {character: wang_fu, text: 宣和四年秋，陛下切责臣交结郓王}
      ops:
        - {op: set_flag, key: donggong_secure, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -3, reason: 王黼被责}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 定储位}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -2}
        - {op: adjust_trait, character: zhao_huan, trait: fear, delta: -1}
        - {op: adjust_trait, character: zhao_kai, trait: favor, delta: -1}
      hint: 东宫安；佞幸 −3，君威 +2；王黼失宠，郓王稍疏
    - id: yichu
      label: 易储：废皇太子，立郓王为皇太子
      memory: {character: zhao_kai, text: 宣和四年秋，父皇立我为皇太子}
      ops:
        - {op: dismiss, character: zhao_huan, office: crown_prince}
        - {op: appoint, character: zhao_kai, office: crown_prince}
        - {op: set_flag, key: yichu, value: true}
        - {op: adjust_resource, resource: authority, delta: -5, reason: 无故易储}
        - {op: adjust_resource, resource: ningxing, delta: 5, reason: 王黼定策之功}
        - {op: adjust_resource, resource: morale, delta: -3, reason: 中外骇异}
        - {op: adjust_trait, character: zhao_huan, trait: fear, delta: 2}
      hint: 郓王为皇太子，赵桓废居别邸；君威 −5，佞幸 +5，民心 −3。此为本游戏的反事实分支
    - id: keep
      label: 置之不问
      ops:
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 王黼附郓王之势益张}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 储位之议不息}
        - {op: adjust_trait, character: zhao_huan, trait: fear, delta: 2}
      hint: 佞幸 +1，君威 −1；东宫益惧，储位之议不息

- id: t10_yanshan_won
  title: 燕山经略
  summary: 王师既入燕京，燕人有迎于道者。朝议改燕京为燕山府，请置燕山府路宣抚使经略，并定留戍之数。
  region: yanshan
  illustration: event.beifa
  conditions:
    all:
      - {kind: flag, key: beifa_won, value: true}
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: office_holder, office: yanshan_xuanfu, character: null}
      - {kind: army_strength, army: beifa_army, operator: gte, value: 30000}
      - {kind: character_status, character: zhong_shidao, value: alive}
      - {kind: character_status, character: zhang_shuye, value: alive}
      - {not: {kind: flag, key: "memorial:t12_yanshan_bought", operator: exists}}
  proposal: all
  keywords: [燕山, 燕京, 宣抚, 戍兵]
  advisors:
    - {character: tong_guan, stance: support, option: all, line: 燕京是老奴打下来的，伐燕诸军就留在燕京，谁敢来犯？}
    - {character: ma_kuo, stance: neutral, option: zhong, line: 燕山北控居庸、古北诸关，非宿将不能守。宜以老种镇之。}
    - {character: chen_dong, stance: neutral, option: zhang, line: 燕地新复，宜用廉干之臣抚其民；张叔夜在海州有治绩，可以当之。}
  options:
    - id: all
      label: 不设宣抚，伐燕诸军全军留戍燕京
      ops:
        - {op: merge_army, army: beifa_army, into: yanshan_army, reason: 伐燕诸军全军留戍}
        - {op: adjust_region, region: yanshan, stat: defense, delta: 8}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -3}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 童贯恃功}
      hint: 伐燕诸军全数并为燕山戍军；燕京防务 +8；戍兵衣粮仰给河北转输，河北东路治安 −3；佞幸 +1
    - id: zhang
      label: 以张叔夜为燕山府路宣抚使，留伐燕诸军二万戍燕
      memory: {character: zhang_shuye, text: 宣和四年，奉命宣抚燕山}
      ops:
        - {op: appoint, character: zhang_shuye, office: yanshan_xuanfu, dispatch: true}
        - {op: adjust_army, army: beifa_army, delta: -20000, reason: 留伐燕兵二万戍燕}
        - {op: adjust_army, army: yanshan_army, delta: 20000, reason: 伐燕兵二万戍燕}
        - {op: merge_army, army: beifa_army, into: hebei_army, reason: 伐燕余兵归河北}
        - {op: adjust_region, region: yanshan, stat: order, delta: 6}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 置燕山府}
      hint: 张叔夜兼统燕山戍军（行程见回执）；伐燕诸军 −20000 改为燕山戍军 +20000，余众归河北西路禁军；燕京治安 +6，国库 −30；养兵不增（兵额对调）
    - id: zhong
      label: 以种师道为燕山府路宣抚使，留伐燕诸军三万戍燕
      memory: {character: zhong_shidao, text: 宣和四年，奉命宣抚燕山}
      ops:
        - {op: appoint, character: zhong_shidao, office: yanshan_xuanfu, dispatch: true}
        - {op: adjust_army, army: beifa_army, delta: -30000, reason: 留伐燕兵三万戍燕}
        - {op: adjust_army, army: yanshan_army, delta: 30000, reason: 伐燕兵三万戍燕}
        - {op: merge_army, army: beifa_army, into: hebei_army, reason: 伐燕余兵归河北}
        - {op: adjust_region, region: yanshan, stat: defense, delta: 5}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 置燕山府}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 宿将镇燕山}
      hint: 种师道兼统燕山戍军（行程见回执）；伐燕诸军 −30000 改为燕山戍军 +30000，余众归河北西路禁军；燕京防务 +5，国库 −30，武备 +2；养兵不增（兵额对调）

- id: t10_yanfa
  turn: 10
  title: 盐钞屡变
  summary: 商贾诉：东南盐钞屡变其法，旧钞未用而新钞又出，富商折阅，或至破产。户部则言钞法之利，岁入以百万计，不可轻罢。
  region: huainan
  illustration: event.qingming
  proposal: tax
  keywords: [盐钞, 财赋, 商贾]
  advisors:
    - {character: cai_jing, stance: support, option: tax, line: 钞法，老臣行之有年。以新易旧，国用自足；商贾之言，各为其私耳。}
    - {character: li_gang, stance: oppose, option: settle, requires: {region: bianjing}, line: 法屡变则民不信，民不信则商不行。宜定其法，旧钞许兑，然后可久。}
    - {character: li_bangyan, stance: neutral, option: keep, line: 这钞法臣是看不懂的。改来改去，反正吃亏的不是陛下。}
  options:
    - id: tax
      label: 再变钞法，以新易旧
      ops:
        - {op: adjust_resource, resource: treasury, delta: 100, reason: 变盐钞法}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 钞法屡变，奸弊丛生}
        - {op: adjust_region, region: huainan, stat: prosperity, delta: -3}
        - {op: adjust_region, region: liangzhe, stat: prosperity, delta: -2}
      hint: 国库 +100；吏治积弊 +1；商贾折阅，淮南繁荣 −3、两浙繁荣 −2
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: 宣和四年秋，盐钞之议未行}
      hint: 无增减
    - id: settle
      label: 定钞法，旧钞许兑，不复轻改
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 兑旧钞}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 商贾安业}
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 钞法一定}
      hint: 国库 −30；民心 +2，吏治积弊 −2

- id: t10_liao_aid
  turn: 10
  expires_after: 1
  title: 燕京乞粮
  summary: 燕京辽人遣使言：女真屯兵居庸关外，城中粮少，军民困乏。请再输粮以守，愿永为宋之藩屏。
  region: yanshan
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: zhongjing_fallen, value: true}
      - {kind: region_controller, region: yanshan, faction: liao}
  proposal: grain
  keywords: [联辽, 存辽, 燕京, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: grain, requires: {region: xibian}, line: （自泾原驰表）燕京之存亡，在此一举。燕京存，则女真不能越燕而南。}
    - {character: zhong_shidao, stance: support, option: grain, requires: {region: bianjing}, line: 老臣以为，燕京存亡，在此一举。输粮之费，较之河北设防，十不及一。}
    - {character: wang_fu, stance: oppose, option: decline, requires: {office: [shaozai, taizai]}, line: 前后输了多少，燕京还是朝不保夕。女真早晚要取它，何苦陪葬钱粮？}
  options:
    - id: gifts
      label: 赐帛慰问
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 赐燕京帛}
        - {op: adjust_resource, resource: liao_zuo, delta: 3, reason: 宋帛助辽}
      hint: 国库 −40，辽祚 +3
    - id: grain
      label: 输粮十万石助守燕京
      ops:
        - {op: adjust_resource, resource: grain, delta: -100, reason: 输粮助燕京}
        - {op: adjust_resource, resource: liao_zuo, delta: 8, reason: 宋粮助守燕京}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −100，辽祚 +8，金人轻宋（风闻）↑。辽祚低于三十，燕京即难久守
    - id: decline
      label: 婉辞之
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和四年秋，燕京乞粮，朝廷婉辞}
      hint: 无增减

# ============================== T11 宣和四年冬 ==============================
- id: t11_jiebei
  turn: 11
  title: 河北戒备
  summary: 燕地兵戈未息，与河北只隔白沟。真定、中山诸城池多圮，保甲久不教阅。河北安抚司请修城练兵，以备不虞。
  region: hebei_xi
  illustration: event.tangluo
  conditions:
    all:
      - {not: {kind: region_controller, region: yanshan, faction: song}}
      - {kind: region_controller, region: hebei_xi, faction: song}
  proposal: fortify
  keywords: [河北, 城防, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, line: 臣亲见女真兵马，人皆善骑射，来去如风。河北之城，一日不可不修。}
    - {character: zhang_xiaochun, stance: support, option: train, requires: {region: hedong}, line: （自太原驰奏）修城不如修人，修人不如修城——二者皆急。若只能行其一，臣请先练其兵。}
    - {character: li_bangyan, stance: oppose, option: none, line: 河北年年说要修城，修了一百年，也没见谁打过来。}
  options:
    - id: none
      label: 罢议
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和四年冬，河北戒备之议不行}
      hint: 无增减
    - id: train
      label: 括河北保甲，农隙教阅
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 保甲教阅之费}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 保甲教阅}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 农隙役民}
      hint: 国库 −40，武备 +2，民心 −1
    - id: fortify
      label: 修真定、中山诸城（三季）
      ops:
        - op: start_project
          name: 修真定中山诸城
          region: hebei_xi
          cost_per_turn: {treasury: 35}
          turns: 3
          on_complete:
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 8}
            - {op: adjust_resource, resource: wubei, delta: 3, reason: 河北诸城修治}
      hint: 国库每季 −35 共三季；成后河北西路防务 +8、武备 +3

- id: t11_yanmin
  title: 燕民安集
  summary: 燕山府奏：燕地新复，兵火之余，城郭萧条，流亡未复；戍兵衣粮仰给于河北转输，河北之民困于馈运。
  region: yanshan
  illustration: event.famine
  conditions:
    all:
