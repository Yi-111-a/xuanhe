        - {op: adjust_trait, character: zhong_shidao, trait: loyalty, delta: -1}
      hint: >-
        泾原军 −25000、秦凤熙河军 −20000、河北西路禁军 −25000，合为伐燕诸军 70000，即日出雄州趋燕京、进击；童贯督师（自所在赴军，
        行程见回执）；宣抚使种师道不预其事，颇怀不平；与辽绝好；国库 −150，辽祚 −3；养兵不增（兵额对调）

# 非盟金路线的 T8：燕京（或辽主）遣使、燕人南来、河北边防。
- id: t8_liao_envoy
  turn: 8
  title: 燕京遣使
  summary: 辽中京既陷，天祚西走，燕京辽人立秦晋国王耶律淳。淳遣使来，愿免宋岁币，请复澶渊旧好，并乞粮以抗女真。
  region: bianjing
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: haishang_ally, operator: absent}
      - {kind: flag, key: zhongjing_fallen, value: true}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {not: {kind: flag, key: "memorial:t8_liao_envoy_zhong", operator: exists}}
  proposal: lianliao
  keywords: [辽使, 联辽, 存辽, 燕京, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: lianliao, requires: {region: xibian}, line: （自泾原驰表）燕京存，则女真之锋在燕而不在我。免币乞粮，是燕人以我为屏，亦我以燕为屏也。}
    - {character: li_gang, stance: support, option: lianliao, requires: {region: bianjing}, line: 存燕以为河北之蔽，所费者粮，所得者百年之安。机不可失。}
    - {character: tong_guan, stance: oppose, option: decline, line: 契丹残部，朝不保夕。今日输粮，明日便是女真之物。}
    - {character: wang_fu, stance: neutral, option: gifts, requires: {office: [shaozai, taizai]}, line: 岁币既免，便是得了便宜。厚赐其使打发了，兵粮之事不必再提。}
  options:
    - id: lianliao
      label: 与燕京约和，免其岁币，输粮助守
      memory: {character: zhong_shidao, text: 宣和四年春，朝廷与燕京约和存辽}
      ops:
        - {op: set_flag, key: lian_liao, value: true}
        - {op: cancel_ledger, ledger_id: suibi_liao}
        - {op: adjust_resource, resource: grain, delta: -100, reason: 输粮助燕京}
        - {op: adjust_resource, resource: liao_zuo, delta: 10, reason: 宋与燕京约和}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 金人视宋为辽之与国}
      hint: 每季省岁币（辽）12 万缗；粮储 −100，辽祚 +10，金人轻宋（风闻）↑；自此为联辽之局
    - id: decline
      label: 以礼遣还，岁币如旧
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和四年春，燕京遣使约和，朝廷以礼遣还}
      hint: 无增减
    - id: gifts
      label: 受其免币之请，厚赐其使，不预兵事
      ops:
        - {op: cancel_ledger, ledger_id: suibi_liao}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 厚赐燕京使者}
        - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 邻好不绝}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋与燕京通}
      hint: 每季省岁币（辽）12 万缗；国库 −40，辽祚 +1，金人轻宋（风闻）略↑

- id: t8_liao_envoy_zhong
  turn: 8
  title: 燕京遣使
  summary: 金兵攻辽中京未下，退屯北境。辽主遣使来谢，言中京赖宋粮得全，然女真来岁必复至，请再以粮帛助守，愿世为兄弟之国。
  region: bianjing
  illustration: event.liao_envoy
  variant_of: t8_liao_envoy
  conditions:
    all:
      - {kind: flag, key: haishang_ally, operator: absent}
      - {kind: flag, key: zhongjing_fallen, operator: absent}
      - {not: {kind: flag, key: "memorial:t8_liao_envoy", operator: exists}}
  proposal: grain
  keywords: [辽使, 联辽, 存辽, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: grain, requires: {region: xibian}, line: （自泾原驰表）中京之守，宋粮之力也。一年之费，换女真一年不得南顾，值得。}
    - {character: li_gang, stance: support, option: grain, requires: {region: bianjing}, line: 唇齿之势已成，不可中辍。中辍则前功尽弃。}
    - {character: wang_fu, stance: oppose, option: decline, requires: {office: [shaozai, taizai]}, line: 输了一次又一次，契丹何时是个头？东南之米，岂是给契丹人种的？}
  options:
    - id: gifts
      label: 厚赐其使，婉辞粮帛
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 厚赐辽使}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 邻好不绝}
      hint: 国库 −30，辽祚 +2
    - id: grain
      label: 再输粮十万石，结兄弟之好
      ops:
        - {op: set_flag, key: lian_liao, value: true}
        - {op: adjust_resource, resource: grain, delta: -100, reason: 输粮助辽}
        - {op: adjust_resource, resource: liao_zuo, delta: 6, reason: 宋粮助辽}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −100，辽祚 +6，金人轻宋（风闻）↑；联辽之局
    - id: decline
      label: 以礼遣还
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和四年春，辽主遣使乞粮，朝廷以礼遣还}
      hint: 无增减

- id: t8_guiming
  turn: 8
  expires_after: 1
  title: 归明人
  summary: 雄州奏：辽乱以来，燕地士人、豪族与辽之汉官间道来归者日多，自称「归明人」，或求官爵，或献燕地虚实。边臣请定处置之法：授官以收其心，或迁之内地以防奸细。
  region: hebei_dong
  illustration: event.court_debate
  conditions:
    all:
      - {kind: flag, key: zhongjing_fallen, value: true}
      - {kind: region_controller, region: hebei_dong, faction: song}
  proposal: favor
  keywords: [燕人, 归明, 河北]
  advisors:
    - {character: zhao_liangsi, stance: support, option: favor, line: 臣亦燕人也。燕人思汉久矣，来归者皆知燕地山川、人情。授以一官，彼必效死。}
    - {character: ma_kuo, stance: neutral, option: inland, line: 归明之人，有真心来归者，亦有观望两端者。迁之内地，给田安置，可以两全。}
    - {character: li_bangyan, stance: oppose, option: keep, line: 来一个封一个官，朝廷的官帽子怕是不够分。}
  options:
    - id: keep
      label: 听边臣自行处置
      ops:
        - {op: remember, character: zhao_liangsi, fact: 宣和四年春，归明人之议未定}
      hint: 无增减
    - id: favor
      label: 授归明人官爵，置之沿边州军
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 归明人俸给}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 燕人慕义来归}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -2}
      hint: 国库 −20，君威 +1；河北东路治安 −2（来者良莠不齐）
    - id: inland
      label: 迁之京东内地，给田安置
      ops:
        - {op: adjust_resource, resource: grain, delta: -30, reason: 安置归明人}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 2}
        - {op: adjust_region, region: jingdong, stat: prosperity, delta: 1}
      hint: 粮储 −30；河北东路治安 +2，京东繁荣 +1

- id: t8_jingfu
  turn: 8
  title: 经抚房
  summary: 王黼请于三省别置经抚房，专治伐燕钱粮，括诸路钱物以给边用，事不关枢密院、户部。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: flag, key: haishang_ally, value: true}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  proposal: wang
  keywords: [王黼, 伐燕, 财赋]
  advisors:
    - {character: wang_fu, stance: support, option: wang, line: 区区费用，何足挂齿？臣一手经画，不烦有司，伐燕之费立办。取燕之后，岁入自倍。}
    - {character: tong_guan, stance: oppose, option: limit, requires: {office: shumi}, line: 兵事钱粮，向由枢密院与户部商量着办。另起一房，老奴这里倒不知钱从哪里来了。}
    - {character: li_gang, stance: oppose, option: refuse, requires: {region: bianjing}, line: 财赋出于户部，兵事出于枢密，此祖宗之制。宰相私置一房，括天下之财而无所稽考，臣未见其可。}
  options:
    - id: wang
      label: 准置经抚房，括诸路钱物给边
      memory: {character: wang_fu, text: 宣和四年春，陛下准臣置经抚房}
      ops:
        - {op: set_flag, key: jingfu_set, value: true}
        - {op: adjust_resource, resource: treasury, delta: 100, reason: 经抚房括诸路钱物}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 王黼专财}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 括钱无所稽考}
        - {op: adjust_resource, resource: dongnan, delta: 1, reason: 诸路被括}
      hint: 国库 +100；佞幸 +2，吏治积弊 +1，东南民怨 +1
    - id: limit
      label: 置之，而令户部稽核出纳
      ops:
        - {op: set_flag, key: jingfu_set, value: true}
        - {op: adjust_resource, resource: treasury, delta: 50, reason: 经抚房括诸路钱物}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 王黼专财}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 括钱}
      hint: 国库 +50；佞幸 +1，吏治积弊 +1
    - id: refuse
      label: 不准，钱粮仍归户部
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 经抚房不置}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -1}
      hint: 佞幸 −1；王黼不悦

- id: t8_biankang
  turn: 8
  expires_after: 1
  title: 河北边防
  summary: 河北安抚司奏：金辽相攻于塞外，溃兵、流民出没白沟之北。朝廷既不与夹攻，宜自修边备，以待其变。
  region: hebei_dong
  illustration: event.tangluo
  conditions: {kind: flag, key: haishang_ally, operator: absent}
  proposal: fortify
  keywords: [河北, 城防, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, line: 女真得辽地，必与我为邻。城池不修，他日拿什么挡？}
    - {character: zhong_shidao, stance: support, option: train, requires: {region: xibian}, line: （自泾原驰表）城可徐修，兵不可不练。河北之兵久不教阅，老臣以为先练其兵。}
    - {character: li_bangyan, stance: oppose, option: none, line: 咱们又没去惹谁，修那么些城做什么？}
  options:
    - id: none
      label: 罢议
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和四年春，河北边防之议不行}
      hint: 无增减
    - id: train
      label: 拨款教阅河北禁军
      ops:
        - {op: adjust_army, army: hebei_army, quality_delta: 0.06, reason: 教阅河北禁军}
        - {op: adjust_army, army: hebei_dong_army, quality_delta: 0.06, reason: 教阅河北禁军}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 教阅之费}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 河北禁军教阅}
      hint: 国库 −60；河北两路禁军素质各 +0.06，武备 +2
    - id: fortify
      label: 修雄、霸、河间诸城（三季）
      ops:
        - op: start_project
          name: 修雄霸河间诸城
          region: hebei_dong
          cost_per_turn: {treasury: 35}
          turns: 3
          on_complete:
            - {op: adjust_region, region: hebei_dong, stat: defense, delta: 8}
            - {op: adjust_resource, resource: wubei, delta: 3, reason: 河北诸城修治}
      hint: 国库每季 −35 共三季；成后河北东路防务 +8、武备 +3

- id: t8_shuhua
  turn: 8
  title: 访求书画
  summary: 蔡攸请遣使访求四方古书画、鼎彝，以充御府；州县闻之，已有借进奉之名搜括民间者。言者以为北边方用兵，宜缓不急之务。
  region: bianjing
  illustration: event.court_debate
  proposal: favor
  keywords: [书画, 进奉, 宫廷]
  advisors:
    - {character: cai_you, stance: support, option: favor, line: 陛下，御府所藏虽富，前代名迹散在民间的还多着呢！臣愿领其事，不出一年，必教陛下大开眼界。}
    - {character: liang_shicheng, stance: neutral, option: limit, line: 官家喜欢，收一些也是好的。只是遣使下去，外头又要说闲话，不如只收进献的。}
    - {character: chen_dong, stance: oppose, option: halt, line: 学生斗胆！河北之民转输于道，而使者搜书画于州县，此何异花石之扰？}
  options:
    - id: favor
      label: 遣使访求，所费出于内帑
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 访求书画鼎彝}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 御府增藏}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 蔡攸领其事}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 州县借进奉为名搜括}
      hint: 国库 −40，君威 +1；佞幸 +1，吏治积弊 +1
    - id: halt
      label: 罢访求之议，禁州县借名搜括
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 罢访求之议}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 禁借名搜括}
        - {op: adjust_trait, character: cai_you, trait: favor, delta: -1}
      hint: 佞幸 −1，吏治积弊 −1；蔡攸不悦
    - id: limit
      label: 不遣使，只收臣民进献
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 酬进献者}
      hint: 国库 −10

# ============================== T9 宣和四年夏 ==============================
- id: t9_zhong_jinbing
  title: 种师道请期
  summary: >-
    种师道已与伐燕诸军会齐，奏言：粮道已通，士卒稍习；然燕京城坚，辽将耶律大石善战，宜进薄城下，围而不攻，待其内变而后取之。
    枢密院则请速战。请陛下定进止。（燕京若为金人先取，则伐燕之功尽弃。）
  region: hebei_dong
  illustration: event.beifa
  conditions:
    all:
      - {kind: turn, operator: gte, value: 9}
      - {kind: flag, key: "memorial:t8_beifa", value: zhong_lead}
      - {kind: army_strength, army: beifa_army, operator: gt, value: 0}
      - {kind: army_commander, army: beifa_army, character: zhong_shidao}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: flag, key: yanjing_song, operator: absent}
      - any:
          - all:
              - {kind: army_region, army: beifa_army, region: hebei_dong}
              - {kind: character_region, character: zhong_shidao, region: hebei_dong}
          - all:
              - {kind: army_region, army: beifa_army, region: hebei_xi}
              - {kind: character_region, character: zhong_shidao, region: hebei_xi}
  proposal: siege
  keywords: [伐燕, 燕京, 种师道]
  advisors:
    - {character: zhong_shidao, stance: support, option: siege, requires: {region: [hebei_dong, hebei_xi]}, line: （自军中驰奏）老臣以为，燕京城坚，强攻则伤士卒。进薄城下，断其樵采，辽人内外离心，必有开门来降者。待其师老，一击可也。}
    - {character: tong_guan, stance: oppose, option: march, line: 老种畏懦如此！兵贵神速，再拖下去，燕京就让女真抢了去了。}
    - {character: zhao_liangsi, stance: oppose, option: march, line: 燕人思汉，王师一至即当开门。何必围而待之？}
    - {character: li_bangyan, stance: neutral, option: recall, line: 既然两边都说得有理，那不如收兵回来，钱粮也省了。}
  options:
    - id: march
      label: 进兵燕京，到即攻城
      ops:
        - {op: adjust_army, army: beifa_army, quality_delta: 0.1, reason: 种师道到军整训}
        - {op: march, army: beifa_army, to_region: yanshan, with_commander: true}
        - {op: set_army_posture, army: beifa_army, posture: attack}
      hint: 伐燕诸军经种师道整训（素质 +0.1），与之同行赴燕京（行程见回执），到即进击；主帅在军，将才有加成
    - id: recall
      label: 罢兵，伐燕诸军归建河北
      ops:
        - {op: merge_army, army: beifa_army, into: hebei_army, reason: 伐燕诸军罢归河北}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋兵临边而不进}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 出师无功}
      hint: 伐燕诸军并入河北西路禁军（归建）；君威 −1，金人轻宋（风闻）↑
    - id: siege
      label: 进薄燕京城下，围而不攻，待其内变
      ops:
        - {op: adjust_army, army: beifa_army, quality_delta: 0.1, reason: 种师道到军整训}
        - {op: march, army: beifa_army, to_region: yanshan, with_commander: true}
        - {op: set_army_posture, army: beifa_army, posture: hold}
        - {op: adjust_resource, resource: grain, delta: -30, reason: 围城馈运}
      hint: 伐燕诸军经种师道整训（素质 +0.1），与之同行赴燕京城下（行程见回执），坚守不攻；粮储 −30。燕京若有内变（如降将来附），则合兵而攻；久围不下，金人或先入燕

- id: t9_beifa_jiutun
  title: 伐燕诸军久屯
  summary: >-
    伐燕诸军屯于河北已久，而主帅种师道尚未到军，诸将坐守营垒，粮草日耗。枢密院请以副将统之先进，或罢兵归建；
    亦有请再催种师道赴军者。（燕京若为金人先取，则伐燕之功尽弃。）
  region: hebei_dong
  illustration: event.beifa
  conditions:
    all:
      - {kind: flag, key: "memorial:t8_beifa", value: zhong_lead}
      - {kind: flag, key: "memorial:t9_zhong_jinbing", operator: absent}
      - {kind: flag_age, key: beifa_started, operator: gte, value: 2}
      - {kind: army_strength, army: beifa_army, operator: gt, value: 0}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: flag, key: yanjing_song, operator: absent}
      - {kind: character_status, character: zhong_shidao, value: alive}
      - any:
          - {kind: army_region, army: beifa_army, region: hebei_dong}
          - {kind: army_region, army: beifa_army, region: hebei_xi}
      - {not: {all: [{kind: army_region, army: beifa_army, region: hebei_dong}, {kind: character_region, character: zhong_shidao, region: hebei_dong}]}}
      - {not: {all: [{kind: army_region, army: beifa_army, region: hebei_xi}, {kind: character_region, character: zhong_shidao, region: hebei_xi}]}}
  proposal: march
  keywords: [伐燕, 燕京, 种师道]
  advisors:
    - {character: tong_guan, stance: support, option: march, line: 等老种？等到燕京姓了完颜也等不来！副将带着打便是。}
    - {character: ma_kuo, stance: neutral, option: urge, line: 一军无主，进退皆难。宜严催种师道赴军，到日即定进止。}
    - {character: li_bangyan, stance: oppose, option: recall, line: 主帅都没到，打什么？收兵回来罢。}
  options:
    - id: march
      label: 以副将统伐燕诸军进兵燕京
      ops:
        - {op: march, army: beifa_army, to_region: yanshan, with_commander: false}
        - {op: set_army_posture, army: beifa_army, posture: attack}
      hint: 伐燕诸军赴燕京（行程见回执），主帅不在军中、副将暂摄，到即进击；将才加成不计
    - id: recall
      label: 罢兵，伐燕诸军归建河北
      ops:
        - {op: merge_army, army: beifa_army, into: hebei_army, reason: 伐燕诸军罢归河北}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋兵临边而不进}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 出师无功}
      hint: 伐燕诸军并入河北西路禁军（归建）；君威 −1，金人轻宋（风闻）↑
    - id: urge
      label: 严催种师道赴军，诸军仍坚守待命
      ops:
        - {op: set_army_commander, army: beifa_army, character: zhong_shidao, dispatch: true}
        - {op: adjust_resource, resource: grain, delta: -20, reason: 久屯耗粮}
      hint: 种师道若未在途，即自所在赴军（行程见回执；已在途中者照旧）；粮储 −20。主帅到军之后另有奏请定进兵之期

- id: t9_kuiyun
  turn: 9
  expires_after: 1
  title: 伐燕馈运
  summary: 河北转运司奏：伐燕诸军仰给于河北，民夫转输，道路相望，而军中犹告乏粮。请增拨钱粮，或就地括籴。
  region: hebei_dong
  illustration: event.beifa
  conditions:
    all:
      - {kind: flag, key: beifa_started, value: true}
      - {kind: army_strength, army: beifa_army, operator: gte, value: 30000}
      - {kind: region_controller, region: yanshan, faction: liao}
  proposal: supply
  keywords: [伐燕, 馈运, 河北, 军粮]
  advisors:
    - {character: tong_guan, stance: support, option: supply, line: 兵马未动，粮草先行。军中缺粮，叫老奴怎么打？}
    - {character: wang_fu, stance: support, option: kuo, requires: {office: [shaozai, taizai]}, line: 河北富户积粟甚多，令其入中，何必远自东南转输？}
    - {character: ma_kuo, stance: oppose, option: supply, line: 括籴河北，则河北之民先怨。臣请自京师拨发，宁多费一些。}
  options:
    - id: none
      label: 责转运司自行措置
      ops:
        - {op: adjust_army, army: beifa_army, quality_delta: -0.05, reason: 军中乏食}
      hint: 伐燕诸军素质 −0.05（乏食）
    - id: supply
      label: 自京师增拨钱粮
      ops:
        - {op: adjust_resource, resource: grain, delta: -60, reason: 增拨伐燕军粮}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 增拨伐燕军费}
        - {op: adjust_army, army: beifa_army, quality_delta: 0.05, reason: 军粮充足}
      hint: 粮储 −60，国库 −40；伐燕诸军素质 +0.05
    - id: kuo
      label: 就河北括籴
      ops:
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -6}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: -4}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 括籴河北}
        - {op: adjust_army, army: beifa_army, quality_delta: 0.03, reason: 括籴得粮}
      hint: 河北东路治安 −6、西路 −4，民心 −2；伐燕诸军素质 +0.03

- id: t9_xicheng
  turn: 9
  title: 西城括田
  summary: 内侍李彦主西城所，括京西、京东诸州民田为公田，令出租课；民有执契来诉者，反坐以罪。州县言失业之民日众，或聚山泽为盗。
  region: jingxi
  illustration: event.famine
  proposal: tax
  keywords: [括田, 西城所, 内侍, 民生]
  advisors:
    - {character: liang_shicheng, stance: support, option: tax, line: 官家，西城所岁入不少，禁中用度都靠着它。外头那些诉讼，奴婢看多是刁民。}
    - {character: chen_dong, stance: oppose, option: punish, line: 学生斗胆！夺民之田，又罪其诉，此桀纣之所不为！西城所不罢，京西之民无复生理。}
    - {character: zhang_shuye, stance: neutral, option: limit, requires: {region: jingdong}, line: （自京东驰奏）括荒闲之田可也；有契之田，夺之则民必为盗。臣在京东，所见盗贼多出于此。}
  options:
    - id: punish
      label: 罢西城所，还所括民田
      ops:
        - {op: set_flag, key: xicheng_abolished, value: true}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 还田退租}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 还民田}
        - {op: adjust_region, region: jingxi, stat: order, delta: 4}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢西城所}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罢扰民之政}
      hint: 国库 −30（退还租课）；民心 +3，京西治安 +4，佞幸 −2，君威 +1
    - id: tax
      label: 照旧括田，岁增公田租课
      ops:
        - {op: adjust_resource, resource: treasury, delta: 60, reason: 公田租课}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 括民田为公田}
        - {op: adjust_region, region: jingxi, stat: order, delta: -5}
        - {op: adjust_region, region: jingdong, stat: order, delta: -3}
      hint: 国库 +60；民心 −1，京西治安 −5、京东治安 −3
    - id: limit
      label: 只括荒闲之田，有契者勿问
      ops:
        - {op: adjust_resource, resource: treasury, delta: 20, reason: 括荒闲田}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 括田}
      hint: 国库 +20，民心 −1

# ============================== T10 宣和四年秋 ==============================
- id: t10_zaiju
  title: 再举之议
  summary: >-
    白沟之败，伐燕诸军退保雄州；辽人亦疲，燕京城中人心不固。枢密院讳言败衄，请增兵再举；言者以为兵已挫锐，宜罢兵修备。
    （金人闻宋兵之败，已有轻宋之意。）
  region: hebei_dong
  illustration: event.baigou_defeat
  conditions:
    all:
      - {kind: turn, operator: gte, value: 9}
      - {kind: turn, operator: lte, value: 11}
      - {kind: flag, key: beifa_lost, value: true}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: army_strength, army: beifa_army, operator: gte, value: 20000}
      - any:
          - {kind: army_region, army: beifa_army, region: hebei_dong}
          - {kind: army_region, army: beifa_army, region: hebei_xi}
      - {kind: character_status, character: zhong_shidao, value: alive}
  proposal: march
  keywords: [伐燕, 燕京, 白沟, 再举]
  advisors:
    - {character: tong_guan, stance: support, option: march, line: 小挫而已，不足挂齿，老奴已另有方略。再添一万禁兵，燕京必下！}
    - {character: wang_fu, stance: support, option: march, requires: {office: [shaozai, taizai]}, line: 一战不利便罢，金人岂不笑我？再举必克。}
    - {character: ma_kuo, stance: neutral, option: zhong_lead, line: 必欲再举，须易帅。宦者督战，诸将不服，前败即在于此。}
    - {character: zhong_shidao, stance: oppose, option: halt, line: 兵已挫锐，士无斗志。再驱之城下，必再败。不如罢兵修备，以全河北。}
    - {character: li_bangyan, stance: oppose, option: halt, line: 输了一回就够了，再输，连本钱都没了。}
  options:
    - id: march
      label: 增发禁军一万，再攻燕京
      ops:
        - {op: adjust_army, army: jinjun, delta: -10000, reason: 抽禁军一万再举}
        - {op: adjust_army, army: beifa_army, delta: 10000, reason: 禁军一万来会}
        - {op: march, army: beifa_army, to_region: yanshan, with_commander: true}
        - {op: set_army_posture, army: beifa_army, posture: attack}
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 再举军费}
      hint: 京师禁军 −10000、伐燕诸军 +10000，再攻燕京（行程见回执）；国库 −80；养兵不增（兵额对调）。再败则金人益轻宋
    - id: zhong_lead
      label: 易帅：以种师道节制伐燕诸军，再攻燕京
      memory: {character: zhong_shidao, text: 宣和四年秋，奉命代童贯节制伐燕诸军}
      ops:
        - {op: set_army_commander, army: beifa_army, character: zhong_shidao, dispatch: true}
        - {op: adjust_army, army: beifa_army, quality_delta: 0.05, reason: 易帅，申严号令}
        - {op: march, army: beifa_army, to_region: yanshan, with_commander: true}
        - {op: set_army_posture, army: beifa_army, posture: attack}
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 再举军费}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 宦者罢兵柄}
        - {op: adjust_trait, character: tong_guan, trait: favor, delta: -1}
      hint: 种师道节制伐燕诸军（素质 +0.05），再攻燕京（行程见回执）；种师道若不在军中，自所在赴军，未到前副将暂摄；国库 −50，佞幸 −2
    - id: halt
      label: 罢兵，伐燕诸军归建河北
      ops:
        - {op: merge_army, army: beifa_army, into: hebei_army, reason: 伐燕诸军罢归河北}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 宋兵一败而罢}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 伐燕无功}
      hint: 伐燕诸军并入河北西路禁军（归建）；君威 −1，金人轻宋（风闻）↑。燕京多半为金人所取，日后只能议赎

