        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 邻好不绝}
      hint: 国库 −20，辽祚 +2
    - id: aid
      label: 再输粮帛助辽
      ops:
        - {op: adjust_resource, resource: grain, delta: -80, reason: 输粮助辽}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 输帛助辽}
        - {op: adjust_resource, resource: liao_zuo, delta: 6, reason: 宋助辽粮帛}
        - {op: set_flag, key: liao_aided, value: true}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −80，国库 −40，辽祚 +6，金人轻宋（风闻）↑

# ============================== 宣和七年（T20–T23）：辽亡与胡马南牧 ==============================
- id: t_liao_wang
  title: 辽亡
  summary: 金将娄室执辽主天祚于应州之野，辽自是而亡。宋与金直接为邻，燕山、河东皆当其冲；金使将至，来告擒辽主。
  region: yunzhong
  illustration: event.tianzuo_captured
  conditions:
    all:
      - {kind: flag, key: liao_fallen, value: true}
      - {kind: flag_age, key: liao_fallen, operator: lte, value: 1}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: gifts
  keywords: [辽亡, 金使, 边备]
  advisors:
    - {character: zhao_liangsi, stance: support, option: gifts, line: 辽既亡，金与我共有燕云。遣使致贺，重申盟好，彼当无南顾之意。}
    - {character: ma_kuo, stance: oppose, option: fortify, requires: {region: bianjing}, line: 女真灭辽之后，所欲者唯有南朝。贺使可遣，城不可不修。}
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 人家打赢了，咱们送份贺礼，礼多人不怪嘛。}
  options:
    - id: gifts
      label: 遣使贺金，重申盟好
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 遣使贺金}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋使恭谨}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 贺灭旧邻}
      hint: 国库 −40，君威 −1，金人轻宋（风闻）↓
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和七年，辽亡，朝廷未有处置}
      hint: 无增减
    - id: fortify
      label: 收辽之溃卒，修河北、河东北边城寨（两季）
      ops:
        - op: start_project
          name: 修北边城寨
          region: hebei_xi
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 8}
            - {op: adjust_region, region: hedong, stat: defense, delta: 4}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 北边城寨修治}
      hint: 国库每季 −40 共两季；成后河北西路防务 +8、河东防务 +4、武备 +2

- id: t21_jin_envoy
  turn: 21
  expires_after: 1
  title: 金使倨傲
  summary: 金使至汴京，倨傲不拜，历数南朝失信之事，言辞之间已有南牧之意。宰执或请卑辞厚礼以安之，或请据理折之。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: "event:jin_envoy_blame:fired", operator: exists}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: character_status, character: ma_kuo, value: alive}
  proposal: gifts
  keywords: [金使, 议和, 岁币]
  advisors:
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 好汉不吃眼前亏。多给些金帛，把人哄高兴了送走便是。}
    - {character: li_gang, stance: oppose, option: frank, requires: {region: bianjing}, line: 使者倨傲，正是试我虚实。示之以弱，则南牧之期愈近。}
    - {character: ma_kuo, stance: neutral, option: spy, requires: {region: bianjing}, line: 臣愿随报聘之使北行，亲见其兵马粮储，回奏陛下。}
  options:
    - id: gifts
      label: 卑辞厚礼以安其心
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 厚赐金使}
        - {op: adjust_resource, resource: authority, delta: -3, reason: 卑辞事金}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人知宋可欺}
        - {op: adjust_resource, resource: nanmu, delta: -2, reason: 金人得赂稍缓}
      hint: 国库 −80，君威 −3；金人轻宋（风闻）略↑，而胡马南牧（风闻）略↓
    - id: spy
      label: 遣马扩随报聘之使北行，觇其虚实
      memory: {character: ma_kuo, text: 宣和七年夏，奉命随报聘之使北行，觇金人虚实}
      ops:
        - {op: set_flag, key: "intel:nanmu", value: true}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 报聘金国}
      hint: 国库 −20；得金人治兵虚实之报（「胡马南牧」的风闻区间减半，只减半一次、不叠加）
    - id: frank
      label: 据理折之，并谕边臣严备
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 折金使之倨}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 边臣严备}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 金人知宋有人}
      hint: 君威 +2，武备 +1，金人轻宋（风闻）↓

- id: t22_fangqiu
  turn: 22
  title: 防秋
  summary: 秋高马肥，北边例当防秋。枢密院请增发河北、河东戍兵与器械，严烽燧斥候；或言连年边费不赀，请依常例而已。
  region: hebei_xi
  illustration: event.military_drill
  conditions: {kind: flag, key: jin_invaded, operator: absent}
  proposal: fortify
  keywords: [防秋, 河北, 河东, 边备]
  advisors:
    - {character: zhang_xiaochun, stance: support, option: fortify, requires: {region: hedong}, line: （自太原驰奏）每岁秋冬，正是北人南牧之时。烽燧、斥候、城守，一样不可松。}
    - {character: ma_kuo, stance: support, option: scout, requires: {region: bianjing}, line: 防秋之要，在知敌之动静。多遣斥候深入，胜于多屯兵于城下。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 年年防秋，年年没事。今年也照旧便是，何必多花钱？}
  options:
    - id: keep
      label: 依常例防秋
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和七年秋，防秋依常例}
      hint: 无增减
    - id: scout
      label: 多遣斥候深入云中、燕山
      ops:
        - {op: set_flag, key: "intel:nanmu", value: true}
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 遣斥候}
      hint: 国库 −15；得金人动静之报（「胡马南牧」的风闻区间减半，只减半一次、不叠加）
    - id: fortify
      label: 增发器械、严烽燧，河北、河东并加防秋
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 河北河东防秋}
        - {op: adjust_region, region: hebei_xi, stat: defense, delta: 3}
        - {op: adjust_region, region: hedong, stat: defense, delta: 3}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 防秋}
      hint: 国库 −40，河北西路、河东防务各 +3，武备 +1

# ---- 金人治兵（先声：胡马南牧初至山雨之季，事件设 jin_warning）----
- id: t_jin_warning
  title: 金人治兵
  summary: >-
    边臣交章奏报：金人于云中、平州聚粮治兵，括马造器，往来使者言辞日倨。河东、河北守臣皆请预为之备：京城守具久弛，
    太原城虽坚而器械多朽。
  region: hedong
  illustration: event.military_drill
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: fortify
  keywords: [金人, 城防, 太原, 汴京, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, requires: {region: bianjing}, line: 臣亲见女真兵马，人皆善骑射，号令如一。今其聚粮治兵，非为他国，必为我也。}
    - {character: zhang_xiaochun, stance: support, option: taiyuan, requires: {region: hedong}, line: （自太原驰奏）太原城高池深，然守具多朽、粮储只够半年。陛下若肯拨钱修治，臣保太原不失。}
    - {character: zong_ze, stance: support, option: both, requires: {region: jingdong}, line: （自京东驰书）臣老矣，所忧者河北之民。京城要修，太原要修，一日不可缓！}
    - {character: li_bangyan, stance: oppose, option: stall, requires: {region: bianjing}, line: 金人新得辽地，正要喘口气，哪有工夫来打咱们？边臣怕担干系，故意说得吓人。}
  options:
    - id: stall
      label: 以为边臣过虑，置之
      ops:
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 主和者之言得行}
      hint: 佞幸 +1；城防如旧
    - id: taiyuan
      label: 修太原城（两季）
      ops:
        - op: start_project
          name: 修太原城
          region: hedong
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 12}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 太原城修治}
      hint: 国库每季 −40 共两季；成后河东防务 +12、武备 +1（太原防务 ≥ 80 即为坚城，攻者须倍众方能克之）
    - id: both
      label: 京城、太原并修
      ops:
        - op: start_project
          name: 修汴京城池
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 3
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 20}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 京城守具修治}
        - op: start_project
          name: 修太原城
          region: hedong
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 12}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 太原城修治}
      hint: 国库头两季每季 −90、第三季 −50；成后汴京防务 +20、河东防务 +12、武备 +3
    - id: fortify
      label: 修汴京城池守具（三季）
      ops:
        - op: start_project
          name: 修汴京城池
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 3
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 20}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 京城守具修治}
      hint: 国库每季 −50 共三季；成后汴京防务 +20、武备 +2（防务 ≥ 80 即为坚城，攻者须倍众方能克之）

- id: t_xijun_east
  title: 西军东调
  summary: 河东、京畿兵少，枢密院请调西军东屯关中：进可援河东，退可卫京师。泾原、秦凤诸路则以夏人附金为虑，请勿尽撤。
  region: xibian
  illustration: event.military_drill
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: army_strength, army: xijun_qinfeng, operator: gte, value: 25000}
