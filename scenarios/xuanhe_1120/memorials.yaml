      ops:
        - {op: remember, character: li_gang, fact: 金军退后，安辑之议未行}
      hint: 无增减

- id: t_war_lungong
  title: 论功行赏
  summary: 金军退去，守城、勤王、劫营诸将士请叙功。或请厚赏以励将来，或请赏而有节、以纾府库。
  region: bianjing
  illustration: event.qinwang
