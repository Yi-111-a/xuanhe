        主帅与诸军会齐之后整训（素质 +0.1）并另有奏请定进兵之期；与辽绝好；国库 −150，粮储 −60，辽祚 −3，佞幸 −2；养兵不增（兵额对调）。迁延日久，燕京或为金人先取
