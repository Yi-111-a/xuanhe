        - {op: adjust_resource, resource: dongnan, delta: -5, reason: 罢应奉司}
        - {op: adjust_resource, resource: ningxing, delta: -3, reason: 王、梁不得领应奉}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 守罢花石之信}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -1}
      hint: 每季省应奉司之费（见账目）；东南民怨 −5，佞幸 −3，君威 +1；王黼不悦
    - id: keep
      label: 留中不报
      ops:
        - {op: remember, character: li_gang, fact: 宣和三年秋，臣论应奉司，留中不报}
      hint: 无增减
