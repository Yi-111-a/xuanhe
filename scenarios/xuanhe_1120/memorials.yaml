  title: 李纲论边备
  summary: 御史中丞李纲上疏言三事：一曰河北边备久弛，宜修城练兵；二曰冗兵冗费，宜汰而省之；三曰佞幸用事，宜远之。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: office_holder, office: yushi, character: li_gang}
      - {kind: character_region, character: li_gang, region: bianjing}
  proposal: frank
  keywords: [李纲, 言路, 武备, 佞幸]
  advisors:
    - {character: li_gang, stance: support, option: frank, requires: {region: bianjing}, line: 陛下，臣有三事不敢不言：一曰修武备，二曰收人心，三曰远小人。祖宗二百年基业，不可寄于一纸盟书。}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [shaozai, taizai]}, line: 李中丞所言，无非老生常谈。燕京已在掌握，天下太平，何必自扰？}
    - {character: gao_qiu, stance: neutral, option: partial, requires: {office: dianshuai}, line: 修城练兵，臣无异议。至于汰兵……禁军仪仗，天下第一，这个汰不得。}
  options:
    - id: keep
      label: 留中不报
      ops:
        - {op: adjust_resource, resource: authority, delta: -1, reason: 直言不报}
        - {op: adjust_trait, character: li_gang, trait: favor, delta: -1}
      hint: 君威 −1
    - id: partial
      label: 只行修边一事
      ops:
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 修边}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 修城练兵之费}
      hint: 国库 −30，武备 +1
    - id: frank
      label: 嘉纳，三事次第施行
      memory: {character: li_gang, text: 宣和五年春，论边备三事，陛下嘉纳}
      ops:
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 修边汰冗}
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 修城练兵之费}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 远小人}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 纳直言}
        - {op: adjust_trait, character: gao_qiu, trait: favor, delta: -1}
      hint: 国库 −50；武备 +2，佞幸 −2，君威 +1

- id: t12_dianshuai
  turn: 12
  title: 殿前占役
  summary: 言者论：殿前司诸军多为将校私役，或供营造，或充僮仆，营中教阅之日，十不到五。殿前都指挥使高俅不能禁，或谓其身即为之。
  region: bianjing
  illustration: event.jinjun_review
  conditions: {kind: office_holder, office: dianshuai, character: gao_qiu}
  proposal: punish
  keywords: [禁军, 阙额, 高俅, 武备]
  advisors:
    - {character: gao_qiu, stance: oppose, option: keep, requires: {office: dianshuai}, line: 陛下，营中人数大抵如常，臣时时督责。偶有几个兵士帮着修修营房，也是常事。}
    - {character: ma_kuo, stance: support, option: dismiss, line: 臣在营中所见，禁兵执役于将校私第者不知其数。殿帅不易，禁军终不可用。}
    - {character: tong_guan, stance: neutral, option: punish, line: 高太尉也是老人了，责他几句，叫他把兵还了便是，不必罢官。}
  options:
    - id: keep
      label: 置之不问
      ops:
        - {op: remember, character: gao_qiu, fact: 宣和五年春，言者论殿前占役，不问}
      hint: 无增减
    - id: punish
      label: 责殿前司尽还役兵于营
      ops:
        - {op: adjust_army, army: jinjun, quality_delta: 0.03, reason: 役兵还营}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 役兵还营}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 殿前司受责}
        - {op: adjust_trait, character: gao_qiu, trait: favor, delta: -1}
      hint: 京师禁军素质 +0.03，武备 +1，佞幸 −1
    - id: dismiss
      label: 罢高俅殿帅
      memory: {character: gao_qiu, text: 宣和五年春，以殿前占役罢殿帅}
      ops:
        - {op: dismiss, character: gao_qiu, office: dianshuai}
        - {op: set_flag, key: gaoqiu_dismissed, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -4, reason: 罢高俅}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 禁军可整}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 整肃禁旅}
      hint: 高俅罢殿帅，京师禁军暂无统帅（可用政令卡另择殿帅）；佞幸 −4，武备 +2，君威 +1

- id: t12_dudie
  turn: 12
  title: 鬻度牒
  summary: 祠部请增印度牒出卖，以助边用。言者以为僧道日多，游手不耕，且有冒滥之弊。
  region: bianjing
  illustration: event.daoist_rite
  proposal: tax
  keywords: [度牒, 财赋, 僧道]
  advisors:
    - {character: wang_fu, stance: support, option: tax, requires: {office: [shaozai, taizai]}, line: 一纸度牒，值钱百千，朝廷不费分毫。边用方急，何可不卖？}
    - {character: chen_dong, stance: oppose, option: refuse, line: 度牒多一道，则耕夫少一人。卖牒以给边，是以东南之耕夫养燕山之戍卒也！}
    - {character: cai_jing, stance: neutral, option: limit, line: 卖之可也，而有其限。限则价高，不限则滥。}
  options:
    - id: refuse
      label: 不许
      ops:
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 不鬻度牒}
      hint: 吏治积弊 −1
    - id: tax
      label: 增印度牒出卖
      ops:
        - {op: adjust_resource, resource: treasury, delta: 60, reason: 鬻度牒}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 度牒冒滥}
      hint: 国库 +60；吏治积弊 +1
    - id: limit
      label: 限额出卖
      ops:
        - {op: adjust_resource, resource: treasury, delta: 30, reason: 限额鬻度牒}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 度牒}
      hint: 国库 +30，吏治积弊 +1

# ============================== T13 宣和五年夏 ==============================
- id: t13_zhangjue
  turn: 13
  title: 张觉来附
  summary: >-
    辽平州守将张觉先已降金，金以平州为南京、以觉留守。今金人驱燕京职官、富民北迁，道出平州，张觉执杀随行的燕京旧臣数人，据城叛金，遣使奉表求附。
    朝中或主纳之，以平州为燕山之屏；或言方与金交割，纳其叛将，是启衅也。若不处置，下季照前议纳之。
  region: pingzhou
  illustration: event.zhangjue
  conditions:
    all:
      - {kind: flag, key: zhangjue_risen, value: true}
      - {kind: character_status, character: zhang_jue, value: alive}
  proposal: accept
  keywords: [张觉, 平州, 纳叛]
  advisors:
    - {character: zhao_liangsi, stance: support, option: accept, line: 平、营、滦三州，本燕地也。张觉以地来归，正可补燕山之缺。燕人思汉久矣！}
    - {character: wang_fu, stance: support, option: accept, requires: {office: [shaozai, taizai]}, line: 天与不取，反受其咎。得平州，则燕山有屏障，此陛下圣德所致。}
    - {character: ma_kuo, stance: oppose, option: refuse_jue, line: 臣亲见金人，最恨背盟。今纳其叛将，彼必以此为辞。平州弹丸之地，不足以抵其兵锋。}
    - {character: li_gang, stance: oppose, option: refuse_jue, requires: {region: bianjing}, line: 新盟未寒而纳其叛臣，曲在我矣。曲在我，则他日有辞以伐我。}
  options:
    - id: accept
      label: 纳之，以平州为泰宁军，授张觉节度使
      ops:
        - {op: set_flag, key: zhangjue_accepted, value: true}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋纳金之叛将}
        - {op: adjust_resource, resource: nanmu, delta: 3, reason: 金人以纳叛为辞}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 远人来归}
      hint: 君威 +1；金人轻宋（风闻）↑、胡马南牧（风闻）↑。金人必来攻平州
    - id: refuse_jue
      label: 却其表，不纳
      ops:
        - {op: set_flag, key: zhangjue_refused, value: true}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋守约不纳叛}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 燕人失望}
        - {op: adjust_trait, character: zhao_liangsi, trait: favor, delta: -1}
      hint: 君威 −1（燕人失望）；金人轻宋（风闻）↓
    - id: yin
      label: 阴纳之：不受其表，而以金帛、甲仗资之
      ops:
        - {op: set_flag, key: zhangjue_accepted, value: true}
        - {op: set_flag, key: zhangjue_yin, value: true}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 阴资张觉}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋阴助张觉}
        - {op: adjust_resource, resource: nanmu, delta: 1, reason: 金人疑宋}
      hint: 国库 −30；金人轻宋（风闻）略↑、胡马南牧（风闻）略↑。金人仍将攻平州，张觉兵败则来奔，金人仍会来索

- id: t13_changsheng
  title: 常胜军
  summary: 常胜军郭药师所部骄悍，衣粮倍于他军，犹以不足为言；燕人、河北人多畏之。朝议或请厚饷以安之，或请分其众，或请以宿将监之。
  region: yanshan
  illustration: event.guo_surrender
  conditions:
    all:
      - {kind: turn, operator: gte, value: 12}
      - {kind: flag, key: guo_defected_song, value: true}
      - {kind: flag, key: guo_defected_jin, operator: absent}
      - {kind: flag, key: changsheng_split, operator: absent}
      - {kind: army_strength, army: changsheng, operator: gte, value: 6000}
      - {kind: office_holder, office: changsheng_tong, character: guo_yaoshi}
      - any:
          - {kind: army_region, army: changsheng, region: yanshan}
          - {kind: army_region, army: changsheng, region: hebei_dong}
  proposal: favor
  keywords: [郭药师, 常胜军, 燕山, 降将]
  advisors:
    - {character: guo_yaoshi, stance: support, option: favor, requires: {region: [yanshan, hebei_dong]}, line: （驰奏）末将的弟兄跟着末将吃了多少苦！朝廷若信得过，粮饷给足，末将替朝廷守燕山。}
    - {character: tong_guan, stance: support, option: favor, line: 常胜军是燕山的柱石，多给些钱粮，值得。}
    - {character: zhong_shidao, stance: oppose, option: split, line: 降人之兵，聚则难制。分屯诸州，杂以官军，乃可久安。}
    - {character: ma_kuo, stance: neutral, option: jian, line: 药师向背唯利是视。厚饷可安其一时，不可安其久远。宜以宿将监之。}
  options:
    - id: favor
      label: 厚饷安抚，岁增常胜军衣粮
      memory: {character: guo_yaoshi, text: 宣和五年，朝廷厚饷常胜军}
      ops:
        - {op: add_ledger, id: changsheng_xiang, name: 常胜军厚饷, category: treasury, amount: -6, kind: recurring, reason: 常胜军衣粮加给（游戏折算）, cancellable: false}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: 2}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -2}
      hint: 每季另支常胜军厚饷 6 万缗；郭药师感恩（忠诚 +2）；河北东路治安 −2（骄兵）
    - id: jian
      label: 以宿将监其军
      ops:
        - {op: set_flag, key: changsheng_watched, value: true}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
        - {op: adjust_trait, character: guo_yaoshi, trait: fear, delta: 1}
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 监军之费}
      hint: 国库 −10；郭药师自疑（忠诚 −1）；日后若有变，可早为之备
    - id: split
      label: 分常胜军四千屯河北西路
      memory: {character: guo_yaoshi, text: 宣和五年，朝廷分我常胜军之众}
      ops:
        - {op: detach, army: changsheng, strength: 4000, to_region: hebei_xi, new_army_name: 常胜军分屯}
        - {op: set_flag, key: changsheng_split, value: true}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
      hint: 常胜军分兵 4000 屯河北西路（行程见回执）；常胜军已分屯（日后即有变，所部不能尽从）；郭药师不悦（忠诚 −1）

- id: t13_ji
  turn: 13
  title: 河北京东告饥
  summary: 河北、京东、淮南诸路奏：今岁水旱相仍，民多艰食，流移者众，盗贼间起；又困于燕山馈运。
  region: jingdong
  illustration: event.famine
  proposal: relief
  keywords: [饥荒, 赈济, 河北, 京东]
  advisors:
    - {character: zhang_shuye, stance: support, option: relief, requires: {region: jingdong}, line: （自京东驰奏）饥民一聚，便是盗。开仓之粟，胜于捕盗之兵。}
    - {character: chen_dong, stance: support, option: remit, line: 民既无食，又督其租，是驱之为盗也。}
    - {character: wang_fu, stance: oppose, option: none, requires: {office: [shaozai, taizai]}, line: 燕山馈运正急，仓粟岂可轻发？州县自行赈恤便是。}
  options:
    - id: remit
      label: 蠲被灾州县租赋
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 蠲被灾州县租赋}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 蠲赋}
      hint: 国库 −50，民心 +2
    - id: none
      label: 令州县自行赈恤
      ops:
        - {op: adjust_region, region: jingdong, stat: order, delta: -6}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -3}
      hint: 京东治安 −6，河北东路治安 −3（饥民聚为盗）
    - id: relief
      label: 发常平仓赈济
      ops:
        - {op: adjust_resource, resource: grain, delta: -80, reason: 赈河北京东饥民}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 赈饥}
        - {op: adjust_region, region: jingdong, stat: order, delta: 3}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 2}
      hint: 粮储 −80，民心 +2；京东治安 +3、河北东路治安 +2

- id: t13_mubing
  turn: 13
  title: 招募敢战士
  summary: 枢密院请于河北、京东招募敢战士，以补边兵之阙；或言招募之人多是游手、饥民，未必可用，而养之岁费不赀。
  region: hebei_dong
  illustration: event.military_drill
  proposal: recruit
  keywords: [募兵, 武备, 河北]
  advisors:
    - {character: tong_guan, stance: support, option: recruit, line: 兵多总比兵少好。招他一万，边上就踏实了。}
    - {character: ma_kuo, stance: neutral, option: half, line: 募之可也，须严加选练。宁少而精，不可多而滥。}
    - {character: li_bangyan, stance: oppose, option: none, line: 一万张嘴，一年要吃多少？臣算不清，反正不少。}
  options:
    - id: recruit
      label: 募敢战士一万，隶河北东路
      ops:
        - {op: adjust_army, army: hebei_dong_army, delta: 10000, reason: 募敢战士一万}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 补边兵之阙}
      hint: 河北东路禁军 +10000（素质不变），国库 −40，武备 +2；此后养兵每季 +3 万缗、1.2 万石
    - id: half
      label: 精选五千
      ops:
        - {op: adjust_army, army: hebei_dong_army, delta: 5000, quality_delta: 0.02, reason: 精选敢战士五千}
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 补边兵之阙}
      hint: 河北东路禁军 +5000、素质 +0.02，国库 −25，武备 +1；此后养兵每季 +1.5 万缗、0.6 万石
    - id: none
      label: 罢议
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和五年夏，招募之议不行}
      hint: 无增减

# ============================== T14 宣和五年秋 ==============================
- id: t14_aguda
  turn: 14
  title: 金主之丧
  summary: 金主阿骨打卒于还师途中，弟吴乞买嗣立。新主持重而有吞并之志，诸将粘罕、斡离不各握重兵。朝议遣使吊祭、贺即位。
  region: bianjing
  illustration: event.aguda_death
  conditions: {kind: flag, key: aguda_dead, value: true}
  proposal: gifts
  keywords: [金使, 阿骨打, 吴乞买]
  advisors:
    - {character: zhao_liangsi, stance: support, option: gifts, line: 金人重礼。吊祭从厚，贺新主从厚，盟好可保。}
    - {character: ma_kuo, stance: neutral, option: spy, line: 新主初立，诸将之向背未定。臣请随使北行，看粘罕、斡离不之意如何。}
    - {character: li_bangyan, stance: oppose, option: keep, line: 金人死了个皇帝，咱们还得送礼？送一回也罢，可别送出规矩来。}
  options:
    - id: gifts
      label: 遣使吊祭、贺即位，厚其礼币
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 吊贺金主礼币}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋礼甚恭}
      hint: 国库 −30，金人轻宋（风闻）↓
    - id: keep
      label: 循常礼，不另遣使
      ops:
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 宋礼简慢}
      hint: 金人轻宋（风闻）↑
    - id: spy
      label: 遣马扩随使，觇金新主与诸将虚实
      memory: {character: ma_kuo, text: 宣和五年秋，奉命随吊祭使至金，觇新主与诸将虚实}
      ops:
        - {op: set_flag, key: "intel:jin_contempt", value: true}
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 遣使觇金}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋遣使吊贺}
      hint: 国库 −15，金人轻宋（风闻）略↓；得金人虚实之报（「金人轻宋」的风闻区间减半，只减半一次、不叠加，已得报者无新益）

- id: t14_mazheng
  turn: 14
  title: 马政
  summary: 群牧司奏：诸监牧地多为豪右侵占，马多死耗；河北诸军骑兵有马者不及半数。请市马于西蕃，或令河北民户养马。
  region: bianjing
  illustration: event.jinjun_review
  proposal: shima
  keywords: [马政, 武备, 骑兵]
  advisors:
