    - {character: li_gang, stance: oppose, option: thrift, requires: {region: bianjing}, line: 理财之道，在节用而不在聚敛。宫中、应奉之费，省之可也。}
    - {character: li_bangyan, stance: neutral, option: keep, line: 钱的事，陛下问户部便是，臣只管写诏书。}
  options:
    - id: thrift
      label: 省宫廷用度三之一
      ops:
        - {op: add_ledger, id: gongting, name: 宫廷用度, category: treasury, amount: -15, kind: recurring, reason: 省三之一后（游戏折算）, cancellable: false}
