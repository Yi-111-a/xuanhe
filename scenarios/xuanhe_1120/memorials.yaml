- id: t6_yingfeng_li
  turn: 6
  expires_after: 1
  title: 李纲论应奉司
  summary: >-
    御史中丞李纲上疏：应奉司复置以来，名为禁中供奉，实与花石无异，东南之人谓「花石换了名目」。乱平未久而复扰之，
    是示天下以无信。请罢之。
  region: bianjing
  illustration: event.huashi
  conditions:
    all:
      - {kind: flag, key: yingfeng_restored, value: true}
