    金兵已破辽中京，天祚西走，燕京辽人立秦晋国王耶律淳。金使来趣夹攻：宋兵当出雄州取燕京。枢密院请以童贯督师，抽西军与河北禁军七万出师；
    河北河东宣抚使种师道以为伐燕无名，然请若必出师，由宣抚司节制。若不处置，下季枢密院照前议出师。
  region: hebei_dong
  illustration: event.beifa
  variant_of: t8_beifa
  conditions:
