# 奏疏条目。T0–T2 兼作教程；此后每季至少三条，另有按条件出现的史事环节与常设条目（见文末）。
# 次序约定：凡奏疏所问之事，相关事件一律在其后一季（或由选项直接执行），不得先于奏疏发生。
# 「若不处置，下季照例施行」的奏疏，对应 events.yaml 中的 *_default 事件（读 memorial:<id> absent）。
# 采纳某选项即把其 ops 加入诏书草案；确认后写入 flag memorial:<id> = option_id。memory 写入人物记忆。
# 文本为本游戏写作（【设】）；涉及史事处以 docs/FACT_CHECK.md 为准。hint 中「（风闻）」指隐藏数值，只写方向。

# ============================== T0 宣和二年春（序章） ==============================
- id: t0_haishang
  turn: 0
  title: 海上之盟
  summary: >-
    重和元年马政浮海通女真以来，金主阿骨打连破辽之东京，兵锋正盛。右文殿修撰赵良嗣请再使金，约夹攻辽：金取中京，宋取燕京，
    旧输辽之岁币转输于金。若不处置，下季枢密院照前议遣使。
  region: bianjing
  illustration: event.haishang
  proposal: ally
  keywords: [海上之盟, 联金, 夹攻, 燕京]
  advisors:
    - {character: wang_fu, stance: support, option: ally, line: 燕云陷没近二百年，今天赐良机，千载一时！此陛下恢复祖宗故疆之时也。}
    - {character: tong_guan, stance: support, option: ally, line: 契丹残破，女真骁勇，两面夹之，燕京唾手可得。老奴愿任其事。}
    - {character: zhao_liangsi, stance: support, option: ally, line: 燕人思汉久矣！女真新兴，重然诺，可与共事。}
    - {character: cai_jing, stance: neutral, option: loose, line: 老臣以为，与女真通好可也，夹攻之期宜缓定，免为人所制。}
    - {character: zhong_shidao, stance: oppose, option: refuse, requires: {region: xibian}, line: （自泾原驰表）澶渊以来百年无兵革，辽虽衰，犹是邻好。今助新兴之虏以攻旧邻，譬如盗入邻家而分其室，臣恐祸不在辽而在我。}
  options:
    - id: ally
      label: 遣赵良嗣使金，约夹攻辽、宋取燕京
      memory: {character: zhao_liangsi, text: 宣和二年春，奉命浮海使金，约夹攻辽}
      ops:
        - {op: set_flag, key: haishang_ally, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: -3, reason: 宋金夹攻之约}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋使浮海来聘}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 恢复故疆之议}
      hint: 辽祚 −3，君威 +1，金人轻宋（风闻）↓。此后须践夹攻之约（宣和四年伐燕），违期、伐燕不克都会使金人轻宋
    - id: loose
      label: 遣使通好，只议燕京旧地，不约夹攻之期
      memory: {character: zhao_liangsi, text: 宣和二年春，奉命使金通好，只议燕京旧地}
      ops:
        - {op: set_flag, key: haishang_loose, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: -1, reason: 宋金通好}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋首鼠两端}
      hint: 辽祚 −1，金人轻宋（风闻）↑。不必出兵伐燕；燕京之议留有余地，然金人未必肯与
    - id: spy
      label: 遣马扩随使觇其虚实，盟议缓定
      memory: {character: ma_kuo, text: 宣和二年春，奉命随使至金，觇其虚实}
      ops:
        - {op: set_flag, key: haishang_delay, value: true}
        - {op: set_flag, key: "intel:jin_contempt", value: true}
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 遣使觇金}
      hint: 国库 −15；得金人虚实之报（「金人轻宋」的风闻区间减半，只减半一次、不叠加）；盟议下季再定
    - id: refuse
      label: 守澶渊旧好，谢绝金使
      ops:
        - {op: set_flag, key: haishang_refused, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 宋守旧好}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人视宋为辽之与国}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 童、王之议不行}
      hint: 辽祚 +2，佞幸 −2，金人轻宋（风闻）↑。燕京不能由盟约取得；辽之亡缓而未止

- id: t0_huashi
  turn: 0
  title: 花石纲
  summary: >-
    提举苏杭应奉局朱勔奏：太湖新得巨石，玲珑高数丈，请增应奉岁额以充艮岳。两浙州县则言：纲运所过，拆水门、毁桥梁，
    民家一石一木稍堪玩者即破屋坏墙以取，东南怨声日甚。（应奉花石每季约费十八万缗，见账目。）
  region: liangzhe
  illustration: event.huashi
  proposal: raise
  keywords: [花石, 应奉, 朱勔, 艮岳]
  advisors:
    - {character: zhu_mian, stance: support, option: raise, requires: {region: liangzhe, office: yingfeng}, line: （自苏州驰奏）东南百姓闻是贡入御园，无不欢欣。区区怨言，皆刁民所为。}
    - {character: wang_fu, stance: support, option: raise, line: 陛下富有四海，取一石以娱圣心，何足挂齿？}
    - {character: cai_jing, stance: neutral, option: halve, line: 应奉不可遽罢，亦不可无节。老臣以为减其半、禁其扰，两全之道。}
    - {character: chen_dong, stance: oppose, option: abolish, line: 太学生陈东上书：东南之民困于花石，怨入骨髓，一夫奋臂，祸不可测！}
  options:
    - id: abolish
      label: 罢苏杭应奉局与花石纲，召还朱勔
      memory: {character: zhu_mian, text: 宣和二年春，陛下罢应奉局，召臣还京}
      ops:
        - {op: set_flag, key: huashi_abolished, value: true}
        - {op: set_flag, key: zhumian_dismissed, value: true}
        - {op: cancel_ledger, ledger_id: yingfeng_huashi}
        - {op: dismiss, character: zhu_mian, office: yingfeng}
        - {op: move_character, character: zhu_mian, to_region: bianjing}
        - {op: adjust_resource, resource: dongnan, delta: -12, reason: 罢花石纲}
        - {op: adjust_resource, resource: ningxing, delta: -5, reason: 罢应奉局}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罢扰民之政}
      hint: 每季省应奉花石 18 万缗；东南民怨 −12，佞幸 −5，君威 +1；朱勔罢官召还
    - id: halve
      label: 减纲运之半，禁拆屋坏桥
      ops:
        - {op: set_flag, key: huashi_halved, value: true}
        - {op: cancel_ledger, ledger_id: yingfeng_huashi}
        - {op: add_ledger, id: yingfeng_half, name: 应奉花石（减半）, category: treasury, amount: -9, kind: recurring, reason: 减纲运之半（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: dongnan, delta: -5, reason: 减纲运、禁扰民}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 应奉稍抑}
      hint: 应奉花石每季 18 → 9 万缗；东南民怨 −5，佞幸 −1
    - id: keep
      label: 一仍其旧
      ops:
        - {op: remember, character: zhu_mian, fact: 宣和二年春，应奉之事一仍其旧}
      hint: 无增减。东南民怨照旧逐季累积（≥ 66 方腊之变将起）
    - id: raise
      label: 照准，增应奉岁额
      memory: {character: zhu_mian, text: 宣和二年春，陛下准增应奉岁额}
      ops:
        - {op: set_flag, key: huashi_raised, value: true}
        - {op: add_ledger, id: yingfeng_extra, name: 应奉增额, category: treasury, amount: -8, kind: recurring, reason: 增应奉岁额（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: dongnan, delta: 6, reason: 增应奉岁额}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 朱勔得宠}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 奇石入御园}
      hint: 每季另支应奉增额 8 万缗；东南民怨 +6，佞幸 +2，君威 +1

- id: t0_jinjun
  turn: 0
  title: 禁军阙额
  summary: 枢密院、殿前司奏：京师禁军名籍八万，而营中多有阙额、占役，老弱充数，教阅久废。殿帅高俅请募兵补额。
  region: bianjing
  illustration: event.jinjun_review
  proposal: recruit
  keywords: [禁军, 阙额, 武备]
  advisors:
    - {character: gao_qiu, stance: support, option: recruit, requires: {office: dianshuai}, line: 禁军仪仗，天下第一！至于营中人数，补募若干便是，臣时时督责。}
    - {character: ma_kuo, stance: oppose, option: kuo, line: 臣在营中所见，名在籍而人不在营者十之二三，将校私役兵士为之营作。先括其实，再言补募。}
    - {character: tong_guan, stance: neutral, option: train, line: 补兵不如练兵。老奴以为拨款教阅，三季可见其效。}
  options:
    - id: kuo
      label: 遣使括实阙额，汰老弱一万，责将校占役
      memory: {character: gao_qiu, text: 宣和二年春，陛下遣使括禁军阙额，殿前司诸将多受责}
      ops:
        - {op: adjust_army, army: jinjun, delta: -10000, quality_delta: 0.1, reason: 括实阙额，汰老弱一万}
        - {op: adjust_resource, resource: wubei, delta: 5, reason: 括禁军之实}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 殿前司受责}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 整饬禁旅}
      hint: 京师禁军 −10000（汰老弱），素质 +0.1，武备 +5，佞幸 −2，君威 +1；养兵每季省 3 万缗、1.2 万石
    - id: recruit
      label: 照准，募兵两万补额
      ops:
        - {op: adjust_army, army: jinjun, delta: 20000, reason: 募兵两万补额}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 补额}
      hint: 京师禁军 +20000（素质不变），国库 −60，武备 +1；此后养兵每季 +6 万缗、粮 +2.4 万石
    - id: train
      label: 拨款教阅禁军三季
      ops:
        - op: start_project
          name: 禁军教阅
          region: bianjing
          cost_per_turn: {treasury: 40}
          turns: 3
          on_complete:
            - {op: adjust_army, army: jinjun, quality_delta: 0.08, reason: 教阅有成}
            - {op: adjust_resource, resource: wubei, delta: 4, reason: 禁军教阅有成}
            - {op: adjust_region, region: bianjing, stat: defense, delta: 4}
      hint: 国库每季 −40 共三季；成后禁军素质 +0.08、武备 +4、汴京防务 +4

- id: t0_ligang
  turn: 0
  title: 召还李纲
  summary: 太学诸生上书，言去岁京师大水，李纲论阴气太盛、宜防盗贼外患，忤旨贬监南剑州沙县税务；请召还，以开言路。少宰王黼以为李纲狂妄，不宜复用。
  region: bianjing
  illustration: event.chen_dong
  proposal: recall
  keywords: [李纲, 言路]
  advisors:
    - {character: chen_dong, stance: support, option: recall, line: 李纲以言获罪，天下之人皆知其忠。召之，言路自开。}
    - {character: wang_fu, stance: oppose, option: stay, requires: {office: [shaozai, taizai]}, line: 李纲狂妄，以天灾附会人事，召之则浮议又起。}
    - {character: liang_shicheng, stance: oppose, option: near, line: 官家，召他回来天天上书，不如挪到近处，也算恩典。}
  options:
    - id: recall
      label: 召还李纲，除御史中丞
      memory: {character: li_gang, text: 宣和二年春，陛下召臣还朝，除御史中丞}
      ops:
        - {op: appoint, character: li_gang, office: yushi, dispatch: true}
        - {op: set_flag, key: ligang_recalled, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -3, reason: 召还直臣}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 开言路}
      hint: 李纲自沙县启程入京（闽广驿程遥远，令达于下季）任御史中丞；佞幸 −3，君威 +1。此后李纲可于朝中进言
    - id: near
      label: 量移近郡，以观后效
      ops:
        - {op: move_character, character: li_gang, to_region: jiangnan}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 量移言官}
      hint: 李纲移江南，仍不在朝；佞幸 −1
    - id: stay
      label: 不召，留沙县
      ops:
        - {op: remember, character: li_gang, fact: 宣和二年春，朝廷议召还，不果}
      hint: 无增减

# ============================== T1 宣和二年夏 ==============================
- id: t1_cai
  turn: 1
  title: 蔡京乞致仕
  summary: 太师蔡京年逾七十，累上章乞骸骨。若不处置，下季三省依例许其致仕，仍朝朔望。
  region: bianjing
  illustration: event.cai_retire
  conditions: {kind: office_holder, office: taishi, character: cai_jing}
  proposal: retire
  keywords: [蔡京, 致仕, 宰相]
  advisors:
    - {character: cai_jing, stance: support, option: retire, line: 老臣衰朽，目力已昏，伏乞陛下许老臣归老。}
    - {character: wang_fu, stance: support, option: retire, requires: {office: [shaozai, taizai]}, line: 太师勋劳盖世，宜许其优游林下，以全始终。}
    - {character: cai_you, stance: support, option: retire, line: 家父老了，有些事未免想得太多，让他歇歇也好。}
    - {character: chen_dong, stance: support, option: retire_check, line: 蔡京门下滥授恩赏、侵渔东南，去位之日，宜核其实。}
    - {character: li_bangyan, stance: oppose, option: keep, line: 公相一去，满朝都是年轻人，谁镇得住？}
  options:
    - id: retire
      label: 准致仕，仍朝朔望
      memory: {character: cai_jing, text: 宣和二年夏，陛下准老臣致仕，仍朝朔望}
      ops:
        - {op: dismiss, character: cai_jing, office: taishi}
        - {op: set_character_status, character: cai_jing, status: retired, cause: 致仕，仍朝朔望}
        - {op: set_flag, key: cai_retired, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -3, reason: 公相去位}
      hint: 蔡京去位，佞幸 −3；太宰之位下季另议（王黼呼声最高）
    - id: retire_check
      label: 准致仕，并核其门下滥授恩赏
      memory: {character: cai_jing, text: 宣和二年夏，老臣致仕，陛下又命有司核我门下恩赏}
      ops:
        - {op: dismiss, character: cai_jing, office: taishi}
        - {op: set_character_status, character: cai_jing, status: retired, cause: 致仕，门下恩赏被核}
        - {op: set_flag, key: cai_retired, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -6, reason: 公相去位，滥赏被核}
        - {op: adjust_resource, resource: corruption, delta: -4, reason: 核滥授恩赏}
        - {op: adjust_resource, resource: treasury, delta: 40, reason: 追还滥赏}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 整肃纲纪}
        - {op: adjust_trait, character: cai_you, trait: loyalty, delta: -1}
      hint: 蔡京去位；佞幸 −6，吏治积弊 −4，国库 +40（追还滥赏），君威 +2；蔡氏门下怨望
    - id: keep
      label: 优诏不许，留公相总治三省
      ops:
        - {op: adjust_trait, character: cai_jing, trait: favor, delta: 1}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 公相留任}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 宰执不更}
      hint: 佞幸 +1，君威 −1；蔡京仍总治三省

- id: t1_yanjing
  turn: 1
  expires_after: 1
  title: 燕京之约
  summary: >-
    金使随赵良嗣至汴京，议所约之地：宋欲尽得燕云旧地，兼及西京；金人只许燕京及所属六州，平、营、滦与西京不在其内，
    岁币如辽旧额。金使谓「南朝但取燕京，余地当以兵取」。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    any:
      - {kind: flag, key: haishang_ally, value: true}
      - {kind: flag, key: haishang_loose, value: true}
  proposal: six
  keywords: [燕京, 燕云, 金使, 岁币]
  advisors:
    - {character: zhao_liangsi, stance: support, option: six, line: 先得燕京，余地徐图。女真重然诺，不宜争之过急。}
    - {character: wang_fu, stance: oppose, option: xijing, requires: {office: [shaozai, taizai]}, line: 燕云十六州，一州也不可少！西京不得，燕京亦难守。}
    - {character: ma_kuo, stance: oppose, option: written, line: 臣闻女真之言多变。不论多少，须载于誓书，一字一句，皆要分明。}
  options:
    - id: six
      label: 许之：先得燕京六州，岁币如辽旧额
      ops:
        - {op: set_flag, key: yanjing_terms, value: six}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋使易与}
      hint: 金人轻宋（风闻）↓；燕京之地以六州为限
    - id: xijing
      label: 坚持兼得西京与山后诸州
      ops:
        - {op: set_flag, key: yanjing_terms, value: xijing}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 宋求地无厌}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 恢复故疆之志}
      hint: 君威 +1，金人轻宋（风闻）↑；金人未必肯与，日后山后之争由此而起
    - id: written
      label: 许燕京六州，务载誓书，字字分明
      ops:
        - {op: set_flag, key: yanjing_terms, value: six}
        - {op: set_flag, key: yanjing_written, value: true}
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 往返议定誓书}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋使持重}
      hint: 国库 −10，金人轻宋（风闻）↓；誓书分明，日后赎燕之价较少（见赎燕之议）

- id: t1_haishang_again
  turn: 1
  title: 海上之盟再议
  summary: 马扩随使自金还，具言女真兵马虽锐而号令严整、志在吞辽；金主待宋使颇礼，然左右诸将多轻南朝。盟议当定，请陛下圣裁。若不处置，下季枢密院照前议遣使。
  region: bianjing
  illustration: event.haishang
  conditions: {kind: flag, key: "memorial:t0_haishang", value: spy}
  proposal: ally
  keywords: [海上之盟, 联金, 夹攻]
  advisors:
    - {character: ma_kuo, stance: oppose, option: loose, line: 臣亲见女真兵马，人皆善骑射，号令如一。盟书可恃一时，不可恃久远；通好可也，夹攻则恐引狼入室。}
    - {character: tong_guan, stance: support, option: ally, line: 马扩年少多虑。契丹将亡，我不取燕，女真取之，悔之晚矣！}
    - {character: zhao_liangsi, stance: support, option: ally, line: 金主待臣等甚厚，盟约可成。}
  options:
    - id: ally
      label: 遣赵良嗣使金，约夹攻辽、宋取燕京
      memory: {character: zhao_liangsi, text: 宣和二年夏，奉命浮海使金，约夹攻辽}
      ops:
        - {op: set_flag, key: haishang_ally, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: -3, reason: 宋金夹攻之约}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 恢复故疆之议}
      hint: 辽祚 −3，君威 +1。此后须践夹攻之约（宣和四年伐燕），违期、伐燕不克都会使金人轻宋
    - id: loose
      label: 通好而不约夹攻之期
      ops:
        - {op: set_flag, key: haishang_loose, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: -1, reason: 宋金通好}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋首鼠两端}
      hint: 辽祚 −1，金人轻宋（风闻）↑。不必出兵伐燕
    - id: refuse
      label: 守澶渊旧好，谢绝金使
      ops:
        - {op: set_flag, key: haishang_refused, value: true}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 宋守旧好}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人视宋为辽之与国}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 童、王之议不行}
      hint: 辽祚 +2，佞幸 −2，金人轻宋（风闻）↑。燕京不能由盟约取得

- id: t1_liao_envoy
  turn: 1
  expires_after: 1
  title: 辽使来聘
  summary: 辽主遣使来聘，言女真犯顺、上京告急，请念澶渊百年之好，许以粮帛相助。
  region: bianjing
  illustration: event.liao_envoy
  conditions: {kind: flag, key: haishang_refused, value: true}
  proposal: grain
  keywords: [辽使, 联辽, 存辽, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: grain, requires: {region: xibian}, line: （自泾原驰表）辽在，则女真西顾；辽亡，则我当其冲。助之可也。}
    - {character: tong_guan, stance: oppose, option: gifts, line: 契丹自取灭亡，何必以中国之粟养将死之虏？}
    - {character: cai_jing, stance: neutral, option: gifts, line: 厚赐其使，以全邻好，不必卷入其兵事。}
  options:
    - id: grain
      label: 输粮十万石助辽，结唇齿之好
      ops:
        - {op: set_flag, key: lian_liao, value: true}
        - {op: adjust_resource, resource: grain, delta: -100, reason: 输粮助辽}
        - {op: adjust_resource, resource: liao_zuo, delta: 6, reason: 宋粮助辽}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −100，辽祚 +6，金人轻宋（风闻）↑；自此为联辽之局（燕京不由盟约而得）
    - id: gifts
      label: 厚赐其使，婉辞兵粮之请
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 厚赐辽使}
        - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 邻好不绝}
      hint: 国库 −20，辽祚 +1
    - id: decline
      label: 以礼遣还
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和二年夏，辽使求援，朝廷以礼遣还}
      hint: 无增减

- id: t1_zhexi
  turn: 1
  expires_after: 1
  title: 两浙水旱
  summary: 两浙转运司奏：睦、歙山间水旱相仍，民多流移，州县催科如故，乡里汹汹。
  region: liangzhe
  illustration: event.famine
  conditions: {kind: region_controller, region: liangzhe, faction: song}
  proposal: relief
  keywords: [两浙, 东南, 赈济]
  advisors:
    - {character: chen_dong, stance: support, option: remit, line: 东南者，国家之仓廪也。今民困如此，宜蠲其赋，以收人心。}
    - {character: wang_fu, stance: oppose, option: strict, requires: {office: [shaozai, taizai]}, line: 东南财赋所出，一蠲则诸路援例。严督州县，自然无事。}
    - {character: cai_jing, stance: support, option: relief, line: 开常平仓赈之，钱粮不费而民心可安。}
  options:
    - id: remit
      label: 蠲两浙本年租赋之半
      ops:
        - {op: adjust_resource, resource: treasury, delta: -45, reason: 蠲两浙租赋}
        - {op: adjust_resource, resource: dongnan, delta: -6, reason: 蠲赋}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 蠲赋}
      hint: 国库 −45，东南民怨 −6，民心 +1
    - id: relief
      label: 开常平仓赈济
      ops:
        - {op: adjust_resource, resource: grain, delta: -60, reason: 常平仓赈两浙}
        - {op: adjust_resource, resource: dongnan, delta: -3, reason: 赈济}
      hint: 粮储 −60，东南民怨 −3
    - id: strict
      label: 严督州县，催科如故
      ops:
        - {op: adjust_region, region: liangzhe, stat: order, delta: 4}
        - {op: adjust_resource, resource: dongnan, delta: 3, reason: 催科如故}
        - {op: adjust_resource, resource: treasury, delta: 20, reason: 两浙催科}
      hint: 两浙治安 +4，国库 +20，东南民怨 +3

- id: t1_xibian
  turn: 1
  title: 西边堡寨
  summary: 泾原、秦凤诸路奏：宋夏议和以来边境稍安，然堡寨多圮、弓箭手阙额。或请修治，或请抽西军一部东屯关中，以备他用。
  region: xibian
  illustration: event.military_drill
  proposal: repair
  keywords: [西军, 堡寨, 武备]
  advisors:
    - {character: zhong_shidao, stance: support, option: repair, requires: {region: xibian}, line: （自泾原驰表）堡寨者，西边之根本。夏人未可全信，宜先修治。}
    - {character: tong_guan, stance: oppose, option: east, line: 夏人已和，西边无事。抽一军东屯关中，进可北伐，退可勤王。}
    - {character: zhong_shizhong, stance: neutral, option: east, requires: {region: xibian}, line: （自秦州驰表）末将奉命而行，移屯关中亦可。只是秦凤一空，夏人或来窥伺。}
  options:
    - id: repair
      label: 拨款修治泾原堡寨、补弓箭手
      ops:
        - op: start_project
          name: 修治西边堡寨
          region: xibian
          cost_per_turn: {treasury: 30}
          turns: 2
          on_complete:
            - {op: adjust_region, region: xibian, stat: defense, delta: 5}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 西边堡寨修治}
      hint: 国库每季 −30 共两季；成后西北边防务 +5、武备 +2
    - id: east
      label: 秦凤熙河军整军东屯关中
      ops:
        - {op: march, army: xijun_qinfeng, to_region: guanzhong, with_commander: true}
        - {op: adjust_region, region: xibian, stat: defense, delta: -5}
      hint: 秦凤熙河军五万（种师中随军）移屯关中，距汴京、河东皆近一程；西北边防务 −5，夏人或来窥伺
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和二年夏，西边堡寨之议未行}
      hint: 无增减

# ============================== T2 宣和二年秋 ==============================
- id: t2_zaixiang
  turn: 2
  title: 太宰人选
  summary: 蔡京既致仕，太宰余深亦以老病求去。中书拟以少宰王黼进太宰，总中书门下之事。若不处置，下季依中书所拟施行。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: flag, key: cai_retired, value: true}
      - {kind: office_holder, office: taizai, character: yu_shen}
      - {kind: office_holder, office: shaozai, character: wang_fu}
      - {kind: office_holder, office: yushi, character: li_gang}
      - {kind: character_region, character: li_gang, region: bianjing}
      - {not: {kind: flag, key: "memorial:t2_zaixiang_noli", operator: exists}}
  proposal: wang
  keywords: [太宰, 宰相, 王黼]
  advisors:
    - {character: liang_shicheng, stance: support, option: wang, line: 王少宰才思敏捷，官家用他最是顺手。}
    - {character: yu_shen, stance: neutral, option: keep_yu, line: 臣老病，本不敢恋栈；然陛下若欲少待，臣亦勉力。}
    - {character: li_gang, stance: oppose, option: check, requires: {region: bianjing}, line: 王黼骤贵，专以聚敛逢迎，若再进太宰，则中外大权尽归一人。宜别择老成以制之。}
  options:
    - id: wang
      label: 以王黼进太宰
      memory: {character: wang_fu, text: 宣和二年秋，陛下以臣进太宰}
      ops:
        - {op: dismiss, character: yu_shen, office: taizai}
        - {op: set_character_status, character: yu_shen, status: retired, cause: 罢太宰}
        - {op: dismiss, character: wang_fu, office: shaozai}
        - {op: appoint, character: wang_fu, office: taizai}
        - {op: adjust_resource, resource: ningxing, delta: 3, reason: 王黼秉政}
        - {op: adjust_resource, resource: dongnan, delta: 2, reason: 应奉之求愈急}
      hint: 王黼总中书门下；佞幸 +3，东南民怨 +2
    - id: keep_yu
      label: 留余深为太宰，王黼仍少宰
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 王黼未得专政}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -1}
      hint: 佞幸 −1；王黼不得专政，怏怏
    - id: check
      label: 王黼进太宰，以李纲为尚书右丞以制之
      memory: {character: li_gang, text: 宣和二年秋，陛下以臣为尚书右丞}
      ops:
        - {op: dismiss, character: yu_shen, office: taizai}
        - {op: set_character_status, character: yu_shen, status: retired, cause: 罢太宰}
        - {op: dismiss, character: wang_fu, office: shaozai}
        - {op: appoint, character: wang_fu, office: taizai}
        - {op: appoint, character: li_gang, office: youcheng}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 王黼秉政而有所制}
      hint: 王黼进太宰，李纲兼尚书右丞（执政）；佞幸 +1（若无李纲则 +3）

