      hint: 方腊军 −20000，东南民怨 −3
    - id: reinforce
      label: 增发禁旅一万五千赴东南
      ops:
        - {op: adjust_army, army: jinjun, delta: -15000, reason: 抽禁旅一万五千赴东南}
