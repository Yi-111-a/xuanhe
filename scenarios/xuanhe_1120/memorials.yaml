      hint: 无增减；来年若不能出兵，即为违期（金人轻宋 ↑）

- id: t2_yunwang
  turn: 2
  title: 郓王与东宫
  summary: 郓王楷以提举皇城司出入禁中无时，王黼等交口称其贤。宫中渐有储位之议，东宫僚属不安。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: office_holder, office: huangcheng, character: zhao_kai}
      - {kind: office_holder, office: crown_prince, character: zhao_huan}
  proposal: favor
  keywords: [东宫, 郓王, 储位, 太子]
  advisors:
    - {character: wang_fu, stance: support, option: favor, requires: {office: [shaozai, taizai]}, line: 郓王才学冠绝，陛下宠之，天下之人亦以为宜。}
    - {character: liang_shicheng, stance: neutral, option: keep, line: 官家家事，奴婢不敢多嘴；只是东宫向来谨慎，也无甚过失。}
    - {character: zhao_huan, stance: oppose, option: curb, line: 儿臣不敢有怨。只是……皇城司本掌禁卫，诸王领之，恐外人议论。}
  options:
    - id: curb
      label: 罢郓王提举皇城司，以安东宫
      memory: {character: zhao_kai, text: 宣和二年秋，父皇罢我提举皇城司}
      ops:
        - {op: dismiss, character: zhao_kai, office: huangcheng}
        - {op: set_flag, key: donggong_secure, value: true}
        - {op: adjust_trait, character: zhao_kai, trait: favor, delta: -2}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 储位之议息}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 定储位}
      hint: 东宫安；佞幸 −2，君威 +1；郓王失宠
    - id: keep
      label: 一仍其旧
      ops:
        - {op: remember, character: zhao_huan, fact: 宣和二年秋，储位之议未决}
      hint: 无增减；储位之议或再起
    - id: favor
      label: 加恩郓王，赐第宅、增俸
      memory: {character: zhao_kai, text: 宣和二年秋，父皇加恩于我}
      ops:
        - {op: set_flag, key: yunwang_favored, value: true}
        - {op: adjust_trait, character: zhao_kai, trait: favor, delta: 1}
        - {op: adjust_trait, character: zhao_huan, trait: fear, delta: 1}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 赐郓王第宅}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 王黼等附郓王}
      hint: 国库 −20，佞幸 +2；东宫益惧，储位之议日盛

- id: t2_tangluo
  turn: 2
  expires_after: 1
  title: 河北边备
  summary: 河北都转运司奏：澶渊以来百年无事，塘泺淤浅、城池颓圮，诸州守具多朽。请择要修治。
  region: hebei_dong
  illustration: event.tangluo
  proposal: tangluo
  keywords: [河北, 塘泺, 城防, 武备]
  advisors:
    - {character: zhang_xiaochun, stance: support, option: cities, requires: {region: hedong}, line: （自太原驰奏）河北、河东唇齿也。修城不如修人，修人不如修城——二者皆急。}
    - {character: tong_guan, stance: oppose, option: none, line: 燕京旦夕可下，边界将推至长城，河北塘泺何用之有？}
    - {character: ma_kuo, stance: support, option: tangluo, line: 塘泺者，所以限戎马也。辽人不能越，女真亦不能越。}
  options:
    - id: tangluo
      label: 疏浚河北塘泺（三季）
      ops:
        - op: start_project
          name: 疏浚河北塘泺
          region: hebei_dong
          cost_per_turn: {treasury: 40}
          turns: 3
