# ============================== T18 宣和六年秋 ==============================
# 王黼罢、蔡京复出：三支按「李纲是否在京」「张叔夜是否在京东」分开（选项里的任命须合法）。共同前提：王黼正任宰相，
# 少宰空缺或即王黼本人（罢王黼后少宰必空，可任李邦彦），蔡京致仕在家（太师之位空缺）。其余局势不出此条，由事件照例处置。
- id: t18_zaixiang
  turn: 18
  title: 宰执更替
  summary: >-
    王黼专政日久，与梁师成相表里，揽权聚敛，中外侧目；言者交章论之，王黼亦自请罢政。中书拟：罢王黼，起蔡京领三省事，
    以李邦彦为少宰。蔡京年近八十，目昏不能视事。若不处置，下季依中书所拟施行。
  region: bianjing
  illustration: event.cai_retire
  conditions:
    all:
      - {kind: flag, key: wangfu_dismissed, operator: absent}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
      - any:
          - {kind: office_holder, office: shaozai, character: null}
          - {kind: office_holder, office: shaozai, character: wang_fu}
      - {kind: office_holder, office: taishi, character: null}
      - {kind: character_status, character: cai_jing, value: retired}
      - {kind: character_status, character: li_bangyan, value: alive}
      - {kind: character_status, character: li_gang, value: alive}
      - {kind: character_region, character: li_gang, region: bianjing}
      - {not: {kind: flag, key: "memorial:t18_zaixiang_zhang", operator: exists}}
      - {not: {kind: flag, key: "memorial:t18_zaixiang_plain", operator: exists}}
  proposal: cai
  keywords: [宰相, 王黼, 蔡京, 李邦彦]
  advisors:
    - {character: liang_shicheng, stance: support, option: cai, requires: {office: yubi}, line: 官家，公相是老成人，请他出来坐镇，外廷便都服帖了。}
    - {character: cai_you, stance: support, option: cai, line: 家父虽老，精神尚好；朝中琐事，臣可替家父分劳。}
    - {character: li_gang, stance: oppose, option: ligang, requires: {region: bianjing}, line: 臣有三事不敢不言：王黼当罢，此其一；蔡京老耄，不可复用，此其二；宰执当择刚正晓兵之人，以备北边，此其三。}
    - {character: chen_dong, stance: oppose, option: dismiss, requires: {region: bianjing}, line: 去一王黼而来一蔡京，是去狼而进虎也！}
  options:
    - id: ligang
      label: 罢王黼，擢李纲为少宰，不起蔡京
      memory: {character: li_gang, text: 宣和六年秋，陛下罢王黼，以臣为少宰}
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: retired, cause: 罢相致仕}
        - {op: appoint, character: li_gang, office: shaozai}
        - {op: adjust_resource, resource: ningxing, delta: -6, reason: 罢王黼、用李纲}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 进用正人}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 宰执主修武备}
        - {op: adjust_trait, character: liang_shicheng, trait: loyalty, delta: -1}
      hint: 王黼致仕，李纲兼少宰；佞幸 −6，君威 +2，武备 +1；梁师成辈不悦
    - id: cai
      label: 依中书所拟：罢王黼，起蔡京领三省事，李邦彦为少宰
      memory: {character: cai_jing, text: 宣和六年秋，老臣复起领三省事}
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: retired, cause: 罢相致仕}
        - {op: set_flag, key: cai_returned, value: true}
        - {op: set_character_status, character: cai_jing, status: alive, cause: 复起领三省事}
        - {op: appoint, character: cai_jing, office: taishi}
        - {op: appoint, character: li_bangyan, office: shaozai}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 王黼去而蔡京复来}
        - {op: adjust_resource, resource: corruption, delta: 2, reason: 蔡京昏耄，政出其家}
      hint: 王黼致仕；蔡京复领三省事，李邦彦为少宰；佞幸 −1，吏治积弊 +2
    - id: dismiss
      label: 罢王黼，不复起蔡京，以李邦彦为少宰
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: retired, cause: 罢相致仕}
        - {op: appoint, character: li_bangyan, office: shaozai}
        - {op: adjust_resource, resource: ningxing, delta: -4, reason: 罢王黼}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罢专政之相}
      hint: 王黼致仕，李邦彦为少宰；佞幸 −4，君威 +1；蔡京仍家居

