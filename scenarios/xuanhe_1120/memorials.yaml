        - {op: set_flag, key: lian_liao, value: true}
        - {op: set_flag, key: jiagong_late, value: true}
        - {op: adjust_resource, resource: grain, delta: -100, reason: 输粮助燕京}
        - {op: adjust_resource, resource: liao_zuo, delta: 12, reason: 宋背金而助辽}
        - {op: adjust_resource, resource: jin_contempt, delta: 6, reason: 宋背夹攻之约而助辽}
        - {op: adjust_resource, resource: nanmu, delta: 2, reason: 金人怒宋背盟}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 童、王之议不行}
      hint: 粮储 −100，辽祚 +12，佞幸 −2；金人轻宋（风闻）↑↑、胡马南牧（风闻）↑（背盟）。辽祚若再衰（低于三十），燕京终不能守
    - id: march
      label: 以童贯督师，合兵七万出师伐燕
      memory: {character: tong_guan, text: 宣和四年春，奉命督师伐燕}
      ops:
        - {op: set_flag, key: beifa_started, value: true}
        - {op: set_flag, key: "memorial:t8_beifa", value: march}
        - {op: adjust_army, army: xijun_jingyuan, delta: -25000, reason: 抽泾原兵二万五千伐燕}
        - {op: adjust_army, army: xijun_qinfeng, delta: -20000, reason: 抽秦凤兵二万伐燕}
        - {op: adjust_army, army: hebei_army, delta: -25000, reason: 抽河北禁军二万五千伐燕}
        - {op: adjust_army, army: beifa_army, delta: 70000, reason: 伐燕诸军合七万}
        - {op: set_army_commander, army: beifa_army, character: tong_guan, dispatch: true}
