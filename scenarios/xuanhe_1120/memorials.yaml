      ops:
        - {op: remember, character: zhao_liangsi, fact: 宣和三年春，金使问期，含糊应之}
      hint: 无增减；金人或以违期责宋（金人轻宋 ↑）
    - id: frank
      label: 实告之，约以明年
      ops:
        - {op: set_flag, key: jiagong_excused, value: true}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 宋缓夹攻之期}
      hint: 金人轻宋（风闻）略↑；不计「违期」
    - id: gifts
      label: 厚赂金使，告以东南之变
      ops:
        - {op: set_flag, key: jiagong_excused, value: true}
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 厚赂金使}
      hint: 国库 −50；金人不以违期责宋

- id: t4_liao_plea
  turn: 4
  expires_after: 1
  title: 辽使乞援
  summary: 辽主遣使间道而来，言女真势盛、中京危急，乞宋以粮帛相助，愿复澶渊之好。
  region: bianjing
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: haishang_ally, operator: absent}
      - {kind: flag, key: zhongjing_fallen, operator: absent}
  proposal: aid
  keywords: [辽使, 联辽, 存辽, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: aid, requires: {region: xibian}, line: （驰表）唇亡齿寒，古有明训。}
    - {character: wang_fu, stance: oppose, option: decline, requires: {office: [shaozai, taizai]}, line: 契丹将亡之国，助之徒费钱粮，又结怨于女真。}
    - {character: li_gang, stance: support, option: aid, requires: {region: bianjing}, line: 存辽以为屏蔽，上策也；纵不能存，亦可缓女真之南向。}
  options:
    - id: decline
      label: 婉辞之
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和三年春，辽使乞援，朝廷婉辞}
      hint: 无增减
    - id: token
      label: 赐帛以示存问，不助兵粮
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 赐辽使帛}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 邻好不绝}
      hint: 国库 −20，辽祚 +2
    - id: aid
      label: 输粮帛助辽，结唇齿之好
      ops:
        - {op: set_flag, key: lian_liao, value: true}
        - {op: adjust_resource, resource: grain, delta: -120, reason: 输粮助辽}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 输帛助辽}
        - {op: adjust_resource, resource: liao_zuo, delta: 8, reason: 宋助辽粮帛}
        - {op: set_flag, key: liao_aided, value: true}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −120，国库 −60，辽祚 +8，金人轻宋（风闻）↑；联辽之局

# ============================== T5 宣和三年夏 ==============================
- id: t5_yingfeng
  turn: 5
  title: 复置应奉之议
  summary: 王黼、梁师成奏：花石虽罢，禁中供奉不可阙，请复置应奉司，命臣等领之。若不处置，下季依奏复置。
  region: bianjing
  illustration: event.huashi
  conditions:
    all:
      - {kind: flag, key: huashi_abolished, value: true}
      - {kind: flag, key: yingfeng_restored, operator: absent}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  proposal: restore
  keywords: [应奉, 花石, 王黼]
  advisors:
    - {character: wang_fu, stance: support, option: restore, line: 禁中所需，岂可一日或缺？臣领应奉，必不扰民。}
    - {character: liang_shicheng, stance: support, option: restore, line: 官家园中花木，没人照管，奴婢看着心疼。}
    - {character: chen_dong, stance: oppose, option: refuse, line: 罢之未久而复之，是示天下以无信也！东南之血未干！}
  options:
    - id: refuse
      label: 不准
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 应奉不复}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 守罢花石之信}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -1}
      hint: 佞幸 −2，君威 +1；王黼不悦
    - id: restore
      label: 准复置应奉司
      ops:
        - {op: set_flag, key: yingfeng_restored, value: true}
        - {op: add_ledger, id: yingfeng_si, name: 应奉司, category: treasury, amount: -15, kind: recurring, reason: 复置应奉司（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: dongnan, delta: 5, reason: 应奉复起}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 王、梁领应奉}
      hint: 每季支应奉司 15 万缗；东南民怨 +5，佞幸 +2
    - id: limited
      label: 准置而限其额，禁扰民间
      ops:
        - {op: set_flag, key: yingfeng_restored, value: true}
        - {op: add_ledger, id: yingfeng_si, name: 应奉司（限额）, category: treasury, amount: -7, kind: recurring, reason: 限额应奉（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: dongnan, delta: 2, reason: 应奉限额}
      hint: 每季支应奉司 7 万缗；东南民怨 +2

- id: t5_shanhou
  title: 两浙善后
  summary: 方腊既平，两浙兵火之余，室庐多毁，流亡未复。转运司请处置善后。
  region: liangzhe
  illustration: event.famine
  conditions:
    all:
      - {kind: flag, key: fangla_quelled, value: true}
      - {kind: flag_age, key: fangla_quelled, operator: lte, value: 2}
  proposal: remit
  keywords: [两浙, 东南, 善后]
  advisors:
    - {character: chen_dong, stance: support, option: remit, line: 乱之所生，在于困穷。蠲其租赋，则乱不复生。}
    - {character: wang_fu, stance: oppose, option: settle, requires: {office: [shaozai, taizai]}, line: 东南财赋所出，岂可久蠲？招集流亡，复其旧业即可。}
    - {character: li_gang, stance: support, option: punish, requires: {region: bianjing}, line: 东南之祸，起于朱勔。不罪朱勔，无以谢东南。}
  options:
    - id: remit
      label: 蠲两浙被兵州县三年租赋
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 蠲两浙租赋}
        - {op: adjust_resource, resource: dongnan, delta: -8, reason: 蠲赋善后}
        - {op: adjust_region, region: liangzhe, stat: prosperity, delta: 5}
      hint: 国库 −80，东南民怨 −8，两浙繁荣 +5
    - id: settle
      label: 遣使招集流亡，给牛种
      ops:
        - {op: adjust_resource, resource: grain, delta: -60, reason: 招集流亡给牛种}
        - {op: adjust_resource, resource: dongnan, delta: -4, reason: 安集流亡}
        - {op: adjust_region, region: liangzhe, stat: order, delta: 8}
      hint: 粮储 −60，东南民怨 −4，两浙治安 +8
    - id: punish
      label: 削朱勔官爵，流之远方，以谢东南
      memory: {character: zhu_mian, text: 宣和三年，以东南之乱获罪，削官流放}
      ops:
        - {op: set_flag, key: zhumian_dismissed, value: true}
        - {op: set_character_status, character: zhu_mian, status: exiled, cause: 削官流放}
        - {op: adjust_resource, resource: dongnan, delta: -6, reason: 罪朱勔以谢东南}
        - {op: adjust_resource, resource: ningxing, delta: -4, reason: 朱勔获罪}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罪魁伏法}
      hint: 朱勔流放；东南民怨 −6，佞幸 −4，君威 +1

- id: t5_dongnan_calm
  turn: 5
  title: 东南安堵
  summary: 两浙转运司奏：本年花石之役稍息，州县安堵，漕运如常。请定东南赋役之制。
  region: liangzhe
  illustration: event.qingming
  conditions:
    all:
      - {kind: flag, key: fangla_risen, operator: absent}
      - {kind: resource, id: dongnan, operator: lt, value: 66}
  proposal: canal
  keywords: [东南, 漕运, 两浙]
  advisors:
    - {character: cai_jing, stance: support, option: canal, line: 东南安则漕运足，漕运足则京师足。疏浚运河，正当其时。}
    - {character: chen_dong, stance: neutral, option: light, line: 民力方苏，宜轻徭薄赋以养之。}
  options:
    - id: canal
      label: 疏浚江南运河（两季）
      ops:
        - op: start_project
          name: 疏浚江南运河
          region: liangzhe
          cost_per_turn: {treasury: 30}
          turns: 2
          on_complete:
            - {op: adjust_region, region: liangzhe, stat: prosperity, delta: 4}
            - {op: adjust_region, region: liangzhe, stat: tax, delta: 2}
      hint: 国库每季 −30 共两季；成后两浙繁荣 +4、税基 +2
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: 宣和三年夏，东南赋役之议未行}
      hint: 无增减
    - id: light
      label: 轻东南和籴之额
      ops:
        - {op: adjust_resource, resource: dongnan, delta: -4, reason: 轻和籴}
        - {op: adjust_resource, resource: grain, delta: -40, reason: 和籴减额}
      hint: 东南民怨 −4，粮储 −40

- id: t5_nanzheng
  title: 南讨诸军
  summary: 方腊既平，南讨诸军尚屯东南。枢密院请定其去留：或归建西边，或移屯河北以备伐燕。若不处置，下季依例归建。
  region: bianjing
  illustration: event.nanzheng
  conditions:
    all:
      - {kind: flag, key: fangla_quelled, value: true}
      - {kind: army_strength, army: nanzheng, operator: gt, value: 0}
  proposal: hebei
  keywords: [西军, 伐燕, 河北]
  advisors:
    - {character: tong_guan, stance: support, option: hebei, line: 西兵既已东来，就移屯河北，来年伐燕，省得往返。}
    - {character: zhong_shidao, stance: oppose, option: home, requires: {region: xibian}, line: （驰表）西兵久戍，思归甚切；且夏人在侧，西边不可久虚。}
    - {character: li_gang, stance: neutral, option: capital, requires: {region: bianjing}, line: 屯之京畿左右，北可援河北，南可镇东南，进退皆便。}
  options:
    - id: home
      label: 归建西边
      ops:
        - {op: merge_army, army: nanzheng, into: xijun_qinfeng, reason: 南讨诸军归建}
      hint: 南讨诸军并入秦凤熙河军（归建），西边防务复旧
    - id: capital
      label: 移屯汴京，以为京师之备
      ops:
        - {op: march, army: nanzheng, to_region: bianjing, with_commander: true}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 京师有精兵}
      hint: 南讨诸军移屯汴京（行程见回执）；武备 +2
    - id: hebei
      label: 移屯河北东路，以备伐燕
      ops:
        - {op: march, army: nanzheng, to_region: hebei_dong, with_commander: true}
      hint: 南讨诸军移屯河北东路（行程见回执）；伐燕时可径用此军

# 甲批奏疏草稿（T6–T15，宣和三年秋 → 宣和五年冬），追加到 scenarios/xuanhe_1120/memorials.yaml 末尾即可。
# 依 docs/MEMORIAL_BRIEF.md 第三节「甲批」写；只新增条目，不改 T0–T5 与 events.yaml。
# 机制备注：
# - t8_beifa 有两个变体（_nanzheng：南讨诸军已屯河北东路，并入伐燕诸军；_zhong：河北河东宣抚使已为种师道）。
#   变体的每个选项另写 memorial:t8_beifa，使 beifa_default 不再施行、t9_zhong_jinbing 能读到批答。
# - t12_shuyan_written 同理另写 memorial:t12_shuyan。
# - 「种师道专制」不即出师：诸军先坚守，主帅到军后 t9_zhong_jinbing 定进止（到军整训，素质 +0.1）；
#   主帅迟迟不到（远在西边），则 t9_beifa_jiutun 让玩家以副将先进、催促或罢兵。

# ============================== 甲批：T6–T15（宣和三年秋 → 宣和五年冬） ==============================
# 约定同上。T8「伐燕之议」、T12「赎燕之议」的变体在选项里另写 memorial:<主条 id>，使 events.yaml 的 *_default
# （只读主条旗标）在变体批答之后同样不再施行；后续奏疏（种师道请期）也只读主条旗标。

# ============================== T6 宣和三年秋 ==============================
- id: t6_caiji
  turn: 6
  title: 户部告乏
  summary: 户部奏：今岁军兴之费、禁中供奉与岁币并集，左藏所余无几；明年又有河北之备，岁计恐不能支。请或增杂税，或裁冗费。
  region: bianjing
  illustration: event.court_debate
  proposal: tax
  keywords: [岁计, 财赋, 冗费]
  advisors:
    - {character: cai_jing, stance: support, option: tax, line: 老臣以为，头子钱、卖糟钱之类，积少成多，民不甚觉而国用可足。理财之道，在因势利导。}
    - {character: li_gang, stance: oppose, option: thrift, requires: {region: bianjing}, line: 臣以为，国用之匮，不在入少而在出多。诸司额外支赐、无名之费，罢之可也；再取于民，民何以堪？}
    - {character: li_bangyan, stance: neutral, option: keep, line: 钱这东西，省也省不出多少，加也加不了几文。依臣看，照旧过日子罢。}
  options:
    - id: thrift
      label: 罢诸司额外支赐与无名之费
      ops:
        - {op: adjust_resource, resource: treasury, delta: 40, reason: 罢额外支赐}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 近幸恩赏见裁}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 节用}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 近臣怨望}
      hint: 国库 +40，佞幸 −2，吏治积弊 −1，君威 −1（近臣怨望）
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: 宣和三年秋，户部告乏，朝廷未有处置}
      hint: 无增减
    - id: tax
      label: 于诸路增收头子钱、卖糟钱等杂钱
      ops:
        - {op: adjust_resource, resource: treasury, delta: 100, reason: 增收诸路杂钱}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 州县缘此为奸}
        - {op: adjust_resource, resource: dongnan, delta: 1, reason: 东南亦增杂钱}
        - {op: adjust_region, region: jingdong, stat: order, delta: -2}
      hint: 国库 +100；吏治积弊 +1，东南民怨 +1，京东治安 −2（杂敛日繁）

- id: t6_hebei_shuai
  turn: 6
  expires_after: 1
  title: 宣抚河北
  summary: >-
    河北河东宣抚使出缺已久，河北西路禁军无帅，教阅废弛，诸州守臣各自为政。枢密院请择重臣宣抚河北，以统诸军；
    或言西军宿将种师道久历战阵，宜召之东来。
  region: hebei_xi
  illustration: event.military_drill
  conditions:
    all:
      - {kind: office_holder, office: hebei_xuanfu, character: null}
      - {kind: army_commander, army: hebei_army, character: null}
      - {kind: character_status, character: zhong_shidao, value: alive}
      - {kind: character_status, character: tong_guan, value: alive}
      - {not: {kind: character_region, character: zhong_shidao, region: bianjing}}
  proposal: tong
  keywords: [河北, 武备, 西军, 宣抚]
  advisors:
    - {character: tong_guan, stance: support, option: tong, line: 官家，河北之事，老奴熟知。当年老奴在西边，诸将无不听令；如今宣抚河北，老奴一身任之便是。}
    - {character: wang_fu, stance: support, option: tong, requires: {office: [shaozai, taizai]}, line: 童枢密威望素著，以之宣抚，诸将自然慑服。此陛下知人善任。}
    - {character: ma_kuo, stance: oppose, option: zhong, line: 臣在北边所见，河北之兵不习战阵。非宿将不能整之；老种在西边二十年，士卒信服，宜以河北付之。}
    - {character: li_gang, stance: oppose, option: zhong, requires: {region: bianjing}, line: 宣抚一路，系天下安危。宦者不宜再总兵柄；种师道老成知兵，宜专任之。}
  options:
    - id: summon
      label: 召种师道入京面议边事，宣抚使暂缓
      memory: {character: zhong_shidao, text: 宣和三年秋，奉诏入京面议边事}
      ops:
        - {op: move_character, character: zhong_shidao, to_region: bianjing}
      hint: 种师道入京（行程见回执），泾原军副将暂摄；人在京师即可召对、廷议，日后出师自京赴河北较近
    - id: tong
      label: 以童贯兼河北河东宣抚使（以枢密遥领）
      memory: {character: tong_guan, text: 宣和三年秋，陛下以老奴兼河北河东宣抚使}
      ops:
        - {op: appoint, character: tong_guan, office: hebei_xuanfu, dispatch: false}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 童贯再兼宣抚}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 河北有帅}
      hint: 童贯兼统河北西路禁军（人仍在所在，副将暂摄）；佞幸 +2，武备 +1。日后伐燕，可径以宣抚使出师
    - id: zhong
      label: 以种师道为河北河东宣抚使，赴真定视事
      memory: {character: zhong_shidao, text: 宣和三年秋，陛下以老臣宣抚河北河东}
      ops:
        - {op: appoint, character: zhong_shidao, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 宿将宣抚河北}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 宦者不专兵柄}
        - {op: adjust_trait, character: tong_guan, trait: favor, delta: -1}
      hint: 种师道兼统河北西路禁军，自所在赴真定（行程见回执），泾原军仍由其遥领、副将暂摄；武备 +2，佞幸 −1；童贯不悦。日后伐燕，宣抚使可专制
    - id: keep
      label: 宣抚使暂缓，河北诸军仍由诸州分领
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和三年秋，河北择帅之议未行}
      hint: 无增减；河北西路禁军仍无统帅

- id: t6_xijun
  turn: 6
  expires_after: 1
  title: 抽调西兵
  summary: 枢密院议：河北兵弱，西军精锐尽在泾原、秦凤。请抽泾原兵一万东屯，以备调发。西边诸将则言夏人在侧，堡寨不可再虚。
  region: xibian
  illustration: event.military_drill
  conditions:
    all:
      - {kind: army_region, army: xijun_jingyuan, region: xibian}
