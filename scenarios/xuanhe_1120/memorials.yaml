  options:
    - id: tong
      label: 以童贯为宣抚使，统西军五万、禁旅一万南讨
      memory: {character: tong_guan, text: 宣和二年冬，奉命宣抚江淮荆浙，讨方腊}
      ops:
        - {op: set_flag, key: nanzheng_sent, value: true}
