- id: t_jin_again
  title: 金人再来
  summary: 金人以宋不交三镇为辞，再分两路南下，河北、河东告急之书一日数至。百官或请修城坚守，或请车驾南幸。
  region: bianjing
  illustration: event.jin_invasion
  conditions:
    all:
      - {kind: flag, key: jin_returned, value: true}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: flag, key: court_south, operator: absent}
      - {kind: character_region, character: zhao_ji, region: bianjing}
  proposal: fortify
  keywords: [背约, 守城, 南幸, 三镇]
  advisors:
    - {character: li_gang, stance: support, option: fortify, requires: {region: bianjing}, line: 金人之来，在臣意中。城下之约本不可恃，今日惟有修城坚守、再召勤王而已。}
    - {character: li_bangyan, stance: oppose, option: south, requires: {region: bianjing}, line: 上回是侥幸，这回可没那么好运了。陛下还是往东南去吧。}
    - {character: chen_dong, stance: support, option: defend, requires: {region: bianjing}, line: 学生斗胆！陛下当亲登城楼，与都人共守，则人人效死！}
  options:
    - id: defend
      label: 亲登城楼，下诏与都人共守
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 天子登城}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 天子登城}
        - {op: adjust_army, army: jinjun, quality_delta: 0.05, reason: 天子登城，士气稍振}
      hint: 君威 +2，民心 +3，京师禁军素质 +0.05
    - id: fortify
      label: 修汴京城守（两季）
      ops:
        - op: start_project
          name: 再修汴京城守
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 2
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 15}
      hint: 国库每季 −50 共两季；成后汴京防务 +15
    - id: south
