- id: t_chendong_wangfu
  title: 陈东论王黼
  summary: 太学生陈东率诸生伏阙上书，论宰相王黼：聚敛以固宠，结内侍以专政，除授多出私门。请窜之远方，以谢天下。
  region: bianjing
  illustration: event.chen_dong
  conditions:
    all:
      - {kind: turn, operator: gte, value: 20}
      - {kind: character_status, character: chen_dong, value: alive}
      - {kind: character_region, character: chen_dong, region: bianjing}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  proposal: punish
  keywords: [陈东, 六贼, 王黼, 太学]
  advisors:
    - {character: chen_dong, stance: support, option: punish, line: 学生斗胆！今日之患，不在外而在内：王黼聚敛蔽聪明，此天下所共知也！}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [taizai, shaozai]}, line: 诸生不知国用之艰，徒以浮言惑众。臣所为者，无非为陛下恢复故疆筹措钱粮。}
    - {character: li_gang, stance: neutral, option: dismiss, requires: {region: bianjing}, line: 王黼当罢，然窜逐太过，恐启朋党之争。罢其政，令其归第可也。}
  options:
    - id: dismiss
      label: 罢王黼政事，令归第
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: retired, cause: 为太学生所论，罢相归第}
        - {op: adjust_resource, resource: ningxing, delta: -5, reason: 罢王黼}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 从谏}
      hint: 王黼罢归，宰相之位空出；佞幸 −5，君威 +1
    - id: keep
      label: 书入不报
      ops:
        - {op: adjust_resource, resource: authority, delta: -1, reason: 拒谏}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 太学之议沸腾}
      hint: 君威 −1，民心 −1
    - id: punish
      label: 罢王黼，窜之远方
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: exiled, cause: 为太学生所论，窜逐远方}
        - {op: adjust_resource, resource: ningxing, delta: -7, reason: 窜王黼}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 从谏去奸}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 都人称快}
      hint: 王黼窜逐，宰相之位空出；佞幸 −7，君威 +2，民心 +1

