  proposal: dredge
  keywords: [漕运, 汴河, 东南, 纲运]
  advisors:
    - {character: cai_jing, stance: support, option: dredge, line: 京师百万之众，仰食东南。汴河一日不通，京师一日不安。}
    - {character: chen_dong, stance: neutral, option: boats, requires: {region: bianjing}, line: 纲船之弊，在于押纲之吏侵渔，非独河浅也。}
  options:
