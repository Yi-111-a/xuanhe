  proposal: abolish
  keywords: [应奉, 花石, 李纲, 言路]
  advisors:
    - {character: li_gang, stance: support, option: abolish, requires: {region: bianjing}, line: 陛下，臣有三事不敢不言：前诏罢花石，天下称圣明，此其一；今复应奉，东南复骚然，此其二；失信于民，盗贼必复起，此其三。}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [shaozai, taizai]}, line: 应奉司所取，不过禁中日用，与花石何干？李中丞危言耸听罢了。}
    - {character: liang_shicheng, stance: oppose, option: limit, line: 官家，园中花木总得有人照管。罢是罢不得的，少取些，外头也就不说了。}
  options:
