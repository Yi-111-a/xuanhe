      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 蠲被兵州县租赋}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 蠲赋}
        - {op: adjust_region, region: hebei_xi, stat: prosperity, delta: 4}
        - {op: adjust_region, region: jingxi, stat: prosperity, delta: 3}
      hint: 国库 −60；民心 +3，河北西路繁荣 +4、京西繁荣 +3
    - id: keep
