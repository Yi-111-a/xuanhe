- id: s_caoyun
  title: 汴河漕运
  summary: 发运司奏：汴河淤浅，纲船阻滞，东南上供之米到京迟误；纲兵、篙工逃亡者众。请疏浚汴河，或增发纲船。
  region: huainan
  illustration: event.qingming
  conditions:
