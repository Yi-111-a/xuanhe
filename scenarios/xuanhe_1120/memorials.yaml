        - {op: start_project, name: 河防勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_hefang", value: null}]}
      hint: 国库 −15，河北东路繁荣 +1；本条五季后再议
    - id: repair
