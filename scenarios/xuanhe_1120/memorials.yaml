# ============================== T3 宣和二年冬 ==============================
- id: t3_fangla
  title: 睦州告变
  summary: >-
    两浙驰奏：睦州青溪方腊起事，众至数万，连陷睦、歙，进逼杭州，东南漕运不通。若不处置，下季枢密院照例遣童贯统禁旅与陕西兵南讨。
    （方腊同据两浙、江南连续两季，东南即不可收拾。）
  region: liangzhe
  illustration: event.fangla_rising
  conditions:
