# ============================== 金兵南下之后（jin_invaded；宣和七年至宣和八年冬）==============================
# 旗标 neishan / court_south / ligang_defense / sanzhen_ceded / jin_withdrawn / sanzhen_delivered / jieying 为结局与事件所读，名字不可改。
# ---- 李纲血书：内禅 / 罪己坚守 / 南幸 ----
- id: t_xueshu
  title: 李纲血书
  summary: >-
    金兵两路南下，边报日至，举朝失色。李纲刺臂血上疏，言今日非常之变，当有非常之断：陛下若能下诏罪己、罢弊政、亲御六军，
    则人心可收；不然，惟有传位东宫，以系天下之望。而宰执中有请车驾南幸、暂避敌锋者。
  region: bianjing
  illustration: event.neishan
  conditions:
    all:
      - {kind: office_holder, office: crown_prince, character: zhao_huan}
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: neishan, operator: absent}
      - {kind: flag, key: court_south, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: character_region, character: zhao_ji, region: bianjing}
      - {kind: character_status, character: li_gang, value: alive}
      - {kind: character_region, character: li_gang, region: bianjing}
      - {not: {kind: flag, key: "memorial:t_xueshu_shicong", operator: exists}}
  proposal: defend
  keywords: [内禅, 罪己, 南幸, 李纲, 亲征]
  advisors:
    - {character: li_gang, stance: support, option: defend, requires: {region: bianjing}, line: 臣刺血上言：祖宗二百年基业，在此一举。陛下下诏罪己，亲御六军，则将士用命、四方勤王；若一去京师，则河北、河东皆不可守矣！}
    - {character: zhao_huan, stance: neutral, option: defend, requires: {office: crown_prince}, line: 此等大事，儿臣不敢专。只是……父皇若在城中，将士便有了主心骨。}
    - {character: liang_shicheng, stance: neutral, option: neishan, requires: {office: yubi}, line: 官家若是倦了，东宫仁孝，把这副担子交出去，也是一条路。奴婢不敢多嘴。}
    - {character: li_bangyan, stance: oppose, option: south, requires: {region: bianjing}, line: 金人来势太凶，陛下先往东南走一趟，避过锋头再说。留得青山在嘛。}
  options:
    - id: south
      label: 车驾南幸江南，暂避敌锋
      ops:
        - {op: set_flag, key: court_south, value: true}
        - {op: move_character, character: zhao_ji, to_region: jiangnan}
        - {op: adjust_resource, resource: authority, delta: -6, reason: 车驾南幸}
        - {op: adjust_resource, resource: morale, delta: -5, reason: 京师人心惶惑}
        - {op: adjust_region, region: bianjing, stat: order, delta: -10}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 主南幸者得志}
      hint: 车驾启程赴江南（行程见回执）；君威 −6，民心 −5，汴京治安 −10，佞幸 +2；此后汴京陷落，或至宣和八年冬河东、河北西路有失，即「衣冠南渡」
    - id: defend
      label: 下诏罪己，罢弊政，御驾坚守京师
      memory: {character: li_gang, text: 金兵南下，陛下纳臣血书，下诏罪己，坚守京师}
      ops:
        - {op: adjust_resource, resource: authority, delta: 4, reason: 下诏罪己，御驾坚守}
        - {op: adjust_resource, resource: morale, delta: 5, reason: 罪己诏下，都人感泣}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢弊政}
        - {op: adjust_army, army: jinjun, quality_delta: 0.05, reason: 天子在城，士气稍振}
      hint: 君威 +4，民心 +5，佞幸 −2，京师禁军素质 +0.05；车驾留京——汴京若陷即「靖康之耻」
    - id: neishan
      label: 下诏传位于皇太子，退居龙德宫
      ops:
        - {op: set_flag, key: neishan, value: true}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 新君即位，人心稍安}
      hint: 即终局「内禅东宫」：此后战和存亡由新君收拾；「社稷安固」目标即败

