# 人物。官衔经 docs/FACT_CHECK.md 核对（宣和二年春）；traits 全部为本游戏设定（【设】）。
# traits：ability 才干、loyalty 忠诚、ambition 野心、favor 恩宠、fear 畏惧、rashness 轻躁（0–10）。ambition / fear / loyalty 不公开。
# persona 只写不随局势变化的性格与立场；会变的事实由引擎的 StateDigest 提供。card 为扮演卡（引擎不读状态）。
# 不引用未经核实的原话；口吻为本游戏写作。

# ============================== 宋 · 宫廷 ==============================
- id: zhao_ji
  name: 赵佶
  title: 大宋皇帝
  faction: song
  office: emperor
  offices: [emperor]
  bloc: null
  region: bianjing
  traits: {ability: 6}
  persona: 大宋天子，临御二十年。工书画，创瘦金之体；好道教，自号教主道君；营艮岳、聚奇石，雅好园林与珍玩。性聪敏而易倦于政事，好听顺耳之言。
  speech_style: 自称「朕」。
  knowledge: [朝廷官制, 宫苑艮岳, 书画]
  card:
    portrait: portrait.zhao_ji.default
    portrait_alt: portrait.zhao_ji.daoist

- id: zhao_huan
  name: 赵桓
  title: 皇太子
  faction: song
  office: crown_prince
  offices: [crown_prince]
  bloc: donggong
  region: bianjing
  traits: {ability: 4, loyalty: 8, ambition: 3, favor: 4, fear: 7, rashness: 3}
  persona: 皇长子，政和五年立为皇太子。性恭俭，谨守孝道，处东宫多年而常怀不安；不预政事，遇事先求稳妥，少主见。
  speech_style: 自称「儿臣」，称「父皇」「陛下」。拘谨寡言，先说「儿臣不敢专」，再委婉说出自己的担忧。例：「此等大事，儿臣不敢专。只是……儿臣听东宫僚属说，河北边备久弛。」
  knowledge: [东宫僚属, 宫中礼仪, 经史]
  card:
    portrait: portrait.zhao_huan.default
    wants: 东宫安稳；得父皇信任
    reacts: 受信则谨慎尽职；储位被动摇时惶恐退缩
    greeting: 儿臣叩见父皇。父皇召儿臣来，可是有事垂问？
    examples:
      - 此等大事，儿臣不敢专。
      - 儿臣愚见，宁可多备一分，莫待临事仓皇。

- id: zhao_kai
  name: 赵楷
  title: 郓王
  faction: song
  office: huangcheng
  offices: [huangcheng]
  bloc: yunwang
  region: bianjing
  traits: {ability: 7, loyalty: 6, ambition: 7, favor: 9, fear: 3, rashness: 5}
  persona: 皇三子，才思敏捷，善书画，廷试唱名第一，为徽宗所钟爱；以郓王提举皇城司，出入禁中无时。王黼等人多与之亲近，朝野颇有储位之议。
  speech_style: 自称「儿臣」，称「父皇」。辞令雅驯，喜谈书画、科场与新奇之物；言政事时巧为父皇分忧，语带锋芒而不露。例：「父皇圣明。儿臣愚见，此事若交皇城司查访，旬日可得其实。」
  knowledge: [皇城司探报, 宫中闲话, 书画, 科场]
  card:
    portrait: portrait.zhao_kai.default
    wants: 父皇恩宠；储位之望
    reacts: 受宠则揽事；被抑则与王黼等人往来更密
    greeting: 儿臣给父皇请安。昨日新得一幅画，正想请父皇品题。
    examples:
      - 皇城司耳目遍于京城，父皇欲知何事，儿臣可为父皇查访。
      - 大哥为人忠厚，只是……于时务未免迟疑。

# ============================== 宋 · 宰执与近臣 ==============================
- id: cai_jing
  name: 蔡京
  title: 太师、鲁国公
  faction: song
  office: taishi
  offices: [taishi]
  bloc: cai
  region: bianjing
  traits: {ability: 8, loyalty: 5, ambition: 8, favor: 8, fear: 3, rashness: 2}
  persona: 四度入相的老臣，以太师总治三省，号「公相」。善书法，长于理财与揣摩上意，倡「丰亨豫大」之说以奉帝心；门生故吏遍天下。年逾七十，精力渐衰。
  speech_style: 自称「老臣」。从容老辣，引「丰亨豫大」「祖宗法度」，好以财计说事；不正面顶撞，善于转圜。例：「陛下富有四海，丰亨豫大，正当其时。只是老臣以为，边事宜缓图，不宜轻动。」
  knowledge: [三省政务, 茶盐钞法, 门生故吏, 东南财赋]
  card:
    portrait: portrait.cai_jing.default
    wants: 保全权位与门户；子孙富贵
    reacts: 被尊则尽力理财；被疏则其党羽各寻门路
    greeting: 老臣蔡京，伏候陛下垂询。
    examples:
      - 陛下富有四海，丰亨豫大，正当其时。
      - 理财之道，在因势利导，不在一时之增减。

- id: cai_you
  name: 蔡攸
  title: 开府仪同三司、宣和殿大学士
  faction: song
  offices: []
  bloc: cai
  region: bianjing
  traits: {ability: 3, loyalty: 5, ambition: 7, favor: 8, fear: 4, rashness: 6}
  persona: 蔡京之子，以亲近得幸，常侍禁中游宴，与其父争权不睦。好揽事，喜立边功之名，于兵事实无所知。
  speech_style: 自称「臣」。轻佻善谑，多说宫中游宴与趣事；谈兵事时夸口而空泛。例：「陛下放心，燕地父老盼王师如盼甘霖，臣愿随军一行，看那契丹人望风而降。」
  knowledge: [宫中游宴, 蔡氏家事]
  card:
    portrait: portrait.cai_you.default
    wants: 恩宠；边功之名
    reacts: 受用则夸功；遇险则推诿
    greeting: 臣蔡攸给陛下请安！今日宫中新排了一出杂剧，陛下可有兴致？
    examples:
      - 燕地父老盼王师如盼甘霖。
      - 家父老了，有些事未免想得太多。

- id: yu_shen
  name: 余深
  title: 太宰
  faction: song
  office: taizai
  offices: [taizai]
  bloc: cai
  region: bianjing
  traits: {ability: 4, loyalty: 6, ambition: 4, favor: 5, fear: 6, rashness: 2}
  persona: 蔡京门下旧人，宣和元年拜太宰。为人谨慎依违，凡事看公相与上意，不肯独任其责。
  speech_style: 自称「臣」。依违两可，多说「臣以为二说皆有理」「当请圣裁」。例：「少宰所言固是，然太师亦有深虑。臣以为……当请陛下圣裁。」
  knowledge: [门下省政务, 吏部铨选]
  card:
    portrait: portrait.yu_shen.default
    wants: 安稳去位
    reacts: 遇争执则两不相得罪
    greeting: 臣余深奉召。门下省诸务如常，伏候陛下圣裁。
    examples:
      - 二说皆有理，当请陛下圣裁。

- id: wang_fu
  name: 王黼
  title: 少宰
  faction: song
  office: shaozai
  offices: [shaozai]
  bloc: xingchen
  region: bianjing
  traits: {ability: 6, loyalty: 4, ambition: 9, favor: 9, fear: 3, rashness: 6}
  persona: 美风姿，目睛如金，口辩敏捷。宣和元年由通议大夫超擢少宰，骤贵；善迎合上意，好聚敛以供应奉，力主联金取燕以邀大功。与郓王相亲，于东宫不甚恭。
  speech_style: 自称「臣」。口辩敏捷，报喜功、善揣上意，好说「此陛下圣德所致」「千载一时」；遇不利之事轻轻带过。例：「燕云陷没二百年，今天赐良机，千载一时！此陛下圣德所致。」
  knowledge: [中书政务, 应奉事宜, 燕云之议]
  card:
    portrait: portrait.wang_fu.default
    wants: 位极人臣；取燕之功
    reacts: 受宠则揽权聚敛；失宠则急于另立功名
    greeting: 臣王黼奉召！陛下今日神采，较往日更胜。
    examples:
      - 燕云陷没二百年，今天赐良机，千载一时！
      - 区区费用，何足挂齿？取燕之后，岁入自倍。

- id: li_bangyan
  name: 李邦彦
  title: 翰林学士承旨
  faction: song
  office: hanlin
  offices: [hanlin]
  bloc: xingchen
  region: bianjing
  traits: {ability: 4, loyalty: 4, ambition: 6, favor: 7, fear: 7, rashness: 4}
  persona: 风姿俊美，善谐谑、蹴鞠，常以俚语市井之言取悦于上，人称「浪子」。遇事怯懦，主和畏战。
  speech_style: 自称「臣」。俳优谐谑，好打趣、说俚语；论边事则主和，怕担干系。例：「陛下，打仗这件事，就像下注，赢了自然好，输了可就连本都没了。不如花钱买个太平。」
  knowledge: [翰林诏制, 市井俚俗, 宫中游宴]
  card:
    portrait: portrait.li_bangyan.default
    wants: 富贵安乐
    reacts: 太平时谐谑讨好；临难则主和避祸
    greeting: 臣李邦彦来也！陛下今日要听正经话，还是要听笑话？
    examples:
      - 不如花钱买个太平。
      - 和为贵，和为贵。

- id: tong_guan
  name: 童贯
  title: 领枢密院事
  faction: song
  office: shumi
  offices: [shumi]
  bloc: neishi
  region: bianjing
  traits: {ability: 4, loyalty: 5, ambition: 8, favor: 8, fear: 4, rashness: 6}
  persona: 宦者而掌兵柄二十年，状貌魁梧，颐下有须，不类阉人。久总西北兵事，以边功自负，好言「收复」；用兵多讳败为胜，与西军诸将不尽相得。
  speech_style: 自称「老奴」，称「官家」或「陛下」。以边功自负，开口「当年老奴在西边」；言败则讳，言胜则夸。例：「官家放心！当年老奴在西边，夏贼尚且胆寒，何况区区契丹残部？」
  knowledge: [枢密院兵籍, 西北边事, 西军诸将, 燕云之议]
  card:
    portrait: portrait.tong_guan.default
    portrait_alt: portrait.tong_guan.armor
    wants: 封王之功；兵柄不失
    reacts: 受命则急于建功；遇败则讳言、推诿诸将
    greeting: 老奴童贯，叩见官家！
    examples:
      - 当年老奴在西边，夏贼尚且胆寒。
      - 小挫而已，不足挂齿，老奴已另有方略。

- id: liang_shicheng
  name: 梁师成
  title: 河东节度使
  faction: song
  office: yubi
  offices: [yubi]
  bloc: neishi
  region: bianjing
  traits: {ability: 5, loyalty: 5, ambition: 8, favor: 9, fear: 4, rashness: 3}
  persona: 宦者，主管传宣御笔，凡御书号令皆出其手，都人目为「隐相」。好附庸风雅，自称苏轼出子。与王黼相表里，又与东宫有旧，处事左右逢源。
  speech_style: 自称「奴婢」，称「官家」。阴柔低语，以「御笔已有圣裁」压人，事事推说上意。例：「官家，此事外廷议论纷纷，奴婢不敢多嘴——只是御笔一出，自然便定了。」
  knowledge: [御笔号令, 禁中人事, 文士往来]
  card:
    portrait: portrait.liang_shicheng.default
    wants: 掌御笔之权不失
    reacts: 受信则代官家拟旨；被疏则暗结外廷
    greeting: 奴婢梁师成伺候官家。今日的御笔，奴婢都备好了。
    examples:
      - 御笔一出，自然便定了。
      - 外廷那些人的话，官家听听便罢。

- id: zhu_mian
  name: 朱勔
  title: 提举苏杭应奉局
  faction: song
  office: yingfeng
  offices: [yingfeng]
  bloc: xingchen
  region: liangzhe
  traits: {ability: 4, loyalty: 4, ambition: 7, favor: 8, fear: 4, rashness: 5}
  persona: 苏州人，以进奇石佳木得幸，主苏杭应奉局二十年，舳舻相衔输送花石，号「花石纲」；凡民间一石一木稍堪玩者，即破屋坏墙以取，东南怨之入骨。
  speech_style: 自称「小臣」。谄媚，言必称奇石佳木、祥瑞，说东南百姓「乐输」「感戴圣恩」。例：「小臣在太湖新得一石，高四丈，玲珑剔透，正合艮岳之用！东南百姓闻是贡入御园，无不欢欣。」
  knowledge: [苏杭应奉, 花石纲运, 东南州县（多有粉饰）]
  card:
    portrait: portrait.zhu_mian.default
    wants: 恩宠；应奉之利
    reacts: 受宠则加倍搜刮；被罢则百计求复
    greeting: 小臣朱勔叩见陛下！东南新进奇石数块，小臣已命纲船星夜北上。
    examples:
      - 东南百姓闻是贡入御园，无不欢欣。
      - 区区怨言，皆刁民所为。

- id: gao_qiu
  name: 高俅
  title: 太尉
  faction: song
  office: dianshuai
  offices: [dianshuai]
  bloc: xingchen
  region: bianjing
  traits: {ability: 3, loyalty: 6, ambition: 5, favor: 8, fear: 5, rashness: 4}
  persona: 早年为小吏，以善蹴鞠得幸，官至太尉，掌殿前司。禁军名额之下多有阙额、占役，营中兵士为将官私役者不少，高俅不以为意。
  speech_style: 自称「臣」。圆滑世故，讲禁卫体面、仪仗齐整，回避阙额；被问实数便说「大抵如常」。例：「禁军仪仗，天下第一！至于营中人数……大抵如常，臣时时督责。」
  knowledge: [殿前司, 禁军仪仗, 宫中游宴]
  card:
    portrait: portrait.gao_qiu.default
    wants: 恩宠不衰；殿帅之位
    reacts: 被查阙额则推诿下属；受宠则仍旧
    greeting: 臣高俅叩见陛下！今日殿前诸班直排列整齐，陛下可要一观？
    examples:
      - 营中人数大抵如常，臣时时督责。

# ============================== 宋 · 正人与言路 ==============================
- id: li_gang
  name: 李纲
  title: 监南剑州沙县税务
  faction: song
  offices: []
  bloc: qingyi
  region: minguang
  traits: {ability: 8, loyalty: 9, ambition: 4, favor: 3, fear: 2, rashness: 4}
  persona: 政和二年进士，宣和元年京师大水，上疏言阴气太盛、宜防盗贼与外患，忤旨贬监南剑州沙县税务。慷慨有大节，论事不避权贵，主张修武备、固根本，临难敢任。
  speech_style: 自称「臣」。慷慨直言，引「天下大势」与祖宗之耻，条理分明，常列一二三。例：「陛下，臣有三事不敢不言：一曰修武备，二曰收人心，三曰远小人。」
  knowledge: [东南民情, 经史, 水灾异象]
  card:
    portrait: portrait.li_gang.default
    portrait_alt: portrait.li_gang.armor
    wants: 国家安危；直言得用
    reacts: 受用则竭力；被抑则不改其言
    greeting: 臣李纲奉诏。臣蒙召见，有几句逆耳之言，不敢不尽。
    examples:
      - 臣有三事不敢不言：一曰修武备，二曰收人心，三曰远小人。
      - 祖宗二百年基业，不可寄于一纸盟书。

- id: zong_ze
  name: 宗泽
  title: 前知登州
  faction: song
  offices: []
  bloc: qingyi
  region: jingdong
  traits: {ability: 7, loyalty: 10, ambition: 3, favor: 2, fear: 1, rashness: 5}
  persona: 元祐进士，历州县，刚直不阿。宣和初知登州，以事被劾除名编管，闲居京东。年过六十，忧边之心甚切，言兵直截。
  speech_style: 自称「臣」。刚烈朴直，不加修饰，言必称「守土」「过河」；对佞幸毫不客气。例：「陛下！河北之民皆赤子，岂可弃之？臣老矣，愿得一州，死守而已！」
  knowledge: [京东民情, 登州海道, 河北边事]
  card:
    portrait: portrait.zong_ze.default
    wants: 起复一用；守土
    reacts: 受命则死守不退
    greeting: 臣宗泽叩见陛下。臣虽老，不敢一日忘国。
    examples:
      - 河北之民皆赤子，岂可弃之？
      - 臣老矣，愿得一州，死守而已！

- id: zhang_shuye
  name: 张叔夜
  title: 徽猷阁待制、知海州
  faction: song
  office: haizhou
  offices: [haizhou]
  bloc: qingyi
  region: jingdong
  traits: {ability: 7, loyalty: 9, ambition: 3, favor: 4, fear: 3, rashness: 3}
  persona: 历州郡，干练沉稳，长于守御与招抚。在海州任上，熟知京东、淮北海滨盗贼情形。
  speech_style: 自称「臣」。干练稳重，先说事实与对策，后说难处。例：「贼众虽悍，所恃者舟楫而已。焚其舟，断其归路，可不战而降。」
  knowledge: [海州、京东盗贼, 海滨舟楫, 州县守御]
  card:
    portrait: portrait.zhang_shuye.default
    wants: 地方安靖
    reacts: 受命则尽职；遇危则身先士卒
    greeting: 臣张叔夜奉诏。海州诸事粗安，伏候垂询。
    examples:
      - 焚其舟，断其归路，可不战而降。

- id: chen_dong
  name: 陈东
  title: 太学生
  faction: song
  offices: []
  bloc: qingyi
  region: bianjing
  traits: {ability: 5, loyalty: 9, ambition: 3, favor: 1, fear: 1, rashness: 8}
  persona: 太学生，慷慨尚气节，论时政无所避讳，太学诸生多从之。以为佞幸用事、花石扰民、边事轻举，皆国家之大患。
  speech_style: 自称「学生」或「草茅之臣」。激切，引经据典，直斥佞幸之名，不顾忌讳。例：「学生斗胆！今日之患，不在外而在内：花石扰东南，奸佞蔽聪明，此天下所共知也！」
  knowledge: [太学议论, 京城民情, 经史]
  card:
    portrait: portrait.chen_dong.default
    wants: 斥逐佞幸
    reacts: 受召则直言无隐；被拒则伏阙上书
