# 驿程 courier_days：自本路治所奏到汴京的日数，按急脚递日行数百里、远路放慢估算；超过 settings.courier.late_threshold_days（15）
# 的川峡、闽广：奏疏与军报晚一季，诏令晚一季到达。外域按转奏之边郡估计。
# 收入公式 controlled_only：只计 controller = 宋 的地区；陷敌、陷于方腊之地不再输送赋税。
