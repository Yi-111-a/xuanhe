  importance: 2
  text: 王黼专政日久，与梁师成相表里，又谋摇东宫，中外侧目。至是罢相致仕。白时中、李邦彦分领太宰、少宰事，而起蔡京领三省事——蔡京年近八十，目昏不能视事，事多决于其子蔡絛。
