  title: 金人治兵
  kind: system
  conditions:
    all:
      - {kind: turn, operator: gte, value: 10}
      - {kind: resource, id: nanmu, operator: gte, value: 60}
      - {kind: flag, key: jin_warning, operator: absent}
  gravity: 1.0
  text: 边臣觇报：金人于云中、平州聚粮治兵。
  effects:
    - {op: set_flag, key: jin_warning, value: true}

- id: jin_envoy_blame
