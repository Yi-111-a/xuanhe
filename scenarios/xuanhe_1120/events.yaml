  importance: 3
  text: 金主下诏伐宋。宗翰（粘罕）自云中趋太原为西路，宗望（斡离不）自平州趋燕山为东路，两路各六万，期会于汴京城下。边报至京，举朝失色。
  effects:
    - {op: set_flag, key: jin_invaded, value: true}
    - {op: adjust_relation, a: song, b: jin, delta: -150}
    - {op: adjust_relation, a: jin, b: song, delta: -150}
    - {op: set_region_controller, region: yunzhong, faction: jin}
    - {op: set_region_controller, region: pingzhou, faction: jin}
