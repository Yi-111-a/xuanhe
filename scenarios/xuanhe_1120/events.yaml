# 事件。语义：带 when 的事件只在该回合（结算进入的目标回合）掷一次 gravity；不带 when 的条件事件每季重掷，直到触发
# （repeatable 事件按 cooldown 再次触发）。同季事件按文件顺序判定，前面事件的效果会影响后面事件的条件。
# 史实时点见 docs/FACT_CHECK.md；数值、概率与反事实分支为本游戏设定（【设】/【反】）。
# 约定：
# - 「照例施行」事件（*_default）：奏疏写明「若不处置，下季照例施行」者，玩家未批答时于下季按史事执行，
#   使「什么都不做」的一局沿史实走向靖康。条件一律读 memorial:<id> absent。
# - kind: system 为记账 / 控制权事件，不弹窗、不配图。

# ======================== 第一幕 宣和二年：盟与乱之始 ========================
- id: haishang_default
  title: 赵良嗣使金
  kind: conditional
  when: {turn: 1}
  conditions:
    all:
      - {kind: flag, key: "memorial:t0_haishang", operator: absent}
      - {kind: flag, key: haishang_ally, operator: absent}
  gravity: 1.0
  importance: 3
  text: 海上之议，陛下未有明诏，枢密院与少宰照前议行事：遣右文殿修撰赵良嗣自登州浮海使金，约夹攻辽，金取中京，宋取燕京，旧输辽之岁币转输于金。
  effects:
    - {op: set_flag, key: haishang_ally, value: true}
    - {op: adjust_resource, resource: liao_zuo, delta: -3, reason: 宋金夹攻之约}
    - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋使浮海来聘}
    - {op: remember, character: zhao_liangsi, fact: 宣和二年春，奉命浮海使金，约夹攻辽}
  illustration: event.haishang

- id: shangjing_falls
  title: 金破辽上京
  kind: scheduled
  when: {turn: 1}
  gravity: 1.0
  importance: 2
  region: liao
  text: 金主阿骨打亲攻辽上京临潢府，一日而下。辽之宗庙所在，尽为女真所有；天祚帝犹畋猎于外，不能救。
  effects:
    - {op: set_flag, key: shangjing_fallen, value: true}
    - {op: adjust_resource, resource: liao_zuo, delta: -6, reason: 辽上京陷}
    - {op: adjust_army, army: liao_main, delta: -8000, reason: 上京之败，辽主力折损}
  illustration: event.shangjing_falls

- id: huashi_shenyun
  title: 神运昭功石
  kind: scheduled
  when: {turn: 1}
  conditions:
    all:
      - {not: {kind: flag, key: huashi_abolished, value: true}}
      - {not: {kind: flag, key: huashi_halved, value: true}}
  gravity: 0.9
  importance: 1
  region: liangzhe
  text: 应奉局自太湖得巨石，高数丈，以巨舰载之，役夫数千，所过州县拆水门、毁桥梁以通，号「神运昭功石」。东南为之骚然。
  effects:
    - {op: adjust_resource, resource: dongnan, delta: 5, reason: 神运石北输，所过骚然}
    - {op: adjust_resource, resource: authority, delta: 1, reason: 奇石入御园}
    - {op: adjust_region, region: liangzhe, stat: order, delta: -4}
  illustration: event.huashi

- id: cai_retire_default
  title: 蔡京致仕
  kind: conditional
  when: {turn: 2}
  conditions:
    all:
      - {kind: flag, key: "memorial:t1_cai", operator: absent}
      - {kind: office_holder, office: taishi, character: cai_jing}
      - {kind: office_holder, office: shaozai, character: wang_fu}
  gravity: 1.0
  importance: 2
  text: 太师蔡京累上章乞骸骨，陛下未批，三省依例奉行：诏蔡京致仕，仍朝朔望。公相去位，中书之事渐归少宰王黼。
  effects:
    - {op: dismiss, character: cai_jing, office: taishi}
    - {op: set_character_status, character: cai_jing, status: retired, cause: 致仕，仍朝朔望}
    - {op: set_flag, key: cai_retired, value: true}
    - {op: adjust_resource, resource: ningxing, delta: -3, reason: 公相去位}
  illustration: event.cai_retire

- id: wangfu_taizai
  title: 王黼进太宰
  kind: conditional
  when: {turn: 3}
  conditions:
    all:
      - {kind: flag, key: cai_retired, value: true}
      - {kind: flag, key: "memorial:t2_zaixiang", operator: absent}
      - {kind: flag, key: "memorial:t2_zaixiang_noli", operator: absent}
      - {kind: office_holder, office: shaozai, character: wang_fu}
      - {kind: office_holder, office: taizai, character: yu_shen}
  gravity: 0.95
  importance: 2
  text: 太宰余深罢，以少宰王黼为少保、太宰兼门下侍郎。王黼骤贵，中外大权尽归之，四方奇货、应奉之事皆由其门。
  effects:
    - {op: dismiss, character: yu_shen, office: taizai}
    - {op: set_character_status, character: yu_shen, status: retired, cause: 罢太宰}
    - {op: dismiss, character: wang_fu, office: shaozai}
    - {op: appoint, character: wang_fu, office: taizai}
    - {op: adjust_resource, resource: ningxing, delta: 3, reason: 王黼秉政}
    - {op: adjust_resource, resource: dongnan, delta: 2, reason: 应奉之求愈急}
  illustration: event.court_debate

- id: zhexi_drought
  title: 两浙旱蝗
  kind: random
  conditions:
    all:
      - {kind: turn, operator: gte, value: 1}
      - {kind: turn, operator: lte, value: 3}
      - {kind: resource, id: dongnan, operator: gte, value: 55}
  gravity: 0.45
  importance: 1
  region: liangzhe
  text: 两浙旱，蝗起于睦、歙山间。应奉之役不减，州县催科如故，乡民或聚或散。
  effects:
    - {op: adjust_resource, resource: dongnan, delta: 3, reason: 旱蝗而征敛不减}
    - {op: adjust_region, region: liangzhe, stat: grain, delta: -3}
    - {op: adjust_region, region: liangzhe, stat: prosperity, delta: -2}
  illustration: event.famine

# 方腊：东南民怨 ≥ 66 即可能起事；史实宣和二年十月（本游戏宣和二年冬，T3）。起事即据两浙。
- id: fangla_rising
  title: 方腊起事
  kind: conditional
  conditions:
    all:
      - {kind: turn, operator: gte, value: 3}
      - {kind: turn, operator: lte, value: 18}
      - {kind: resource, id: dongnan, operator: gte, value: 66}
      - {kind: flag, key: fangla_risen, operator: absent}
  gravity: 0.9
  importance: 3
  region: liangzhe
  text: 睦州青溪漆园主方腊，聚苦于征敛之民起事，旬日之间众至数万，连陷睦、歙，进逼杭州。两浙州县望风而溃，东南漕运为之不通。
  effects:
    - {op: set_flag, key: fangla_risen, value: true}
    - {op: adjust_relation, a: song, b: fangla, delta: -100}
    - {op: adjust_relation, a: fangla, b: song, delta: -100}
    - {op: adjust_army, army: fangla_army, delta: 100000, reason: 方腊聚众}
    - {op: set_region_controller, region: liangzhe, faction: fangla}
    - {op: adjust_resource, resource: morale, delta: -3, reason: 东南乱起}
    - {op: adjust_resource, resource: authority, delta: -2, reason: 东南乱起}
    - {op: adjust_region, region: liangzhe, stat: prosperity, delta: -8}
  illustration: event.fangla_rising

# 奏疏 t3_fangla「睦州告变」未批：下季枢密院照例遣童贯统禁旅与陕西兵南讨（史实）。
- id: nanzheng_default
  title: 童贯南讨
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: fangla_risen, value: true}
      - {kind: flag, key: fangla_quelled, operator: absent}
      - {kind: flag, key: nanzheng_sent, operator: absent}
      - {kind: flag, key: fangla_amnesty, operator: absent}
      - {kind: flag_age, key: fangla_risen, operator: gte, value: 1}
      - {kind: flag, key: "memorial:t3_fangla", operator: absent}
  gravity: 1.0
  importance: 2
  text: 东南告急之奏日至，枢密院照例行事：以童贯为江淮荆浙宣抚使，抽泾原、秦凤之兵五万与禁旅一万，合六万南下讨方腊。北伐之议因之暂缓。
  effects:
    - {op: set_flag, key: nanzheng_sent, value: true}
    - {op: adjust_army, army: xijun_jingyuan, delta: -30000, reason: 抽泾原兵三万南讨}
    - {op: adjust_army, army: xijun_qinfeng, delta: -20000, reason: 抽秦凤兵二万南讨}
    - {op: adjust_army, army: jinjun, delta: -10000, reason: 抽禁旅一万南讨}
    - {op: adjust_army, army: nanzheng, delta: 60000, reason: 南讨诸军合兵六万}
    - {op: march, army: nanzheng, to_region: liangzhe, with_commander: false}
    - {op: set_army_posture, army: nanzheng, posture: attack}
    - {op: move_character, character: tong_guan, to_region: huainan}
    - {op: adjust_resource, resource: treasury, delta: -80, reason: 南讨军费}
  illustration: event.nanzheng

# 官军追讨：南讨诸军（或东南诸军）不在途、与方腊军不在一地时，向方腊军所在进讨（方腊只在两浙、江南、淮南之间）。
- id: pursue_fangla_jiangnan
  title: 官军追讨方腊
  kind: system
  repeatable: true
  cooldown: 2
  conditions:
    all:
      - {kind: flag, key: fangla_risen, value: true}
      - {kind: flag, key: fangla_quelled, operator: absent}
      - {kind: army_region, army: fangla_army, region: jiangnan}
      - {kind: army_strength, army: nanzheng, operator: gt, value: 0}
      - {kind: army_region, army: nanzheng, operator: ne, region: jiangnan}
  gravity: 1.0
  text: 南讨诸军追讨方腊，进兵江南。
  effects:
    - {op: march, army: nanzheng, to_region: jiangnan, with_commander: true}
    - {op: set_army_posture, army: nanzheng, posture: attack}

- id: pursue_fangla_liangzhe
  title: 官军追讨方腊
  kind: system
  repeatable: true
  cooldown: 2
  conditions:
    all:
      - {kind: flag, key: fangla_risen, value: true}
      - {kind: flag, key: fangla_quelled, operator: absent}
      - {kind: army_region, army: fangla_army, region: liangzhe}
      - {kind: army_strength, army: nanzheng, operator: gt, value: 0}
      - {kind: army_region, army: nanzheng, operator: ne, region: liangzhe}
  gravity: 1.0
  text: 南讨诸军追讨方腊，进兵两浙。
  effects:
    - {op: march, army: nanzheng, to_region: liangzhe, with_commander: true}
    - {op: set_army_posture, army: nanzheng, posture: attack}

- id: fangla_quelled
  title: 方腊就擒
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: fangla_risen, value: true}
      - {kind: flag, key: fangla_quelled, operator: absent}
      - any:
          - {kind: army_strength, army: fangla_army, operator: lte, value: 20000}
          - all:
              - {not: {kind: region_controller, region: liangzhe, faction: fangla}}
              - {not: {kind: region_controller, region: jiangnan, faction: fangla}}
              - {not: {kind: region_controller, region: huainan, faction: fangla}}
  gravity: 1.0
  importance: 3
  region: liangzhe
  text: 官军克复诸州，方腊退保帮源洞，裨将韩世忠潜行溪谷，生擒之，余众或降或散（史载擒方腊之功为辛兴宗所冒）。两浙渐定，然兵火之余，室庐多毁。
  effects:
    - {op: set_flag, key: fangla_quelled, value: true}
    - {op: adjust_army, army: fangla_army, delta: -200000, reason: 方腊余众溃散}
    - {op: set_region_controller, region: liangzhe, faction: song}
    - {op: set_character_status, character: fang_la, status: dead, cause: 就擒伏诛}
    - {op: adjust_resource, resource: dongnan, delta: -6, reason: 乱平}
    - {op: adjust_resource, resource: authority, delta: 2, reason: 东南乱平}
    - {op: adjust_region, region: liangzhe, stat: prosperity, delta: -10}
    - {op: adjust_region, region: liangzhe, stat: tax, delta: -4}
    - {op: adjust_counter, key: war_merit, delta: 1}
  illustration: event.nanzheng

# 方腊据江南、淮南时，乱平后收回（与上一事件同季：上一事件只收两浙）。
- id: fangla_lands_restored
  title: 江南复归
  kind: system
  conditions:
    all:
      - {kind: flag, key: fangla_quelled, value: true}
      - any:
          - {kind: region_controller, region: jiangnan, faction: fangla}
          - {kind: region_controller, region: huainan, faction: fangla}
  gravity: 1.0
  text: 方腊余众既散，江南、淮南州县复归版籍。
  effects:
    - {op: set_region_controller, region: jiangnan, faction: song}
    - {op: set_region_controller, region: huainan, faction: song}

# 奏疏 t5_nanzheng「南讨诸军」未批：乱平两季后依例归建西边。
- id: nanzheng_return
  title: 南讨诸军归建
  kind: system
  conditions:
    all:
      - {kind: flag, key: fangla_quelled, value: true}
      - {kind: flag_age, key: fangla_quelled, operator: gte, value: 2}
      - {kind: flag, key: "memorial:t5_nanzheng", operator: absent}
      - {kind: army_strength, army: nanzheng, operator: gt, value: 0}
  gravity: 1.0
  text: 南讨诸军依例归建西边。
  effects:
    - {op: merge_army, army: nanzheng, into: xijun_qinfeng, reason: 南讨诸军归建}

- id: songjiang_rising
  title: 宋江横行京东
  kind: scheduled
  when: {turn: 3}
  conditions: {kind: flag, key: songjiang_risen, operator: absent}
  gravity: 0.85
  importance: 1
  region: jingdong
  text: 京东盗宋江等三十六人横行齐、魏，转掠十郡，官军莫敢撄其锋；其众出没梁山泊与海滨，将南入楚、海州界。
  effects:
    - {op: set_flag, key: songjiang_risen, value: true}
    - {op: adjust_region, region: jingdong, stat: order, delta: -8}
    - {op: adjust_resource, resource: morale, delta: -1, reason: 京东盗起}
  illustration: event.songjiang

# 奏疏 t4_songjiang 未批：海州守臣张叔夜照例设伏焚舟，招降宋江（史实宣和三年二月）。
- id: songjiang_default
  title: 张叔夜招降宋江
  kind: conditional
  when: {turn: 5}
  conditions:
    all:
      - {kind: flag, key: songjiang_risen, value: true}
      - {kind: flag, key: "memorial:t4_songjiang", operator: absent}
      - {kind: office_holder, office: haizhou, character: zhang_shuye}
  gravity: 0.9
  importance: 1
  region: jingdong
  text: 宋江劫巨舟十余入海州界，知州张叔夜募死士千人设伏，焚其舟，擒其副贼，宋江乃降。京东稍定。
  effects:
    - {op: set_flag, key: songjiang_amnesty, value: true}
    - {op: adjust_region, region: jingdong, stat: order, delta: 6}
    - {op: remember, character: zhang_shuye, fact: 宣和三年，于海州焚舟设伏，招降宋江}
  illustration: event.songjiang

# 奏疏 t5_yingfeng（复置应奉司）未批：王黼、梁师成照例奏复（史实宣和三年闰五月复应奉司）。
- id: yingfeng_default
  title: 复置应奉司
  kind: conditional
  when: {turn: 6}
  conditions:
    all:
      - {kind: flag, key: huashi_abolished, value: true}
      - {kind: flag, key: "memorial:t5_yingfeng", operator: absent}
      - {kind: flag, key: yingfeng_restored, operator: absent}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  gravity: 0.9
  importance: 1
  text: 乱平未久，王黼、梁师成以禁中供奉不给，奏复应奉司，命二人领之。花石之求，换了名目，又起于东南。
  effects:
    - {op: set_flag, key: yingfeng_restored, value: true}
    - {op: add_ledger, id: yingfeng_si, name: 应奉司, category: treasury, amount: -15, kind: recurring, reason: 复置应奉司（游戏折算）, cancellable: false}
    - {op: adjust_resource, resource: dongnan, delta: 5, reason: 应奉复起}
    - {op: adjust_resource, resource: ningxing, delta: 2, reason: 王、梁领应奉}
  illustration: event.huashi

# 金使责宋：海上之盟已定，宋因方腊之乱违夹攻之期（史载宋于宣和三年未能出兵）。
- id: jiagong_late
  title: 金使责宋失期
  kind: conditional
  conditions:
    all:
      - {kind: turn, operator: gte, value: 5}
      - {kind: turn, operator: lte, value: 7}
      - {kind: flag, key: haishang_ally, value: true}
      - {kind: flag, key: jiagong_late, operator: absent}
      - {kind: flag, key: jiagong_excused, operator: absent}
      - {kind: flag, key: beifa_started, operator: absent}
      - any:
          - all:
              - {kind: flag, key: fangla_risen, value: true}
              - {kind: flag, key: fangla_quelled, operator: absent}
          - {kind: flag, key: "memorial:t2_jiagong", value: delay}
  gravity: 0.8
  importance: 2
  region: jin
  text: 金使来问夹攻之期，宋以东南有事，辞以未暇。金人归语其主：「南朝许而不践。」
  effects:
    - {op: set_flag, key: jiagong_late, value: true}
    - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋违夹攻之期}
  illustration: event.jin_envoy

- id: genyue_complete
  title: 艮岳成
  kind: scheduled
  when: {turn: 9}
  gravity: 0.9
  importance: 1
  text: 万岁山成，更名艮岳。周十余里，峰峦叠嶂，奇石林立，四方珍禽异兽、嘉木名卉聚于其中。陛下亲为之记。
  effects:
    - {op: adjust_resource, resource: authority, delta: 1, reason: 艮岳成}
    - {op: adjust_resource, resource: treasury, delta: -40, reason: 艮岳收尾工役}
    - {op: adjust_resource, resource: dongnan, delta: 2, reason: 花木石料之役}
  illustration: event.genyue

# ======================== 辽之崩解（与玩家外交线交织） ========================
# 辽祚 ≥ 35（联辽、输粮）时中京得以坚守一时；否则史实宣和四年正月中京陷。
- id: zhongjing_falls
  title: 金破辽中京
  kind: scheduled
  when: {turn: 8}
  conditions: {kind: resource, id: liao_zuo, operator: lt, value: 35}
  gravity: 1.0
  importance: 3
  region: liao
  text: 金兵破辽中京大定府，天祚帝西走夹山，辽之诸路震溃。燕京无主，辽宰相等立秦晋国王耶律淳为帝，据燕自守，史称北辽。
  effects:
    - {op: set_flag, key: zhongjing_fallen, value: true}
    - {op: set_region_controller, region: liao, faction: jin}
    - {op: adjust_army, army: liao_main, delta: -25000, reason: 中京之败}
    - {op: move_army, army: liao_main, to_region: yunzhong}
    - {op: adjust_resource, resource: liao_zuo, delta: -10, reason: 辽中京陷}
  illustration: event.zhongjing_falls

- id: zhongjing_holds
  title: 中京未下
  kind: scheduled
  when: {turn: 8}
  conditions: {kind: resource, id: liao_zuo, operator: gte, value: 35}
  gravity: 1.0
  importance: 2
  region: liao
  text: 金兵攻辽中京，辽人得宋之助，守城未下。女真退屯北境，治兵以待来岁。
  effects:
    - {op: adjust_resource, resource: liao_zuo, delta: -4, reason: 中京苦战}
    - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人疑宋阴助辽}
  illustration: event.zhongjing_falls

- id: yunzhong_falls
  title: 金取辽西京
  kind: scheduled
  when: {turn: 9}
