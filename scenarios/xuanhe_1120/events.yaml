  title: 金兵大举南下
  kind: conditional
  conditions:
    all:
      - {kind: turn, operator: gte, value: 12}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: resource, id: nanmu, operator: gte, value: 85}
  gravity: 0.9
  importance: 3
  text: 金主倾国伐宋。宗翰自云中趋太原，宗望自平州趋燕山，两路各七万五千，期会于汴京城下。边报至京，举朝失色。
  effects:
    - {op: set_flag, key: jin_invaded, value: true}
    - {op: adjust_relation, a: song, b: jin, delta: -150}
    - {op: adjust_relation, a: jin, b: song, delta: -150}
    - {op: set_region_controller, region: yunzhong, faction: jin}
    - {op: set_region_controller, region: pingzhou, faction: jin}
    - {op: adjust_army, army: jin_west, delta: 75000, reason: 宗翰西路七万五千}
    - {op: adjust_army, army: jin_east, delta: 75000, reason: 宗望东路七万五千}
