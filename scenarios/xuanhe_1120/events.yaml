  importance: 2
  text: 王黼以燕山馈运、边费不给，奏括天下丁夫，令纳免夫钱，每夫三十贯。州县督责急于星火，所得以千万计，而天下骚然。
  effects:
    - {op: set_flag, key: mianfu, value: true}
    - {op: adjust_resource, resource: treasury, delta: 220, reason: 免夫钱}
