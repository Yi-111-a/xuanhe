# 王黼罢、蔡京复出（史实宣和六年九月至十二月）：奏疏 t18_zaixiang 处置；未批则照例施行。
- id: wangfu_falls_default
  title: 王黼罢相
  kind: conditional
  when: {turn: 19}
  conditions:
    all:
      - {kind: flag, key: "memorial:t18_zaixiang", operator: absent}
      - {kind: flag, key: wangfu_dismissed, operator: absent}
