    the Ordos in the upper-left quarter, comes back down, then flows east straight through the exact centre of the image and reaches the sea at the right edge a little above the middle, just north of a
    peninsula; the Shandong peninsula juts out into the sea on the right side slightly below the middle; the Bohai gulf is a bay at the upper right with the Liaodong peninsula above it; the Huai River and
    then the wide Yangtze River flow from left to right across the lower third, the Yangtze reaching the sea at the lower right; the Grand Canal is a thin straight waterway from the Yellow River in the
    centre down to the Yangtze delta; the Taihang mountains run north-south just above and left of the centre, the Yan mountains run east-west across the top centre, the Qinling mountains lie left of centre
    below the Yellow River, the Sichuan basin is a green hollow in the lower-left corner surrounded by mountains, the Fujian coastal hills are in the lower-right corner; dry northern steppe grassland across
    the top-left and top-centre, dark Manchurian forests at the top-right corner, the Ordos desert and the Helan mountains at the upper-left edge, the Korean peninsula only as a faint hilly edge at the
    far right top behind the gulf. The sea is a plain calm celadon expanse along the right edge and bottom-right with simple wave scroll lines: NO islands, NO Taiwan, NO Japan. Mountains in layered azurite
    blue and malachite green over ochre, plains in pale silk-ochre and light green fields, rivers in pale blue with fine ink outlines. About twelve tiny walled-city icons (blank), faint dotted road lines,
    mist bands. NO text, NO labels, NO legend, NO compass, NO cartouche, NO borders with writing. Absolutely no text, no characters, no letters, no numbers, no seals, no inscriptions anywhere in the image.'
