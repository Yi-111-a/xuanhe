        - {op: appoint, character: zong_ze, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 起宗泽宣抚河北}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 河北之民闻宗泽起用}
        - {op: adjust_resource, resource: ningxing, delta: -3, reason: 罢童贯、起正人}
      hint: 童贯罢宣抚（仍领枢密院）；宗泽自京东赴河北西路（行程见回执）；武备 +1，民心 +1，佞幸 −3
    - id: zhang
      label: 罢童贯宣抚，以张叔夜代之
      memory: {character: zhang_shuye, text: 宣和七年，奉命代童贯宣抚河北}
      ops:
        - {op: dismiss, character: tong_guan, office: hebei_xuanfu}
        - {op: appoint, character: zhang_shuye, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 张叔夜宣抚河北}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢童贯宣抚}
      hint: 童贯罢宣抚（仍领枢密院）；张叔夜赴河北西路（行程见回执）；武备 +1，佞幸 −2
    - id: keep
      label: 童贯照旧宣抚
      ops:
