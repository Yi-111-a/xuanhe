  keywords: [勤王, 张叔夜, 京东]
  advisors:
    - {character: zhang_shuye, stance: support, option: march, requires: {region: jingdong}, line: （自京东驰奏）臣愿募京东子弟入卫，与京城共存亡。}
    - {character: zong_ze, stance: neutral, option: stay, requires: {region: jingdong}, line: （自京东驰书）京东在金人之侧，守住京东，金人便不敢放心南下。}
  options:
    - id: march
      label: 募京东兵一万五千，随张叔夜入卫京师
      memory: {character: zhang_shuye, text: 金兵南下，臣募京东兵入卫京师}
