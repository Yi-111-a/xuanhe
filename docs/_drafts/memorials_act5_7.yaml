        - {op: adjust_resource, resource: treasury, delta: -45, reason: 募京东勤王之兵}
      hint: 京师禁军 +15000（素质不变），国库 −45；张叔夜赴京（行程见回执）；此后养兵每季 +4.5 万缗、粮 +1.8 万石
    - id: stay
