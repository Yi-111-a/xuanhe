# ============================== 乙批：T16–T27（宣和六年 → 宣和八年冬）与常设条目 ==============================
# 追加到 memorials.yaml 末尾。约定同前：采纳即写 memorial:<id> = 选项 id；「若不处置，下季照例施行」者对应 events.yaml 的 *_default。
# - 宣和六年、七年的史事条目用 turn（+ expires_after）；由局势触发的（金人治兵、陈东上书、金兵南下后的战时奏疏）只写 conditions，
#   id 用 t_ 前缀（金兵南下的季数因局而异，约在宣和六年冬到宣和七年冬之间）。
# - 罢黜一律用 set_character_status（retired 罢归 / exiled 窜逐）：引擎在人物离任时自动空出其全部官职，不受其兼何职的影响；
#   文字说「某官某人」处仍以 office_holder 守卫。
# - 常设条目（s_ 前缀）处置后由一项零费用的「勘会」工程在若干季后清除 memorial:<id>，届时该条重新呈上（冷却）。
# 文本为本游戏写作（【设】）；史事以 docs/FACT_CHECK_RESEARCH.md 为准，拿不准者写作本游戏设定或模糊处理。

# ============================== T16 宣和六年春 ==============================
- id: t16_shanhou
  turn: 16
  expires_after: 1
  title: 山后诸州
  summary: >-
    燕山既归，朝廷屡遣使求山后蔚、应、朔诸州，金人许而复悔，粘罕据云中不与。或请据誓书再索，或请以银绢易其一二州，
    或请罢求山后、专力修燕山之守。
  region: yunzhong
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: yanjing_song, value: true}
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: region_controller, region: yunzhong, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: press
  keywords: [山后, 云中, 燕山, 金使]
  advisors:
    - {character: tong_guan, stance: support, option: press, line: 山后不得，燕山便是孤城。当年老奴在西边，寸土必争，官家岂可就此罢手？}
    - {character: zhao_liangsi, stance: neutral, option: buy, line: 山后之地，金人本不甚惜。以银绢易其一二州，河东北面便有屏蔽。}
    - {character: ma_kuo, stance: oppose, option: fortify, requires: {region: bianjing}, line: 臣亲见粘罕，其人桀骜，许而复悔，非一纸书可得。与其求地，不如修燕山之守。}
  options:
    - id: press
      label: 据誓书再遣使，力索山后诸州
      memory: {character: zhao_liangsi, text: 宣和六年春，朝廷再遣使索山后诸州}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 遣使索山后}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 不弃故疆之志}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 宋求地无厌}
      hint: 国库 −10，君威 +1，金人轻宋（风闻）↑；金人未必肯与
    - id: buy
      label: 许以银绢，易武、朔二州
      ops:
        - {op: adjust_resource, resource: treasury, delta: -120, reason: 以银绢易武朔二州}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 收复武朔}
        - {op: adjust_region, region: hedong, stat: defense, delta: 5}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人知宋可欺以利}
      hint: 国库 −120，君威 +2，河东防务 +5（得武、朔为河东北面屏蔽，本游戏设定）；金人轻宋（风闻）↑
    - id: fortify
      label: 罢求山后，专修燕山守备（两季）
      ops:
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋不复求地}
        - op: start_project
          name: 修燕山守备
          region: yanshan
          cost_per_turn: {treasury: 35}
          turns: 2
          on_complete:
            - {op: adjust_region, region: yanshan, stat: defense, delta: 10}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 燕山守备修治}
      hint: 国库每季 −35 共两季；成后燕山防务 +10、武备 +2；金人轻宋（风闻）略↓

- id: t16_hebei_dangchong
  turn: 16
  expires_after: 1
  title: 河北当冲
  summary: 燕京既在金人之手，自燕至河北一马平川，金骑旦夕可至白沟旧界。河北都转运司请增修城寨、补戍兵，以备不虞。
  region: hebei_xi
  illustration: event.tangluo
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: fortify
  keywords: [河北, 城防, 武备, 燕京]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, requires: {region: bianjing}, line: 燕山之险既在金人，河北便是边地。城不修，兵不练，一旦有警，无可凭依。}
    - {character: zong_ze, stance: support, option: garrison, requires: {region: jingdong}, line: （自京东驰书）河北之民皆赤子，岂可无兵以卫之？臣老矣，犹愿为陛下募兵守土！}
    - {character: li_bangyan, stance: oppose, option: envoy, requires: {region: bianjing}, line: 金人方与咱们通好，河北一修城，倒像是防着人家。不如派个使者去，客客气气的。}
  options:
    - id: fortify
      label: 修真定、中山诸城（两季）
      ops:
        - op: start_project
          name: 修河北西路城寨
          region: hebei_xi
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 10}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 河北城寨修治}
      hint: 国库每季 −40 共两季；成后河北西路防务 +10、武备 +2
    - id: garrison
      label: 募兵一万增戍河北东路
      ops:
        - {op: adjust_army, army: hebei_dong_army, delta: 10000, reason: 募兵一万增戍}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 河北增戍}
      hint: 河北东路禁军 +10000（素质不变），国库 −30，武备 +1；此后养兵每季 +3 万缗、粮 +1.2 万石
    - id: envoy
      label: 遣使通好，以安金人之心
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 遣使通好}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋使恭谨}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 示弱于金}
      hint: 国库 −30，君威 −1，金人轻宋（风闻）↓；河北边备如旧

- id: t16_jin_grain
  turn: 16
  title: 金人求粮
  summary: >-
    金使至燕山，以交割之初宋曾许粮为辞，求粮二十万石。河北方苦水旱，燕山馈运已困。若不处置，有司照例许之而不输。
  region: yanshan
  illustration: event.jin_envoy
  conditions: {kind: flag, key: jin_grain_asked, value: true}
  proposal: grain
  keywords: [金使, 求粮, 燕山]
  advisors:
    - {character: zhao_liangsi, stance: support, option: grain, line: 交割之时确有此诺。女真重然诺，我若失信，彼必以为口实。}
    - {character: wang_fu, stance: neutral, option: half, requires: {office: [taizai, shaozai]}, line: 全输则河北无粮，不输则金人有辞。输其半，塞其口足矣，此陛下两全之道。}
    - {character: ma_kuo, stance: neutral, option: refuse, requires: {region: bianjing}, line: 能输则输；不能，则以河北饥荒实告之。最怕的是许而不输，授人以柄。}
  options:
    - id: grain
      label: 如数输粮二十万石
      ops:
        - {op: set_flag, key: jin_grain_paid, value: full}
        - {op: adjust_resource, resource: grain, delta: -20, reason: 输金人粮二十万石}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: -3}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 括河北之粟以输金}
        - {op: adjust_resource, resource: jin_contempt, delta: -3, reason: 宋人践约输粮}
        - {op: adjust_resource, resource: nanmu, delta: -1, reason: 金人无辞}
      hint: 粮储 −20（即二十万石），河北东路治安 −3，民心 −1；金人轻宋（风闻）↓，胡马南牧（风闻）略↓
    - id: half
      label: 输十万石，余以河北饥荒辞之
      ops:
        - {op: set_flag, key: jin_grain_paid, value: half}
        - {op: adjust_resource, resource: grain, delta: -10, reason: 输金人粮十万石}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋人输粮其半}
      hint: 粮储 −10，金人轻宋（风闻）略↓
    - id: refuse
      label: 以河北饥荒实告，不输
      ops:
        - {op: set_flag, key: jin_grain_paid, value: none}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 宋人辞粮}
      hint: 金人轻宋（风闻）略↑——较「许而不输」为轻

# ============================== T17 宣和六年夏 ==============================
- id: t17_mianfu
  turn: 17
  title: 免夫钱
  summary: >-
    宰相王黼以燕山馈运、边费不给，奏括天下丁夫，令纳免夫钱，每夫三十贯，限期输纳；所得当以千万缗计。言者谓河北、京东方饥，
    东南疮痍未复，不可再扰。若不处置，下季照王黼所奏施行。
  region: bianjing
  illustration: event.mianfu
  conditions:
    all:
      - {kind: flag, key: mianfu, operator: absent}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
      - {not: {kind: flag, key: "memorial:t17_mianfu_hubu", operator: exists}}
  proposal: mianfu
  keywords: [免夫钱, 财赋, 王黼, 燕山]
  advisors:
    - {character: wang_fu, stance: support, option: mianfu, requires: {office: [taizai, shaozai]}, line: 燕山既复，岁费浩繁。取之于丁夫，人出无几而国用自足——此恢复故疆之费，百姓岂有不乐输者？}
    - {character: cai_jing, stance: neutral, option: half, line: 钱可取，民不可尽。饥荒之路蠲之，余路减半，庶几两全。老臣行钞法数十年，深知取民不可过急。}
    - {character: chen_dong, stance: oppose, option: thrift, requires: {region: bianjing}, line: 学生斗胆！河北之民父子相食，而朝廷犹按户索钱，是驱民为盗也！}
  options:
    - id: mianfu
      label: 照准，诸路并纳免夫钱
      ops:
        - {op: set_flag, key: mianfu, value: true}
        - {op: adjust_resource, resource: treasury, delta: 220, reason: 免夫钱}
        - {op: adjust_resource, resource: morale, delta: -6, reason: 括丁夫纳钱，天下骚然}
        - {op: adjust_resource, resource: dongnan, delta: 4, reason: 东南亦括免夫钱}
        - {op: adjust_resource, resource: corruption, delta: 3, reason: 州县缘此为奸}
      hint: 国库 +220；民心 −6，东南民怨 +4，吏治积弊 +3
    - id: half
      label: 蠲河北、京东，余路减半征之
      ops:
        - {op: set_flag, key: mianfu, value: half}
        - {op: adjust_resource, resource: treasury, delta: 100, reason: 免夫钱（减半，蠲饥荒之路）}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 诸路括丁夫纳钱}
        - {op: adjust_resource, resource: dongnan, delta: 2, reason: 东南亦括免夫钱}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 州县缘此为奸}
      hint: 国库 +100；民心 −2，东南民怨 +2，吏治积弊 +1
    - id: thrift
      label: 不行免夫钱，减宫中用度、出内帑以充边费
      ops:
        - {op: adjust_resource, resource: treasury, delta: 40, reason: 出内帑助边费}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 宫中减省}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 王黼之议不行}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 罢括丁夫之议}
        - {op: adjust_trait, character: wang_fu, trait: favor, delta: -1}
      hint: 国库 +40（内帑），君威 −1，佞幸 −2，民心 +1；王黼不悦

