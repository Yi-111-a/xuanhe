      hint: 吏治积弊 +1；本条四季后再议

- id: s_taixue
  title: 太学议政
  summary: 太学诸生聚议时政，书生上书者日众，言应奉、边事、宰执之失，辞多激切。或请许其上书、下诏求直言，或请禁太学妄议。
  region: bianjing
  illustration: event.chen_dong
  conditions: {kind: turn, operator: gte, value: 6}
  proposal: frank
  keywords: [太学, 言路, 陈东]
  advisors:
    - {character: chen_dong, stance: support, option: frank, requires: {region: bianjing}, line: 学生斗胆！诸生所言，皆天下所欲言而不敢言者。塞其口，则天下之口皆塞矣！}
    - {character: liang_shicheng, stance: oppose, option: ban, requires: {office: yubi}, line: 一群毛头书生，懂得什么朝政？官家不理他们，他们反倒越说越来劲。}
    - {character: zhao_huan, stance: neutral, option: allow, requires: {office: crown_prince}, line: 此等事，儿臣不敢专。只是……祖宗以来，不以言罪人。}
  options:
    - id: frank
      label: 下诏求直言
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 言路大开}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 言者纠弹}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 群言纷起}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 佞幸 −2，吏治积弊 −1，君威 −1；本条五季后再议
    - id: allow
      label: 许诸生上书，不加罪
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 言路稍开}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 士论稍平}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 佞幸 −1，民心 +1；本条五季后再议
    - id: ban
      label: 禁太学妄议时政
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 禁太学妄议}
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 言路壅塞}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 士论不平}
        - {op: start_project, name: 言路勘会, region: bianjing, cost_per_turn: {}, turns: 5, on_complete: [{op: set_flag, key: "memorial:s_taixue", value: null}]}
      hint: 君威 +1，佞幸 +1，民心 −1；本条五季后再议

- id: s_zhaijiao
  title: 宫观斋醮
  summary: 道录院奏：天下神霄玉清万寿宫岁费不赀，又请于上清宝箓宫设大斋醮，度道士、赐田产。言者谓宫观之费，夺民之食。
