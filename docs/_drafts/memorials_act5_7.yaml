      - {kind: flag, key: jin_warning, value: true}
      - {kind: office_holder, office: hebei_xuanfu, character: tong_guan}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: character_status, character: zhong_shidao, value: alive}
      - {kind: character_status, character: zong_ze, value: alive}
      - {kind: character_status, character: zhang_shuye, value: alive}
      - {not: {kind: flag, key: "memorial:t_hebei_shuai", operator: exists}}
  proposal: zhong_lead
  keywords: [河北, 宣抚, 童贯, 择帅]
  advisors:
    - {character: tong_guan, stance: oppose, option: keep, line: 老奴在河北经营数年，金人若来，老奴自有方略。临敌易帅，兵家大忌！}
    - {character: ma_kuo, stance: support, option: zhong_lead, requires: {region: bianjing}, line: 西军宿将，唯种师道老成知兵。以之代童贯，金人亦当知所畏。}
