        - {op: adjust_region, region: xibian, stat: defense, delta: -3}
      hint: 分兵 20000 编为「泾原戍太原军」赴河东协守（行程见回执），余部留西边；西北边防务 −3
    - id: keep
      label: 西军留镇，以备夏人
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和七年，西军东调之议未行}
      hint: 无增减

# 河北择帅：宣抚使出缺，或童贯在任。种师道、宗泽、张叔夜三人须在世（任命方合法）。
- id: t_hebei_shuai
  title: 河北择帅
  summary: 河北河东宣抚使之位久无人主，河北禁军不习战阵。金人治兵于平州、云中，枢密院请择宿将宣抚河北，以当东路之冲。
  region: hebei_xi
  illustration: event.jinjun_review
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: office_holder, office: hebei_xuanfu, character: null}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: character_status, character: zhong_shidao, value: alive}
      - {kind: character_status, character: zong_ze, value: alive}
      - {kind: character_status, character: zhang_shuye, value: alive}
      - {not: {kind: flag, key: "memorial:t_hebei_shuai_tong", operator: exists}}
  proposal: zhong_lead
  keywords: [河北, 宣抚, 择帅, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: zhong_lead, requires: {region: bianjing}, line: 西军宿将，唯种师道老成知兵。以之宣抚河北，金人亦当知所畏。}
    - {character: chen_dong, stance: support, option: zong, requires: {region: bianjing}, line: 宗泽刚直，忧国如家，虽在编管，天下称其忠。起之，河北之民必争附之！}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 无事置帅，倒像是要打仗。金人看见了，反倒多心。}
  options:
    - id: zhong_lead
      label: 以种师道宣抚河北，统河北西路禁军
      memory: {character: zhong_shidao, text: 宣和七年，奉命宣抚河北，以备金人}
      ops:
        - {op: appoint, character: zhong_shidao, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 宿将宣抚河北}
      hint: 种师道启程赴河北西路（行程见回执），到任即统河北西路禁军；泾原军由副将暂摄；武备 +2
    - id: zong
      label: 起宗泽宣抚河北
      memory: {character: zong_ze, text: 宣和七年，陛下起臣于编管之中，宣抚河北}
      ops:
        - {op: appoint, character: zong_ze, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 起宗泽宣抚河北}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 河北之民闻宗泽起用}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 起用正人}
      hint: 宗泽自京东赴河北西路（行程见回执），到任即统河北西路禁军；武备 +1，民心 +1，佞幸 −1
    - id: zhang
      label: 以张叔夜宣抚河北
      memory: {character: zhang_shuye, text: 宣和七年，奉命宣抚河北}
      ops:
        - {op: appoint, character: zhang_shuye, office: hebei_xuanfu, dispatch: true}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 张叔夜宣抚河北}
      hint: 张叔夜赴河北西路（行程见回执），到任即统河北西路禁军；武备 +1
    - id: keep
      label: 暂不置帅
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和七年，河北择帅之议未行}
      hint: 无增减；河北西路禁军仍无统帅

