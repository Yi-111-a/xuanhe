  advisors:
    - {character: zhong_shidao, stance: neutral, option: detach, requires: {region: xibian}, line: （自泾原驰表）全军东调则西边空虚；分兵守太原，余众留镇，进退皆有余地。}
    - {character: tong_guan, stance: oppose, option: keep, line: 西军是老奴一手带出来的，动一兵一卒都要细细斟酌，不可轻调。}
    - {character: ma_kuo, stance: support, option: march, requires: {region: bianjing}, line: 金人若来，必先河东、河北。西军在渭州，千里之外，缓急不及。}
  options:
    - id: march
      label: 泾原军整军移屯关中
      ops:
        - {op: march, army: xijun_jingyuan, to_region: guanzhong, with_commander: true}
        - {op: adjust_region, region: xibian, stat: defense, delta: -6}
      hint: 泾原军整军移屯关中（统帅在军者随行，行程见回执），距汴京、河东皆近；西北边防务 −6
    - id: detach
