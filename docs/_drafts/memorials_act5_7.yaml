- id: t17_hebei_famine
  turn: 17
  expires_after: 1
  title: 河北京东饥
  summary: 河北、京东连岁水旱，又困于燕山馈运，流民塞道，父子相食者有之；饥民啸聚，群盗因之而起。两路转运司请发常平仓赈济，或请蠲租。
  region: hebei_dong
  illustration: event.famine
  conditions: {kind: flag, key: hebei_famine, value: true}
  proposal: relief
  keywords: [河北, 京东, 饥荒, 赈济]
  advisors:
    - {character: zhang_shuye, stance: support, option: relief, requires: {region: jingdong}, line: （自海州驰奏）京东饥民日以千计南来，州县仓廪已空。早赈一日，少一千人为盗。}
    - {character: li_gang, stance: support, option: remit, requires: {region: bianjing}, line: 河北之饥，半由天灾，半由馈运。蠲其租、罢其役，然后民可复业。}
    - {character: wang_fu, stance: oppose, option: strict, requires: {office: [taizai, shaozai]}, line: 赈之则仓廪空，蠲之则边费缺。令州县严捕盗贼，饥民自然安分。}
  options:
    - id: relief
      label: 发常平仓并内藏钱，赈济两路
      ops:
        - {op: adjust_resource, resource: grain, delta: -80, reason: 赈河北京东}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 赈河北京东}
        - {op: adjust_resource, resource: morale, delta: 4, reason: 赈饥}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 6}
        - {op: adjust_region, region: jingdong, stat: order, delta: 6}
      hint: 粮储 −80，国库 −40；民心 +4，河北东路、京东治安各 +6
    - id: remit
      label: 蠲两路本年租赋，罢燕山馈运之役
      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 蠲河北京东租赋}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 蠲赋罢役}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 4}
        - {op: adjust_region, region: jingdong, stat: order, delta: 3}
        - {op: adjust_region, region: hebei_dong, stat: prosperity, delta: 3}
      hint: 国库 −60；民心 +3，河北东路治安 +4、繁荣 +3，京东治安 +3
    - id: strict
      label: 令州县严捕盗贼，赈济从缓
      ops:
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 3}
        - {op: adjust_region, region: jingdong, stat: order, delta: 3}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 饥而不赈}
      hint: 河北东路、京东治安各 +3，民心 −2；钱粮不费

- id: t17_xixia
  turn: 17
  expires_after: 1
  title: 西夏附金
  summary: 夏国遣使奉表称藩于金。泾原、秦凤诸路奏：夏人既得金援，边寨或将多事；西军东调之议，须更审处。
  region: xibian
  illustration: event.xixia
  conditions: {kind: flag, key: "event:xixia_submits:fired", operator: exists}
  proposal: fortify
  keywords: [西夏, 西军, 堡寨]
  advisors:
    - {character: zhong_shidao, stance: support, option: fortify, requires: {region: xibian}, line: （自泾原驰表）夏人反覆，向来视强弱为去就。今附于金，西边不可无备；堡寨坚，则西军可以放心东顾。}
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 夏人图的不过是银绢。给他些便是，省得两头生事。}
