  illustration: event.chen_dong
  conditions:
    all:
      - {kind: turn, operator: gte, value: 20}
      - {kind: character_status, character: chen_dong, value: alive}
      - {kind: character_region, character: chen_dong, region: bianjing}
      - {kind: office_holder, office: taishi, character: cai_jing}
      - any:
          - {kind: flag_age, key: "memorial:t_chendong_wangfu", operator: gte, value: 1}
          - all:
              - {not: {kind: office_holder, office: taizai, character: wang_fu}}
              - {not: {kind: office_holder, office: shaozai, character: wang_fu}}
              - {kind: flag, key: "memorial:t_chendong_wangfu", operator: absent}
  proposal: punish
  keywords: [陈东, 六贼, 蔡京, 太学]
  advisors:
    - {character: chen_dong, stance: support, option: punish, line: 学生斗胆！今日天下之祸，其源皆出于蔡京。丰亨豫大之说一倡，而花石、应奉、聚敛相继而起！}
    - {character: cai_you, stance: oppose, option: keep, line: 家父辅政数十年，几个书生懂什么？背后定有人指使。}
    - {character: li_gang, stance: neutral, option: dismiss, requires: {region: bianjing}, line: 蔡京老矣，罢之足矣。窜逐老臣，于国无益。}
  options:
    - id: punish
      label: 罢蔡京，窜之远方
      ops:
        - {op: set_flag, key: cai_dismissed, value: true}
        - {op: set_character_status, character: cai_jing, status: exiled, cause: 为太学生所论，窜逐远方}
        - {op: adjust_resource, resource: ningxing, delta: -6, reason: 窜蔡京}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 从谏去奸}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 都人称快}
      hint: 蔡京窜逐，太师之位空出；佞幸 −6，君威 +1，民心 +1
    - id: dismiss
      label: 令蔡京致仕
      ops:
        - {op: set_flag, key: cai_dismissed, value: true}
        - {op: set_character_status, character: cai_jing, status: retired, cause: 为太学生所论，致仕}
        - {op: adjust_resource, resource: ningxing, delta: -4, reason: 蔡京去位}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 从谏}
      hint: 蔡京致仕，太师之位空出；佞幸 −4，君威 +1
    - id: keep
      label: 书入不报
      ops:
        - {op: adjust_resource, resource: authority, delta: -1, reason: 拒谏}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 太学之议沸腾}
      hint: 君威 −1，民心 −1

