- id: t_war_huashi_half
  title: 尽罢花石
  summary: 金兵南下，言者交章：花石纲虽已减半，扰民犹在，今日人心离散，皆由于此。请尽罢诸局，以收天下之心。
  region: liangzhe
  illustration: event.huashi
  variant_of: t_war_huashi
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: huashi_abolished, operator: absent}
      - {kind: flag, key: huashi_halved, value: true}
      - {not: {kind: character_status, character: zhu_mian, value: dead}}
      - {not: {kind: flag, key: "memorial:t_war_huashi", operator: exists}}
  proposal: abolish
  keywords: [花石, 应奉, 朱勔, 人心]
  advisors:
    - {character: chen_dong, stance: support, option: punish, requires: {region: bianjing}, line: 学生斗胆！减其半，民犹怨其半。尽罢之，并罪朱勔，然后人心可收！}
    - {character: li_gang, stance: support, option: abolish, requires: {region: bianjing}, line: 罢花石一诏，胜于十万之师。今日不罢，更待何时？}
    - {character: liang_shicheng, stance: oppose, option: keep, requires: {office: yubi}, line: 已经减了一半，还要怎样？园子里那些东西，又碍不着打仗。}
  options:
    - id: abolish
      label: 尽罢花石纲及诸局
      ops:
        - {op: set_flag, key: huashi_abolished, value: true}
        - {op: cancel_ledger, ledger_id: yingfeng_half}
        - {op: adjust_resource, resource: dongnan, delta: -5, reason: 尽罢花石}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 罢扰民之政}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢应奉诸局}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罢扰民之政}
      hint: 每季再省 9 万缗；东南民怨 −5，民心 +2，佞幸 −2，君威 +1
    - id: punish
      label: 尽罢花石，并窜朱勔
      ops:
        - {op: set_flag, key: huashi_abolished, value: true}
        - {op: set_flag, key: zhumian_dismissed, value: true}
        - {op: cancel_ledger, ledger_id: yingfeng_half}
        - {op: set_character_status, character: zhu_mian, status: exiled, cause: 金兵南下，以花石之祸窜逐}
        - {op: adjust_resource, resource: dongnan, delta: -9, reason: 尽罢花石，窜朱勔}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 罪魁伏法}
        - {op: adjust_resource, resource: ningxing, delta: -5, reason: 窜朱勔}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 罢扰民之政}
      hint: 每季再省 9 万缗；朱勔窜逐；东南民怨 −9，民心 +3，佞幸 −5，君威 +1
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: chen_dong, fact: 金兵南下，请尽罢花石，不报}
      hint: 无增减

- id: t_jin_again
  title: 金人再来
  summary: 金人以宋不交三镇为辞，再分两路南下，河北、河东告急之书一日数至。百官或请修城坚守，或请车驾南幸。
  region: bianjing
  illustration: event.jin_invasion
  conditions:
    all:
      - {kind: flag, key: jin_returned, value: true}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: flag, key: court_south, operator: absent}
      - {kind: character_region, character: zhao_ji, region: bianjing}
  proposal: fortify
  keywords: [背约, 守城, 南幸, 三镇]
  advisors:
    - {character: li_gang, stance: support, option: fortify, requires: {region: bianjing}, line: 金人之来，在臣意中。城下之约本不可恃，今日惟有修城坚守、再召勤王而已。}
    - {character: li_bangyan, stance: oppose, option: south, requires: {region: bianjing}, line: 上回是侥幸，这回可没那么好运了。陛下还是往东南去吧。}
    - {character: chen_dong, stance: support, option: defend, requires: {region: bianjing}, line: 学生斗胆！陛下当亲登城楼，与都人共守，则人人效死！}
  options:
    - id: fortify
      label: 修汴京城守（两季）
      ops:
        - op: start_project
          name: 再修汴京城守
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 2
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 15}
      hint: 国库每季 −50 共两季；成后汴京防务 +15
    - id: defend
      label: 亲登城楼，下诏与都人共守
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 天子登城}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 天子登城}
        - {op: adjust_army, army: jinjun, quality_delta: 0.05, reason: 天子登城，士气稍振}
      hint: 君威 +2，民心 +3，京师禁军素质 +0.05
    - id: south
      label: 车驾南幸江南
      ops:
        - {op: set_flag, key: court_south, value: true}
        - {op: move_character, character: zhao_ji, to_region: jiangnan}
        - {op: adjust_resource, resource: authority, delta: -6, reason: 车驾南幸}
        - {op: adjust_resource, resource: morale, delta: -5, reason: 京师人心惶惑}
        - {op: adjust_region, region: bianjing, stat: order, delta: -10}
      hint: 车驾启程赴江南（行程见回执）；君威 −6，民心 −5，汴京治安 −10；此后汴京陷落，或至宣和八年冬河东、河北西路有失，即「衣冠南渡」

# ---- 兵退之后（金军败退或退师）----
- id: t_war_anji
  title: 兵后安辑
  summary: 金军既退，所过州县室庐焚毁，田野荒芜，流民未复。河北、京西诸路请遣使安辑，或请蠲免租赋。
  region: hebei_xi
  illustration: event.famine
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, value: true}
  proposal: relief
  keywords: [安辑, 赈济, 河北, 善后]
  advisors:
    - {character: li_gang, stance: support, option: relief, requires: {region: bianjing}, line: 兵后之民，如大病初起，宜先养之。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 府库都空了，安辑的钱从哪里来？让他们自己慢慢缓过来吧。}
  options:
    - id: relief
      label: 遣使安辑，发仓赈给流民
      ops:
        - {op: adjust_resource, resource: grain, delta: -80, reason: 兵后赈给}
        - {op: adjust_resource, resource: morale, delta: 4, reason: 安辑流民}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 8}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 6}
      hint: 粮储 −80；民心 +4，河北西路治安 +8、河北东路治安 +6
    - id: remit
      label: 蠲被兵州县租赋一年
      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 蠲被兵州县租赋}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 蠲赋}
        - {op: adjust_region, region: hebei_xi, stat: prosperity, delta: 4}
        - {op: adjust_region, region: jingxi, stat: prosperity, delta: 3}
      hint: 国库 −60；民心 +3，河北西路繁荣 +4、京西繁荣 +3
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: li_gang, fact: 金军退后，安辑之议未行}
      hint: 无增减

- id: t_war_lungong
  title: 论功行赏
  summary: 金军退去，守城、勤王、劫营诸将士请叙功。或请厚赏以励将来，或请赏而有节、以纾府库。
  region: bianjing
  illustration: event.qinwang
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, value: true}
      - any:
          - {kind: flag, key: qinwang, value: true}
          - {kind: flag, key: ligang_defense, value: true}
          - {kind: flag, key: jieying_done, value: true}
  proposal: reward
  keywords: [论功, 行赏, 将士]
  advisors:
    - {character: zhong_shidao, stance: neutral, option: reward, requires: {region: bianjing}, line: 将士之功，请陛下厚赏；老臣一身之爵，不敢多求。}
    - {character: li_bangyan, stance: oppose, option: modest, requires: {region: bianjing}, line: 赏是该赏，可金帛都给了金人，拿什么赏？意思意思便罢。}
  options:
    - id: reward
      label: 厚赏守城、勤王将士
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 赏功}
        - {op: adjust_resource, resource: wubei, delta: 3, reason: 赏罚分明，将士用命}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 赏罚分明}
      hint: 国库 −80，武备 +3，君威 +2
    - id: modest
      label: 赏而有节，以纾府库
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 赏功}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 赏功}
      hint: 国库 −30，武备 +1
    - id: keep
      label: 待事定再议
      ops:
        - {op: adjust_resource, resource: wubei, delta: -2, reason: 有功不赏，将士解体}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 有功不赏}
      hint: 武备 −2，民心 −1

- id: t_war_beibei
  title: 善后边备
  summary: 金军虽退，太原、真定诸城经兵残破，河北禁军十不存五。枢密院请修北边诸城、补河北戍兵，以备金人再来。
  region: hedong
  illustration: event.jinjun_review
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, value: true}
      - {kind: region_controller, region: hedong, faction: song}
      - {kind: region_controller, region: hebei_xi, faction: song}
  proposal: fortify
  keywords: [边备, 太原, 真定, 武备]
  advisors:
    - {character: zhang_xiaochun, stance: support, option: fortify, requires: {region: hedong}, line: （自太原驰奏）金人此去，必复再来。城不修、粮不积，下次便守不住了。}
    - {character: ma_kuo, stance: support, option: garrison, requires: {region: bianjing}, line: 河北之兵经此一役，所存无几。不补其额，金人再来，河北无一可战之兵。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 金人既已退去，又修城又募兵，倒像是要跟人家没完。}
  options:
    - id: fortify
      label: 修太原、真定诸城（两季）
      ops:
        - op: start_project
          name: 修北边诸城
          region: hedong
          cost_per_turn: {treasury: 50}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 10}
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 10}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 北边诸城修治}
      hint: 国库每季 −50 共两季；成后河东、河北西路防务各 +10，武备 +2
    - id: garrison
      label: 募兵一万五千补河北西路禁军
      ops:
        - {op: adjust_army, army: hebei_army, delta: 15000, reason: 补河北戍兵}
        - {op: adjust_resource, resource: treasury, delta: -45, reason: 募兵安家钱}
        - {op: adjust_resource, resource: wubei, delta: 2, reason: 河北补兵}
      hint: 河北西路禁军 +15000（素质不变），国库 −45，武备 +2；此后养兵每季 +4.5 万缗、粮 +1.8 万石
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: 金军退后，边备之议未行}
      hint: 无增减

