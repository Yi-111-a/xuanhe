- id: t_zhang_qinwang
  title: 张叔夜勤王
  summary: 金兵南下，京畿兵少。张叔夜自京东上书，请募京东之兵入卫京师；或言京东当金人东路之侧，宜留叔夜守之，以掣其后。
  region: jingdong
  illustration: event.qinwang
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: character_status, character: zhang_shuye, value: alive}
      - {kind: character_region, character: zhang_shuye, region: jingdong}
