        - {op: adjust_region, region: xibian, stat: defense, delta: -3}
      hint: 分兵 20000 编为「秦凤戍太原军」赴河东协守（行程见回执），余部留西边；西北边防务 −3
    - id: keep
      label: 西军留镇，以备夏人
      ops:
        - {op: remember, character: zhong_shizhong, fact: 宣和七年，西军东调之议未行}
      hint: 无增减

