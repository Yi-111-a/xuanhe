# ---- 劫营之议：泾原军已入京、姚平仲在京、金东路军近城 ----
- id: t_jieying
  title: 劫营之议
  summary: >-
    西军既入京城，金人东路屯于城北。姚平仲请乘夜劫营，生擒斡离不；种师道以为不如坚壁以待其师老——金人掠野无所得，
    河北义兵抄其粮道，不出数月必退。
  region: bianjing
  illustration: event.bianjing_siege
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: bianjing_besieged, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: flag, key: jieying, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: army_region, army: xijun_jingyuan, region: bianjing}
      - {kind: army_strength, army: xijun_jingyuan, operator: gte, value: 15000}
      - {kind: character_status, character: yao_pingzhong, value: alive}
      - {kind: character_region, character: yao_pingzhong, region: bianjing}
      - {kind: army_strength, army: jin_east, operator: gte, value: 30000}
      - any:
          - {kind: army_region, army: jin_east, region: hebei_xi}
          - {kind: army_region, army: jin_east, region: bianjing}
  proposal: jieying
  keywords: [劫营, 姚平仲, 种师道, 汴京]
  advisors:
    - {character: yao_pingzhong, stance: support, option: jieying, requires: {region: bianjing}, line: 给末将精骑一万，乘夜劫营，必擒其帅以献！金人远来疲敝，正是可击之时。}
    - {character: zhong_shidao, stance: oppose, option: hold, requires: {region: bianjing}, line: 兵者凶事。金人虽疲，营垒犹整，夜袭万一不克，城中锐气尽矣。坚壁以待其自疲，一击可也。}
    - {character: li_gang, stance: neutral, option: hold, requires: {region: bianjing}, line: 奇兵可用，然不可孤注。臣以为当听种师道持重之议。}
  options:
    - id: jieying
      label: 许姚平仲乘夜劫营
      ops:
        - {op: set_flag, key: jieying, value: true}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 劫营赏格}
      hint: 国库 −20（赏格）；成败未卜——得手则金东路军折二万；不克则泾原军折一万、姚平仲恐将出奔（本游戏设定：得手约四成）
    - id: hold
      label: 从种师道之议，坚壁以待其师老
      ops:
        - {op: set_army_posture, army: xijun_jingyuan, posture: hold, reason: 坚壁不战}
      hint: 泾原军取坚守之势（作守方战力 +20%，不主动出击）；金军围城日久而京城不下，则师老粮匮、逐季折损

# ---- 城下之盟 ----
- id: t_chengxia
  title: 城下之盟
  summary: >-
    金人遣使入城，索金五百万两、银五千万两、牛马万头、表段百万匹，尊金主为伯父，以亲王、宰相为质，并求割太原、中山、河间三镇，
    许则退师。宰执多主和议；言者谓三镇乃国家屏蔽，割之则河北、河东不可守。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: bianjing_besieged, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: flag, key: sanzhen_ceded, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
  proposal: cede
  keywords: [议和, 割地, 三镇, 城下之盟]
  advisors:
    - {character: li_bangyan, stance: support, option: cede, requires: {region: bianjing}, line: 金帛是身外之物，三镇是远地。先把金人送走，京城保住了，什么都好说。}
    - {character: li_gang, stance: oppose, option: defend, requires: {region: bianjing}, line: 三镇，国之屏蔽，割之何以立国？金帛之数，竭天下不能给。坚守待勤王之师，金人必退！}
    - {character: zhong_shidao, stance: oppose, option: defend, requires: {region: bianjing}, line: 金人孤军深入，利在速战。坚守不与之战，其粮尽自退，何必割地？}
    - {character: cai_jing, stance: neutral, option: stall, line: 老臣以为，金帛可与，地不可割。遣使往来，且与周旋，以待其变。}
  options:
    - id: cede
      label: 许割三镇，输金帛以求退师
      ops:
        - {op: set_flag, key: sanzhen_ceded, value: true}
        - {op: set_flag, key: jin_withdrawn, value: true}
        - {op: adjust_relation, a: song, b: jin, delta: 150}
        - {op: adjust_relation, a: jin, b: song, delta: 150}
        # 金军此时多半正向汴京行军（途中不能调遣）：以两季的「金军解围北还」工程待其抵营后再令北还
        # （结算中工程先于行军抵达、先于事件；已在原地者竣工时该条不执行，无害）。
        - op: start_project
          name: 金军解围北还
          region: bianjing
          cost_per_turn: {}
          turns: 2
          on_complete:
            - {op: move_army, army: jin_west, to_region: yunzhong}
            - {op: move_army, army: jin_east, to_region: pingzhou}
        - {op: adjust_resource, resource: treasury, delta: -500, reason: 输金帛以求退师}
        - {op: adjust_resource, resource: authority, delta: -8, reason: 城下之盟}
        - {op: adjust_resource, resource: morale, delta: -3, reason: 割地之辱}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 主和者得志}
      hint: 金人罢攻，两路解围北还（两季内退回云中、平州，此间与宋不复交兵）；国库 −500，君威 −8，民心 −3，佞幸 +2。三镇交割之议随后另奏——许而不交，金人必以背约再来
    - id: defend
      label: 不许割地，坚守以待勤王
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 不屈城下}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 不屈城下}
      hint: 君威 +2，民心 +1；金军仍在城下
    - id: stall
      label: 遣使往来议和，以缓其攻
      ops:
        - {op: adjust_resource, resource: treasury, delta: -120, reason: 犒师金帛}
        - {op: adjust_resource, resource: authority, delta: -2, reason: 遣使乞和}
        - {op: adjust_army, army: jin_east, delta: -5000, reason: 和议往还，久屯城下，疾疫逃亡}
        - {op: adjust_army, army: jin_west, delta: -3000, reason: 和议往还，久屯城下，疾疫逃亡}
      hint: 国库 −120（犒师金帛），君威 −2；和议往还之间金军久屯，疾疫逃亡，东路 −5000、西路 −3000（本游戏设定）；金人仍未退

- id: t_sanzhen
  title: 三镇交割
  summary: 金人遣使来趣交割太原、中山、河间三镇。三镇军民闻割地，皆不肯从，守臣上章请以死守。朝廷许之于城下，今当何如？
  region: hebei_xi
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: sanzhen_ceded, value: true}
      - {kind: flag_age, key: sanzhen_ceded, operator: gte, value: 1}
      - {kind: flag, key: sanzhen_delivered, operator: absent}
      - {kind: flag, key: jin_returned, operator: absent}
  proposal: deliver
  keywords: [三镇, 割地, 交割, 议和]
  advisors:
    - {character: li_bangyan, stance: support, option: deliver, requires: {region: bianjing}, line: 白纸黑字都写了，不交，金人又要来。交了，大家安生。}
    - {character: li_gang, stance: oppose, option: refuse, requires: {region: bianjing}, line: 城下之约，出于胁迫，非陛下本心。三镇之民愿死守，朝廷岂可弃之？}
    - {character: zhang_xiaochun, stance: oppose, option: refuse, requires: {region: hedong}, line: （自太原驰奏）太原军民皆曰宁死不为金人之民。臣与王禀当与城存亡。}
    - {character: cai_jing, stance: neutral, option: ransom, line: 地不可与，信亦不可失。以金帛代地，或可两全。}
  options:
    - id: deliver
      label: 诏三镇守臣交割
      ops:
        - {op: set_flag, key: sanzhen_delivered, value: true}
        - {op: set_region_controller, region: hedong, faction: jin}
        - {op: set_region_controller, region: hebei_xi, faction: jin}
        - {op: set_region_controller, region: hebei_dong, faction: jin}
        - {op: adjust_resource, resource: authority, delta: -4, reason: 割三镇}
        - {op: adjust_resource, resource: morale, delta: -4, reason: 弃三镇之民}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋割地以求和}
        - {op: adjust_resource, resource: nanmu, delta: -10, reason: 金人得地而退}
      hint: 河东、河北西路、河北东路归金（三路税入不复归宋）；君威 −4，民心 −4，金人轻宋（风闻）↑，胡马南牧（风闻）↓
    - id: refuse
      label: 诏三镇固守，不交
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 不弃三镇}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 三镇之民感奋}
      hint: 君威 +2，民心 +2；金人必以背约为辞，不久再度南下
    - id: ransom
      label: 遣使以金帛代三镇之地
      ops:
        - {op: set_flag, key: sanzhen_delivered, value: ransom}
        - {op: set_flag, key: sanzhen_ransomed, value: true}
        - {op: adjust_resource, resource: treasury, delta: -300, reason: 以金帛代三镇}
        - {op: add_ledger, id: zengbi_jin, name: 增岁币（金）, category: treasury, amount: -15, kind: recurring, reason: 以金帛代三镇之地（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: authority, delta: -2, reason: 增币事金}
        - {op: adjust_resource, resource: jin_contempt, delta: 4, reason: 宋以金帛求免}
      hint: 国库 −300，此后每季另输增岁币 15 万缗；君威 −2，金人轻宋（风闻）↑；三镇得存，交割之事了结（本游戏设定：金人受之）

# ---- 太原 ----
- id: t_jiu_taiyuan
  title: 救太原
  summary: 宗翰围太原，筑长围、列炮座，昼夜攻城。太原守臣登陴固守，缒城告急。或请发秦凤熙河军赴河东解围，或请令太原坚守、援兵专卫京师。
  region: hedong
  illustration: event.taiyuan_siege
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: taiyuan_besieged, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: region_controller, region: hedong, faction: song}
      - {kind: army_strength, army: hedong_army, operator: gt, value: 0}
      - {kind: army_strength, army: xijun_qinfeng, operator: gte, value: 25000}
      - {kind: army_region, army: xijun_qinfeng, operator: ne, region: hedong}
      - {not: {kind: flag, key: "memorial:t_jiu_taiyuan_yx", operator: exists}}
  proposal: march
  keywords: [太原, 河东, 种师中, 救援]
  advisors:
    - {character: zhong_shizhong, stance: support, option: march, requires: {region: [xibian, guanzhong, bianjing]}, line: 末将愿往！太原一失，河东便没了，京城也危。}
    - {character: zhang_xiaochun, stance: support, option: detach, requires: {region: hedong}, line: （自太原缒城告急）城中粮储可支数月，守具已修。得援兵二万，内外夹击，长围可破。}
    - {character: li_bangyan, stance: oppose, option: defend, requires: {region: bianjing}, line: 太原那么远，先顾着京城要紧。太原城坚，叫他们自己守着。}
  options:
    - id: march
      label: 秦凤熙河军整军赴河东解围
      ops:
        - {op: march, army: xijun_qinfeng, to_region: hedong, with_commander: true}
      hint: 秦凤熙河军整军赴河东（统帅在军者随行，行程见回执），到即与围城金军交战；京城少一支援兵
    - id: detach
      label: 分秦凤兵二万赴河东
      ops:
        - {op: detach, army: xijun_qinfeng, strength: 20000, to_region: hedong, new_army_name: 河东援军}
      hint: 分兵 20000 编为「河东援军」赴河东（行程见回执），余部留原地
    - id: defend
      label: 令太原坚守，援兵专卫京师
      ops:
        - {op: set_army_posture, army: hedong_army, posture: hold, reason: 坚守待援}
      hint: 河东军取坚守之势（作守方战力 +20%，不主动出击）；太原防务 ≥ 80 时攻者须倍众方能克之

- id: t_jiu_taiyuan_yx
  title: 救太原
  summary: 宗翰围太原，筑长围、列炮座，昼夜攻城。太原守臣登陴固守，缒城告急。西军不能分兵，或请发关中永兴军赴河东，或请令太原坚守。
  region: hedong
  illustration: event.taiyuan_siege
  variant_of: t_jiu_taiyuan
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: taiyuan_besieged, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: region_controller, region: hedong, faction: song}
      - {kind: army_strength, army: hedong_army, operator: gt, value: 0}
      - {not: {all: [{kind: army_strength, army: xijun_qinfeng, operator: gte, value: 25000}, {kind: army_region, army: xijun_qinfeng, operator: ne, region: hedong}]}}
      - {kind: army_strength, army: guanzhong_army, operator: gte, value: 10000}
      - {kind: army_region, army: guanzhong_army, operator: ne, region: hedong}
      - {not: {kind: flag, key: "memorial:t_jiu_taiyuan", operator: exists}}
  proposal: march
  keywords: [太原, 河东, 永兴军, 救援]
  advisors:
    - {character: zhang_xiaochun, stance: support, option: march, requires: {region: hedong}, line: （自太原缒城告急）城中粮储可支数月。得援兵一至，内外夹击，长围可破。}
    - {character: li_bangyan, stance: oppose, option: defend, requires: {region: bianjing}, line: 太原那么远，先顾着京城要紧。太原城坚，叫他们自己守着。}
  options:
    - id: march
      label: 永兴军整军赴河东解围
      ops:
        - {op: march, army: guanzhong_army, to_region: hedong, with_commander: true}
      hint: 永兴军整军赴河东（行程见回执），到即与围城金军交战；关中空虚
    - id: defend
      label: 令太原坚守待援
      ops:
        - {op: set_army_posture, army: hedong_army, posture: hold, reason: 坚守待援}
      hint: 河东军取坚守之势（作守方战力 +20%，不主动出击）；太原防务 ≥ 80 时攻者须倍众方能克之

- id: t_taiyuan_lost
  title: 太原既陷
  summary: 太原城陷，河东诸州相继不守，金西路兵锋直指河阳、洛阳。或请急修京西河阳守备、扼守黄河，或请收恤河东溃兵流民。
  region: jingxi
  illustration: event.taiyuan_siege
  conditions:
    all:
      - {kind: flag, key: taiyuan_fallen, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: region_controller, region: jingxi, faction: song}
  proposal: fortify
  keywords: [太原, 河阳, 京西, 守河]
  advisors:
    - {character: li_gang, stance: support, option: fortify, requires: {region: bianjing}, line: 河阳桥者，京西之咽喉。扼之，则粘罕之兵不得渡河。}
    - {character: chen_dong, stance: support, option: relief, requires: {region: bianjing}, line: 河东之民扶老携幼而南，朝廷不收，则皆为金人所驱矣。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 太原都丢了，河阳还守得住？省些钱粮，留着议和用。}
  options:
    - id: fortify
      label: 急修京西河阳守备，扼守黄河
      ops:
        - {op: adjust_region, region: jingxi, stat: defense, delta: 15}
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 急修河阳守备}
      hint: 京西防务 +15，国库 −50
    - id: relief
      label: 收恤河东溃兵流民
      ops:
        - {op: adjust_resource, resource: grain, delta: -40, reason: 收恤河东流民}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 收恤河东溃兵}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 收恤流民}
      hint: 粮储 −40，国库 −20，民心 +2
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: li_gang, fact: 太原陷，朝廷未有处置}
      hint: 无增减

# ---- 南幸之后：东京留守、行在东南 ----
- id: t_liushou
  title: 东京留守
  summary: 车驾南幸，东京不可无主。宰执请择留守：李纲忠勇知兵，可付城守；或以皇太子监国留守，以系人心；或一依殿前司。
  region: bianjing
  illustration: event.ligang_defense
  conditions:
    all:
      - {kind: flag, key: court_south, value: true}
      - {kind: region_controller, region: bianjing, faction: song}
      - {kind: flag, key: ligang_defense, operator: absent}
      - {kind: character_status, character: li_gang, value: alive}
      - {kind: character_region, character: li_gang, region: bianjing}
      - {not: {kind: flag, key: "memorial:t_liushou_noli", operator: exists}}
  proposal: ligang
  keywords: [留守, 汴京, 李纲, 南幸]
  advisors:
    - {character: li_gang, stance: support, option: ligang, requires: {region: bianjing}, line: 陛下虽行，宗庙社稷在此。臣愿留守，城存与存，城亡与亡。}
    - {character: zhao_huan, stance: neutral, option: taizi, requires: {office: crown_prince, region: bianjing}, line: 此等大事，儿臣不敢专。只是……父皇若要儿臣留下，儿臣不敢推辞。}
    - {character: gao_qiu, stance: oppose, option: keep, requires: {office: dianshuai}, line: 京城禁卫，向来是殿前司的事，臣守着便是。}
  options:
    - id: ligang
      label: 以李纲为东京留守，总领城守
      memory: {character: li_gang, text: 车驾南幸，陛下以臣为东京留守}
      ops:
        - {op: set_flag, key: ligang_defense, value: true}
        - {op: set_army_commander, army: jinjun, character: li_gang}
        - {op: adjust_region, region: bianjing, stat: defense, delta: 15}
        - {op: adjust_army, army: jinjun, quality_delta: 0.1, reason: 李纲整饬守城诸军}
      hint: 李纲统京师禁军；汴京防务 +15，京师禁军素质 +0.1；金兵围城日久而汴京不下，则师老粮匮
    - id: taizi
      label: 留皇太子监国，守东京
      ops:
        - {op: adjust_resource, resource: morale, delta: 3, reason: 东宫留守，人心稍定}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 东宫留守}
        - {op: adjust_army, army: jinjun, quality_delta: 0.05, reason: 东宫在城}
      hint: 民心 +3，君威 +1，京师禁军素质 +0.05
    - id: keep
      label: 一依殿前司
      ops:
        - {op: remember, character: li_gang, fact: 车驾南幸，臣请留守，不果}
      hint: 无增减

- id: t_liushou_noli
  title: 东京留守
  summary: 车驾南幸，东京不可无主。宰执请择留守：或以皇太子监国留守，以系人心；或发丁壮急修城守；或一依殿前司。
  region: bianjing
  illustration: event.ligang_defense
  variant_of: t_liushou
  conditions:
    all:
      - {kind: flag, key: court_south, value: true}
      - {kind: region_controller, region: bianjing, faction: song}
      - any:
          - {kind: flag, key: ligang_defense, value: true}
          - {not: {all: [{kind: character_status, character: li_gang, value: alive}, {kind: character_region, character: li_gang, region: bianjing}]}}
      - {not: {kind: flag, key: "memorial:t_liushou", operator: exists}}
  proposal: taizi
  keywords: [留守, 汴京, 南幸]
  advisors:
    - {character: zhao_huan, stance: neutral, option: taizi, requires: {office: crown_prince, region: bianjing}, line: 此等大事，儿臣不敢专。只是……父皇若要儿臣留下，儿臣不敢推辞。}
    - {character: chen_dong, stance: support, option: fortify, requires: {region: bianjing}, line: 车驾虽行，京城百万之众犹在。修城守、聚丁壮，金人未必能下！}
    - {character: gao_qiu, stance: oppose, option: keep, requires: {office: dianshuai}, line: 京城禁卫，向来是殿前司的事，臣守着便是。}
  options:
    - id: taizi
      label: 留皇太子监国，守东京
      ops:
        - {op: adjust_resource, resource: morale, delta: 3, reason: 东宫留守，人心稍定}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 东宫留守}
        - {op: adjust_army, army: jinjun, quality_delta: 0.05, reason: 东宫在城}
      hint: 民心 +3，君威 +1，京师禁军素质 +0.05
    - id: fortify
      label: 发丁壮急修东京城守
      ops:
        - {op: adjust_region, region: bianjing, stat: defense, delta: 12}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 急修城守}
      hint: 汴京防务 +12，国库 −40
    - id: keep
      label: 一依殿前司
      ops:
        - {op: remember, character: chen_dong, fact: 车驾南幸，东京留守未有处置}
      hint: 无增减

- id: t_xingzai
  title: 行在东南
  summary: 车驾驻跸江宁，东南州县供亿浩繁。或请修长江、淮南守备以固根本，或请括东南财赋以给军，或请募东南之兵以备北来之敌。
  region: jiangnan
  illustration: event.nanxing
  conditions:
    all:
      - {kind: flag, key: court_south, value: true}
      - {kind: character_region, character: zhao_ji, region: jiangnan}
      - {kind: region_controller, region: jiangnan, faction: song}
  proposal: fortify
  keywords: [南幸, 江宁, 东南, 长江]
  advisors:
    - {character: li_bangyan, stance: support, option: tax, requires: {region: jiangnan}, line: 东南有的是钱，多收些，北边的兵就有饭吃了。}
    - {character: zhang_shuye, stance: support, option: fortify, requires: {region: [jiangnan, huainan]}, line: 江淮者，东南之门户。先固江淮，然后可图恢复。}
    - {character: cai_jing, stance: neutral, option: enlist, requires: {region: jiangnan}, line: 东南之兵素不习战，然人多粮足。募而练之，三年可用。}
  options:
    - id: fortify
      label: 修长江、淮南守备（两季）
      ops:
        - op: start_project
          name: 修江淮守备
          region: jiangnan
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: jiangnan, stat: defense, delta: 15}
            - {op: adjust_region, region: huainan, stat: defense, delta: 10}
      hint: 国库每季 −40 共两季；成后江南防务 +15、淮南防务 +10
    - id: tax
      label: 括东南财赋以给军
      ops:
        - {op: adjust_resource, resource: treasury, delta: 150, reason: 括东南财赋}
        - {op: adjust_resource, resource: dongnan, delta: 6, reason: 行在供亿，东南困弊}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 括财扰民}
      hint: 国库 +150，东南民怨 +6，民心 −2
    - id: enlist
      label: 募东南之兵二万，屯江南
      ops:
        - {op: adjust_army, army: dongnan_army, delta: 20000, reason: 募东南之兵}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 募兵安家钱}
      hint: 东南诸军 +20000（素质不变），国库 −40；此后养兵每季 +6 万缗、粮 +2.4 万石

# ---- 战时庶务：粮饷、义兵、京城治安、罢花石、主和之议、金人再来 ----
- id: t_war_liangxiang
  title: 军兴粮饷
  summary: 金兵南下以来，诸路勤王之兵、京城守御之费日以万计，左藏告匮。户部请或借京畿富室之钱，或出内藏金帛，或截留东南上供之米。
  region: bianjing
  illustration: event.court_debate
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag_age, key: jin_invaded, operator: gte, value: 1}
      - {kind: flag, key: jin_withdrawn, operator: absent}
  proposal: tax
  keywords: [军饷, 财赋, 内藏, 漕运]
  advisors:
    - {character: li_bangyan, stance: support, option: tax, requires: {region: bianjing}, line: 京城里的富户多得是，借他们些，等仗打完了再还。}
    - {character: li_gang, stance: support, option: thrift, requires: {region: bianjing}, line: 内藏之积，本为缓急之备。今日不用，更待何时？}
    - {character: cai_jing, stance: neutral, option: grain, line: 东南上供之米，截留以给军，漕运省而军食足。只是东南又要多一分怨。}
  options:
    - id: tax
      label: 借京畿富室之钱以给军
      ops:
        - {op: adjust_resource, resource: treasury, delta: 150, reason: 借京畿富室钱}
        - {op: adjust_resource, resource: morale, delta: -3, reason: 括借扰民}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 胥吏缘此为奸}
      hint: 国库 +150；民心 −3，吏治积弊 +1
    - id: thrift
      label: 出内藏金帛，减宫中用度
      ops:
        - {op: adjust_resource, resource: treasury, delta: 120, reason: 出内藏金帛}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 天子节用}
      hint: 国库 +120，君威 +1
    - id: grain
      label: 截留东南上供之米以给军
      ops:
        - {op: adjust_resource, resource: grain, delta: 120, reason: 截留东南上供米}
        - {op: adjust_resource, resource: dongnan, delta: 3, reason: 东南加征}
      hint: 粮储 +120，东南民怨 +3

- id: t_war_yibing
  title: 河北义兵
  summary: 金人所过，焚掠州县，河北之民相聚山寨以自保，或截金人辎重、杀其游骑。河北守臣请给义兵旗号钱粮；或请收而编之，或恐其聚众为盗。
  region: hebei_xi
  illustration: event.military_drill
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: army_strength, army: jin_east, operator: gte, value: 10000}
      - any:
          - {kind: region_controller, region: hebei_xi, faction: jin}
          - {kind: army_region, army: jin_east, region: hebei_xi}
          - {kind: army_region, army: jin_east, region: yanshan}
  proposal: yibing
  keywords: [义兵, 河北, 粮道]
  advisors:
    - {character: zong_ze, stance: support, option: yibing, requires: {region: [jingdong, hebei_xi, hebei_dong, bianjing]}, line: 河北之民皆赤子，岂可弃之？给以旗号钱粮，人人可以杀贼！}
    - {character: ma_kuo, stance: support, option: enlist, requires: {region: bianjing}, line: 臣在北边，见山寨之民骁勇敢战。收而编之，可得劲兵。}
    - {character: li_bangyan, stance: oppose, option: refuse, requires: {region: bianjing}, line: 百姓手里有了刀枪，金人走了，还肯放下么？到时候又是一场群盗。}
  options:
    - id: yibing
      label: 给义兵旗号钱粮，令抄金人粮道
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 给义兵钱粮}
        - {op: adjust_resource, resource: grain, delta: -20, reason: 给义兵钱粮}
        - {op: adjust_army, army: jin_east, delta: -6000, reason: 义兵抄其粮道、杀其游骑}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 河北义兵四起}
      hint: 国库 −40，粮储 −20；金东路军 −6000（义兵抄掠），民心 +2
    - id: enlist
      label: 收义兵一万编入河北东路禁军
      ops:
        - {op: adjust_army, army: hebei_dong_army, delta: 10000, reason: 收编河北义兵}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 收编义兵}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 收编义兵}
      hint: 河北东路禁军 +10000（素质不变），国库 −30，武备 +1；此后养兵每季 +3 万缗、粮 +1.2 万石
    - id: refuse
      label: 不许聚众，令各归田里
      ops:
        - {op: adjust_resource, resource: morale, delta: -2, reason: 弃河北之民}
      hint: 民心 −2

- id: t_war_zhian
  title: 京城治安
  summary: 金兵围城，城外居民争入，城中米价十倍，溃兵、恶少乘乱剽掠。开封府请处置：或发仓平粜，或严刑禁剽掠，或括城中金银以犒守城之军。
  region: bianjing
  illustration: event.famine
  conditions:
    all:
      - {kind: flag, key: bianjing_besieged, value: true}
      - {kind: flag, key: jin_withdrawn, operator: absent}
      - {kind: region_controller, region: bianjing, faction: song}
  proposal: relief
  keywords: [京城, 治安, 米价, 平粜]
  advisors:
    - {character: chen_dong, stance: support, option: relief, requires: {region: bianjing}, line: 城中之民饥，则守城之兵亦不安。发仓平粜，人心乃固。}
    - {character: gao_qiu, stance: support, option: strict, requires: {office: dianshuai}, line: 抓几个剽掠的砍了，城里自然就安生了。}
    - {character: li_bangyan, stance: neutral, option: tax, requires: {region: bianjing}, line: 城里富户藏着金银不拿出来，守城的兵倒饿着肚子，哪有这个道理？}
  options:
    - id: relief
      label: 发仓平粜，赈城中饥民
      ops:
        - {op: adjust_resource, resource: grain, delta: -60, reason: 京城平粜}
        - {op: adjust_region, region: bianjing, stat: order, delta: 10}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 平粜赈饥}
      hint: 粮储 −60，汴京治安 +10，民心 +2
    - id: strict
      label: 严刑禁剽掠，斩以徇
      ops:
        - {op: adjust_region, region: bianjing, stat: order, delta: 8}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 严刑峻法}
      hint: 汴京治安 +8，民心 −1
    - id: tax
      label: 括城中金银以犒守城之军
      ops:
        - {op: adjust_resource, resource: treasury, delta: 80, reason: 括城中金银}
        - {op: adjust_resource, resource: morale, delta: -4, reason: 括金银扰民}
        - {op: adjust_region, region: bianjing, stat: order, delta: -5}
        - {op: adjust_army, army: jinjun, quality_delta: 0.03, reason: 守城之军得犒}
      hint: 国库 +80，京师禁军素质 +0.03；民心 −4，汴京治安 −5

- id: t_war_huashi
  title: 尽罢花石
  summary: 金兵南下，言者交章：花石纲、应奉诸局扰民二十年，今日人心离散，皆由于此。请尽罢诸局，以收天下之心。
  region: liangzhe
  illustration: event.huashi
  conditions:
    all:
      - {kind: flag, key: jin_invaded, value: true}
      - {kind: flag, key: huashi_abolished, operator: absent}
      - {kind: flag, key: huashi_halved, operator: absent}
      - {kind: flag, key: huashi_raised, operator: absent}
      - {not: {kind: character_status, character: zhu_mian, value: dead}}
      - {not: {kind: flag, key: "memorial:t_war_huashi_half", operator: exists}}
  proposal: abolish
  keywords: [花石, 应奉, 朱勔, 人心]
  advisors:
    - {character: chen_dong, stance: support, option: punish, requires: {region: bianjing}, line: 学生斗胆！罢花石而不罪朱勔，东南之民犹以为朝廷不诚！}
    - {character: li_gang, stance: support, option: abolish, requires: {region: bianjing}, line: 罢花石一诏，胜于十万之师。今日不罢，更待何时？}
    - {character: liang_shicheng, stance: oppose, option: keep, requires: {office: yubi}, line: 官家，这当口说花石做什么？园子里那些东西，又碍不着打仗。}
  options:
    - id: abolish
      label: 尽罢花石纲及诸局
      ops:
        - {op: set_flag, key: huashi_abolished, value: true}
