- id: t_shoucheng
  title: 京城守御
  summary: >-
    金兵前锋已至河上，京城震恐。城周数十里，守具久弛，禁军阙额。宰执请择大臣总领守御：或以李纲为亲征行营使，专任城守；
    或令殿前司督诸军守城，募京畿丁壮助之。
