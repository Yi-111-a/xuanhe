    - {character: zhong_shidao, stance: neutral, option: detach, requires: {region: xibian}, line: （自泾原驰表）全军东调则西边空虚；分兵守太原，余众留镇，进退皆有余地。}
    - {character: tong_guan, stance: oppose, option: keep, line: 西军是老奴一手带出来的，动一兵一卒都要细细斟酌，不可轻调。}
  options:
