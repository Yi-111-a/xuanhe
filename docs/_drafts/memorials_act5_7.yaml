  keywords: [守城, 李纲, 汴京, 禁军]
  advisors:
    - {character: li_gang, stance: support, option: ligang, requires: {region: bianjing}, line: 臣愿以死守城！修楼橹、具炮石、分四壁而守，金人虽众，不能一朝而下。}
    - {character: gao_qiu, stance: oppose, option: zhaomu, requires: {office: dianshuai}, line: 禁军守城，臣自有调度，何必另设行营使？多募些丁壮上城便是。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 城守是殿前司的事。另外弄个行营使，令出多门，反倒乱了。}
