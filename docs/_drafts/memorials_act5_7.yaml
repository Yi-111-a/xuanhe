        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢童贯宣抚}
      hint: 童贯罢宣抚（仍领枢密院）；种师道启程赴河北西路（行程见回执），泾原军由副将暂摄；武备 +2，佞幸 −2
    - id: zong
      label: 罢童贯宣抚，起宗泽代之
      memory: {character: zong_ze, text: 宣和七年，陛下起臣于编管之中，代童贯宣抚河北}
      ops:
