  keywords: [赈济, 蝗旱, 京东]
  advisors:
    - {character: zhang_shuye, stance: support, option: relief, requires: {region: jingdong}, line: （自海州驰奏）蝗过之地，十室九空。早赈一日，少一千人为盗。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 年年有蝗，年年要赈，仓里的米又不会自己长出来。}
