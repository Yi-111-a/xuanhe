    - {character: li_gang, stance: support, option: qinwang, requires: {region: bianjing}, line: 京城之存亡，系于勤王之迟速，不可再缓！}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 西军一来，金人更恼了。不如留着西军，咱们这边好谈。}
  options:
