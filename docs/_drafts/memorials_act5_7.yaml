  proposal: buy
  keywords: [边储, 和籴, 河北]
  advisors:
    - {character: ma_kuo, stance: support, option: buy, requires: {region: bianjing}, line: 兵无粮则不战自溃。边储一岁，是最少的了。}
    - {character: li_gang, stance: support, option: fair, requires: {region: bianjing}, line: 和籴本为便民，而州县抑配，反成一害。籴之可也，须禁抑配。}
    - {character: li_bangyan, stance: oppose, option: cash, requires: {region: bianjing}, line: 粮食放着会霉，钱放着不会。折成现钱，省事。}
  options:
    - id: buy
      label: 出钱五十万缗和籴边储
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 河北和籴}
        - {op: adjust_resource, resource: grain, delta: 50, reason: 河北和籴入仓}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 边储稍实}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 −50，粮储 +50，武备 +1；本条四季后再议
    - id: fair
      label: 和籴而禁抑配，遣使按察
      ops:
        - {op: adjust_resource, resource: treasury, delta: -55, reason: 河北和籴并遣使按察}
        - {op: adjust_resource, resource: grain, delta: 40, reason: 河北和籴入仓}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 禁抑配}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 2}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 −55，粮储 +40，吏治积弊 −1，河北西路治安 +2；本条四季后再议
    - id: cash
      label: 折纳现钱，不籴
      ops:
        - {op: adjust_resource, resource: treasury, delta: 20, reason: 边储折纳现钱}
        - {op: adjust_resource, resource: wubei, delta: -1, reason: 边储空虚}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 折纳之弊}
        - {op: start_project, name: 边储勘会, region: bianjing, cost_per_turn: {}, turns: 4, on_complete: [{op: set_flag, key: "memorial:s_hedi", value: null}]}
      hint: 国库 +20，武备 −1，吏治积弊 +1；本条四季后再议

- id: s_kaoke
  title: 考课守令
  summary: 吏部奏：诸路守令考课之法久废，以货得官者众，催科之外无治绩可言。请遣使按察诸路，或严考课以黜庸吏。
