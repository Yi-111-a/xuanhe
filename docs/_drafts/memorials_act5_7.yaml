# ============================== T19 宣和六年冬 ==============================
- id: t19_yingfeng
  turn: 19
  expires_after: 1
  title: 罢应奉司
  summary: 应奉司复置以来，花石之求换了名目，又起于东南；燕山馈运、河北饥荒，国用方急。言者交章请罢应奉司。
  region: bianjing
  illustration: event.huashi
  conditions: {kind: flag, key: yingfeng_restored, value: true}
  proposal: abolish
  keywords: [应奉, 花石, 东南]
  advisors:
    - {character: chen_dong, stance: support, option: abolish, requires: {region: bianjing}, line: 罢花石之诏犹在，而应奉之船又出，天下何以信朝廷？}
    - {character: liang_shicheng, stance: oppose, option: keep, requires: {office: yubi}, line: 官家园中的花木，总得有人照管。外头那些话，官家听听便罢。}
    - {character: li_bangyan, stance: neutral, option: halve, requires: {region: bianjing}, line: 全罢了，宫里不方便；全留着，外头又嚷嚷。减一半，两边都好交代。}
  options:
    - id: abolish
      label: 罢应奉司
      ops:
        - {op: cancel_ledger, ledger_id: yingfeng_si}
        - {op: set_flag, key: yingfeng_si_abolished, value: true}
        - {op: adjust_resource, resource: dongnan, delta: -5, reason: 罢应奉司}
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 罢应奉司}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 守罢花石之信}
      hint: 每季省应奉司之费；东南民怨 −5，佞幸 −2，君威 +1
    - id: halve
      label: 减应奉司之额，禁扰民间
      ops:
        - {op: add_ledger, id: yingfeng_si, name: 应奉司（减额）, category: treasury, amount: -4, kind: recurring, reason: 减应奉司之额（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: dongnan, delta: -2, reason: 应奉减额}
      hint: 应奉司每季改支 4 万缗；东南民怨 −2
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: liang_shicheng, fact: 宣和六年冬，罢应奉司之议不行}
      hint: 无增减

- id: t19_cai_jing
  turn: 19
  expires_after: 2
  title: 蔡京昏耄
  summary: 蔡京复领三省事，年近八十，目昏不能书字，章奏多由其子蔡絛代判，除授出于私门。言者请罢之。
  region: bianjing
  illustration: event.cai_retire
  conditions:
    all:
      - {kind: flag, key: cai_returned, value: true}
      - {kind: office_holder, office: taishi, character: cai_jing}
  proposal: retire
  keywords: [蔡京, 宰相, 吏治]
  advisors:
    - {character: chen_dong, stance: support, option: retire, requires: {region: bianjing}, line: 公相目不能视，而除目日出于其家，天下不知政出何门！}
    - {character: cai_you, stance: oppose, option: keep, line: 家父不过眼神差些，心里清楚得很。有人背后使坏罢了。}
    - {character: liang_shicheng, stance: neutral, option: curb, requires: {office: yubi}, line: 公相老了，事情让三省多担些便是；人还是要留着，镇得住场面。}
  options:
    - id: retire
      label: 令蔡京致仕，不复起用
      memory: {character: cai_jing, text: 宣和六年冬，陛下令老臣致仕}
      ops:
        - {op: set_character_status, character: cai_jing, status: retired, cause: 昏耄不能视事，再致仕}
        - {op: set_flag, key: cai_dismissed, value: true}
        - {op: adjust_resource, resource: ningxing, delta: -4, reason: 蔡京去位}
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 私门除授之弊息}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 政归朝廷}
      hint: 蔡京致仕（太师之位空出）；佞幸 −4，吏治积弊 −2，君威 +1
    - id: curb
      label: 禁蔡絛预政，事归三省
      ops:
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 禁蔡絛预政}
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 私门稍抑}
        - {op: adjust_trait, character: cai_jing, trait: favor, delta: -1}
      hint: 吏治积弊 −2，佞幸 −1；蔡京仍领三省事
    - id: keep
      label: 依旧
      ops:
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 政出私门}
      hint: 吏治积弊 +1

- id: t19_liao_plea
  turn: 19
  expires_after: 1
  title: 辽主乞援
  summary: 辽主自夹山间道遣使，言金人追逼日急，部众离散，乞宋粮帛以图存，愿以云中旧地为谢。
  region: liao
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
  proposal: aid
  keywords: [辽使, 联辽, 存辽, 唇齿]
  advisors:
    - {character: zhong_shidao, stance: support, option: aid, requires: {region: xibian}, line: （自泾原驰表）辽在一日，女真便西顾一日。粮帛之费，较之兵连祸结，所省多矣。}
    - {character: li_gang, stance: support, option: aid, requires: {region: bianjing}, line: 唇亡齿寒，古有明训。前已助之，今弃之则前功尽废。}
    - {character: li_bangyan, stance: oppose, option: decline, requires: {region: bianjing}, line: 辽主跑得比兔子还快，咱们的粮食送去，怕是喂了女真的马。}
  options:
    - id: aid
      label: 再输粮帛助辽
      ops:
        - {op: adjust_resource, resource: grain, delta: -80, reason: 输粮助辽}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 输帛助辽}
        - {op: adjust_resource, resource: liao_zuo, delta: 6, reason: 宋助辽粮帛}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人怨宋助辽}
      hint: 粮储 −80，国库 −40，辽祚 +6，金人轻宋（风闻）↑
    - id: token
      label: 赐帛以示存问，不助兵粮
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 赐辽使帛}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 邻好不绝}
      hint: 国库 −20，辽祚 +2
    - id: decline
      label: 婉辞之
      ops:
        - {op: remember, character: zhong_shidao, fact: 宣和六年冬，辽主乞援，朝廷婉辞}
      hint: 无增减；辽之亡日近

# ============================== 宣和七年（T20–T23）：辽亡与胡马南牧 ==============================
- id: t_liao_wang
  title: 辽亡
  summary: 金将娄室执辽主天祚于应州之野，辽自是而亡。宋与金直接为邻，燕山、河东皆当其冲；金使将至，来告擒辽主。
  region: yunzhong
  illustration: event.tianzuo_captured
  conditions:
    all:
      - {kind: flag, key: liao_fallen, value: true}
      - {kind: flag_age, key: liao_fallen, operator: lte, value: 1}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: gifts
  keywords: [辽亡, 金使, 边备]
  advisors:
    - {character: zhao_liangsi, stance: support, option: gifts, line: 辽既亡，金与我共有燕云。遣使致贺，重申盟好，彼当无南顾之意。}
    - {character: ma_kuo, stance: oppose, option: fortify, requires: {region: bianjing}, line: 女真灭辽之后，所欲者唯有南朝。贺使可遣，城不可不修。}
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 人家打赢了，咱们送份贺礼，礼多人不怪嘛。}
  options:
    - id: gifts
      label: 遣使贺金，重申盟好
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 遣使贺金}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋使恭谨}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 贺灭旧邻}
      hint: 国库 −40，君威 −1，金人轻宋（风闻）↓
    - id: fortify
      label: 收辽之溃卒，修河北、河东北边城寨（两季）
      ops:
        - op: start_project
          name: 修北边城寨
          region: hebei_xi
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 8}
            - {op: adjust_region, region: hedong, stat: defense, delta: 4}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 北边城寨修治}
      hint: 国库每季 −40 共两季；成后河北西路防务 +8、河东防务 +4、武备 +2
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: 宣和七年，辽亡，朝廷未有处置}
      hint: 无增减

- id: t21_jin_envoy
  turn: 21
  expires_after: 1
  title: 金使倨傲
  summary: 金使至汴京，倨傲不拜，历数南朝失信之事，言辞之间已有南牧之意。宰执或请卑辞厚礼以安之，或请据理折之。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: "event:jin_envoy_blame:fired", operator: exists}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: character_status, character: ma_kuo, value: alive}
  proposal: gifts
  keywords: [金使, 议和, 岁币]
  advisors:
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 好汉不吃眼前亏。多给些金帛，把人哄高兴了送走便是。}
    - {character: li_gang, stance: oppose, option: frank, requires: {region: bianjing}, line: 使者倨傲，正是试我虚实。示之以弱，则南牧之期愈近。}
    - {character: ma_kuo, stance: neutral, option: spy, requires: {region: bianjing}, line: 臣愿随报聘之使北行，亲见其兵马粮储，回奏陛下。}
  options:
    - id: gifts
      label: 卑辞厚礼以安其心
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 厚赐金使}
        - {op: adjust_resource, resource: authority, delta: -3, reason: 卑辞事金}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人知宋可欺}
        - {op: adjust_resource, resource: nanmu, delta: -2, reason: 金人得赂稍缓}
      hint: 国库 −80，君威 −3；金人轻宋（风闻）略↑，而胡马南牧（风闻）略↓
    - id: frank
      label: 据理折之，并谕边臣严备
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 折金使之倨}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 边臣严备}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 金人知宋有人}
      hint: 君威 +2，武备 +1，金人轻宋（风闻）↓
    - id: spy
      label: 遣马扩随报聘之使北行，觇其虚实
      memory: {character: ma_kuo, text: 宣和七年夏，奉命随报聘之使北行，觇金人虚实}
      ops:
        - {op: set_flag, key: "intel:nanmu", value: true}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 报聘金国}
      hint: 国库 −20；得金人治兵虚实之报（「胡马南牧」的风闻区间减半，只减半一次、不叠加）

# ---- 金人治兵（先声：胡马南牧初至山雨之季，事件设 jin_warning）----
- id: t_jin_warning
  title: 金人治兵
  summary: >-
    边臣交章奏报：金人于云中、平州聚粮治兵，括马造器，往来使者言辞日倨。河东、河北守臣皆请预为之备：京城守具久弛，
    太原城虽坚而器械多朽。
  region: hedong
  illustration: event.military_drill
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: fortify
  keywords: [金人, 城防, 太原, 汴京, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, requires: {region: bianjing}, line: 臣亲见女真兵马，人皆善骑射，号令如一。今其聚粮治兵，非为他国，必为我也。}
    - {character: zhang_xiaochun, stance: support, option: taiyuan, requires: {region: hedong}, line: （自太原驰奏）太原城高池深，然守具多朽、粮储只够半年。陛下若肯拨钱修治，臣保太原不失。}
    - {character: zong_ze, stance: support, option: both, requires: {region: jingdong}, line: （自京东驰书）臣老矣，所忧者河北之民。京城要修，太原要修，一日不可缓！}
    - {character: li_bangyan, stance: oppose, option: stall, requires: {region: bianjing}, line: 金人新得辽地，正要喘口气，哪有工夫来打咱们？边臣怕担干系，故意说得吓人。}
  options:
    - id: fortify
      label: 修汴京城池守具（三季）
      ops:
        - op: start_project
          name: 修汴京城池
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 3
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 20}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 京城守具修治}
      hint: 国库每季 −50 共三季；成后汴京防务 +20、武备 +2（防务 ≥ 80 即为坚城，攻者须倍众方能克之）
    - id: taiyuan
      label: 修太原城（两季）
      ops:
        - op: start_project
          name: 修太原城
          region: hedong
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 12}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 太原城修治}
      hint: 国库每季 −40 共两季；成后河东防务 +12、武备 +1（太原防务 ≥ 80 即为坚城，攻者须倍众方能克之）
    - id: both
      label: 京城、太原并修
      ops:
        - op: start_project
          name: 修汴京城池
          region: bianjing
          cost_per_turn: {treasury: 50}
          turns: 3
          on_complete:
            - {op: adjust_region, region: bianjing, stat: defense, delta: 20}
            - {op: adjust_resource, resource: wubei, delta: 2, reason: 京城守具修治}
        - op: start_project
          name: 修太原城
          region: hedong
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: hedong, stat: defense, delta: 12}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 太原城修治}
      hint: 国库头两季每季 −90、第三季 −50；成后汴京防务 +20、河东防务 +12、武备 +3
    - id: stall
      label: 以为边臣过虑，置之
      ops:
        - {op: adjust_resource, resource: ningxing, delta: 1, reason: 主和者之言得行}
      hint: 佞幸 +1；城防如旧

