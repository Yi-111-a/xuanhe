        - {op: adjust_region, region: bianjing, stat: defense, delta: 30}
        - {op: adjust_army, army: jinjun, quality_delta: 0.15, reason: 李纲整饬守城诸军}
        - {op: set_army_commander, army: jinjun, character: li_gang}
      hint: 汴京防务 +30，京师禁军素质 +0.15，李纲统京师禁军；金兵围城日久而汴京不下，则师老粮匮、逐季折损
    - id: zhaomu
      label: 令殿前司督守，募京畿丁壮二万上城
      ops:
        - {op: adjust_army, army: jinjun, delta: 20000, reason: 募京畿丁壮二万}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 募丁壮犒赏}
        - {op: adjust_region, region: bianjing, stat: defense, delta: 8}
      hint: 京师禁军 +20000（素质不变），国库 −60，汴京防务 +8；此后养兵每季 +6 万缗、粮 +2.4 万石
    - id: keep
      label: 一依殿前司常法
      ops:
        - {op: remember, character: li_gang, fact: 金兵围城，臣请总领守御，不果}
      hint: 无增减

