- id: t_changsheng
  title: 常胜军可虑
  summary: 郭药师所部常胜军骄悍，衣粮倍于诸军；燕人降将，向背难测。金人治兵之报既至，边臣请分其众，或厚抚以结其心。
  region: hebei_dong
  illustration: event.guo_surrender
  conditions:
    all:
      - {kind: flag, key: jin_warning, value: true}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: guo_defected_song, value: true}
      - {kind: flag, key: guo_defected_jin, operator: absent}
      - {kind: flag, key: changsheng_split, operator: absent}
      - {kind: army_strength, army: changsheng, operator: gte, value: 6000}
      - {kind: character_status, character: guo_yaoshi, value: alive}
  proposal: split
  keywords: [常胜军, 郭药师, 燕山, 降将]
  advisors:
    - {character: ma_kuo, stance: support, option: split, requires: {region: bianjing}, line: 药师之众，聚则为患，分则为用。分其半于内地，金人纵来，彼亦无所恃。}
    - {character: guo_yaoshi, stance: oppose, option: favor, requires: {region: [yanshan, hebei_dong]}, line: 末将的弟兄跟着末将吃了多少苦！朝廷若信得过，粮饷给足，末将替朝廷守燕山。}
    - {character: tong_guan, stance: oppose, option: keep, line: 药师是老奴招来的，忠心可鉴。无端分他的兵，倒叫降人寒心。}
  options:
    - id: split
      label: 分常胜军四千屯京东
      ops:
        - {op: set_flag, key: changsheng_split, value: true}
        - {op: detach, army: changsheng, strength: 4000, to_region: jingdong, new_army_name: 常胜军京东分屯}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
      hint: 常胜军分兵 4000 移驻京东（行程见回执），余部留原地；郭药师（风闻）怏怏，然其众不得聚而为变
    - id: favor
      label: 厚给衣粮，抚以恩信
      memory: {character: guo_yaoshi, text: 宣和七年，朝廷厚给常胜军衣粮}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 厚给常胜军衣粮}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: 3}
      hint: 国库 −50；郭药师（风闻）感恩
    - id: keep
      label: 一仍其旧
      ops:
        - {op: remember, character: guo_yaoshi, fact: 宣和七年，朝廷议分常胜军，不果}
      hint: 无增减

# ---- 陈东上书（宣和七年起，陈东在京）：按王黼、蔡京、童贯、梁师成、朱勔、李邦彦依次上书，每季至多一篇。----
# 第 k 篇须前几篇都已处置满一季，或其所论之人已不在其位。罢黜者须正任其职（office_holder 守卫）。
- id: t_chendong_wangfu
  title: 陈东论王黼
  summary: 太学生陈东率诸生伏阙上书，论宰相王黼：聚敛以固宠，结内侍以专政，谋摇东宫，括免夫以困天下。请窜之远方，以谢天下。
  region: bianjing
  illustration: event.chen_dong
  conditions:
    all:
      - {kind: turn, operator: gte, value: 20}
      - {kind: character_status, character: chen_dong, value: alive}
      - {kind: character_region, character: chen_dong, region: bianjing}
      - any:
          - {kind: office_holder, office: taizai, character: wang_fu}
          - {kind: office_holder, office: shaozai, character: wang_fu}
  proposal: punish
  keywords: [陈东, 六贼, 王黼, 太学]
  advisors:
    - {character: chen_dong, stance: support, option: punish, line: 学生斗胆！今日之患，不在外而在内：王黼聚敛蔽聪明，此天下所共知也！}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [taizai, shaozai]}, line: 诸生不知国用之艰，徒以浮言惑众。臣所为者，无非为陛下恢复故疆筹措钱粮。}
    - {character: li_gang, stance: neutral, option: dismiss, requires: {region: bianjing}, line: 王黼当罢，然窜逐太过，恐启朋党之争。罢其政，令其归第可也。}
  options:
    - id: punish
      label: 罢王黼，窜之远方
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: exiled, cause: 为太学生所论，窜逐远方}
        - {op: adjust_resource, resource: ningxing, delta: -7, reason: 窜王黼}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 从谏去奸}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 都人称快}
      hint: 王黼窜逐，宰相之位空出；佞幸 −7，君威 +2，民心 +1
    - id: dismiss
      label: 罢王黼政事，令归第
      ops:
        - {op: set_flag, key: wangfu_dismissed, value: true}
        - {op: set_character_status, character: wang_fu, status: retired, cause: 为太学生所论，罢相归第}
        - {op: adjust_resource, resource: ningxing, delta: -5, reason: 罢王黼}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 从谏}
      hint: 王黼罢归，宰相之位空出；佞幸 −5，君威 +1
    - id: keep
      label: 书入不报
      ops:
        - {op: adjust_resource, resource: authority, delta: -1, reason: 拒谏}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 太学之议沸腾}
      hint: 君威 −1，民心 −1

