# 补写事件草稿（第 3 批，26 个，其中记账事件 2 个）。追加到 scenarios/xuanhe_1120/events.yaml 末尾即可（须在 memorials 草稿一并追加之后）。
# 一、联辽之局：辽人告捷、辽金相持、辽使贺正旦、耶律大石出塞（读奏疏「林牙去留」）。
# 二、燕京在宋手：燕人北走、燕民来归（赎燕路线）、燕山戍卒思归、燕山屯田有收（读奏疏「燕山馈运」）。
# 三、谢绝金使而未联辽：金骑窥边（武备 ≥ 45 方可出兵逐之）、金人陈兵白沟 / 金人引去（读奏疏「金索岁币」，按武备分两支）。
# 四、随前作而变的后续：和籴、斋醮的记账事件（计数器 hedi_buys、zhaijiao_approves）、道流恃宠、盗铸蜂起、常平空虚、夏人入市、亭户逃亡。
# 五、地方与节令：北苑贡茶（闽广·春）、泸南夷扰边（川峡）、荆江暴涨（荆湖·夏秋）、关中旱（夏）、金明池争标（春）、京城疫（夏）、钱塘潮溢（秋）、塘泺冰合（冬）。
# 带抉择的事件，default_choice 一律是正文「逾期不决，依例……」所说的那一项。数值为本游戏设定（【设】）。

# ======================== 联辽之局 ========================
- id: liao_victory_report
  title: 辽人告捷
  kind: random
  repeatable: true
  cooldown: 4
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: gte, value: 10}
      - {kind: resource, id: liao_zuo, operator: gte, value: 30}
  gravity: 0.25
  importance: 1
  region: liao
  text: 辽人遣使告捷：金兵攻辽城寨不下，辽军乘其退，出奇击之，斩获颇众；请宋犒军，以励将士。逾期不决，依例致书嘉慰。
  effects:
    - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 辽人小胜}
  choices:
    - id: gifts
      text: 赐帛犒辽军
      effects:
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 犒辽军}
        - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 辽军得宋犒赏}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋资辽}
    - id: keep
      text: 依例致书嘉慰
      effects:
        - {op: remember, character: zhong_shidao, fact: "{when}，辽人告捷，朝廷致书嘉慰"}
  default_choice: keep
  choice_deadline: 1
  illustration: event.liao_envoy

- id: liao_jin_standoff
  title: 辽金相持
  kind: random
  repeatable: true
  cooldown: 4
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: gte, value: 12}
      - {kind: resource, id: liao_zuo, operator: gte, value: 25}
  gravity: 0.3
  importance: 1
  region: liao
  text: 边报：辽、金相持于塞外，互有胜负。金之锐卒多牵于北，南顾稍缓；辽人亦疲于奔命，城寨日蹙。
  effects:
    - {op: adjust_resource, resource: liao_zuo, delta: -2, reason: 辽金相持，辽人疲敝}
    - {op: adjust_resource, resource: nanmu, delta: -1, reason: 金人北顾}
  illustration: event.zhongjing_falls

- id: liao_zhengdan
  title: 辽使贺正旦
  kind: random
  repeatable: true
  cooldown: 4
  conditions:
    all:
      - {kind: season, value: 冬}
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
  gravity: 0.4
  importance: 1
  region: bianjing
  text: 辽使来贺正旦，执礼恭谨，奉表申兄弟之好，言辽人朝夕南望。礼部请定回赐厚薄。逾期不决，依常礼。
  choices:
    - id: gifts
      text: 厚赐辽使，宴之于紫宸殿
      effects:
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 厚赐辽使}
        - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 宋辽之好益笃}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 远人来贺}
    - id: keep
      text: 依常礼回赐
      effects:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 回赐辽使}
  default_choice: keep
  choice_deadline: 1
  illustration: event.liao_envoy

# 奏疏 t_dashi「林牙去留」批「听其自处」：次季起耶律大石出塞（史实大石于燕京陷后西走；此为联辽之局的反事实情节）。
- id: dashi_leaves_yanjing
  title: 耶律大石出塞
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: "memorial:t_dashi", value: keep}
      - {kind: flag_age, key: "memorial:t_dashi", operator: gte, value: 1}
      - {kind: flag, key: dashi_west, operator: absent}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: character_status, character: yelu_dashi, value: alive}
      - {kind: character_region, character: yelu_dashi, region: yanshan}
  gravity: 0.8
  importance: 2
  region: yanshan
  text: 耶律大石率精骑夜出燕京，出塞以奉其主。燕京辽军失其宿将，人心浮动，燕人或有南奔雄州者。
  effects:
    - {op: set_flag, key: dashi_west, value: true}
    - {op: set_army_commander, army: liao_yanjing, character: null}
    - {op: move_character, character: yelu_dashi, to_region: liao}
    - {op: adjust_army, army: liao_yanjing, quality_delta: -0.1, reason: 宿将西去}
    - {op: adjust_resource, resource: liao_zuo, delta: -3, reason: 燕京失其宿将}
  illustration: event.liao_envoy

# ======================== 燕京在宋手 ========================
- id: yan_people_flee
  title: 燕人北走
  kind: random
  repeatable: true
  cooldown: 4
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: region_controller, region: pingzhou, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: region_stat, region: yanshan, stat: order, operator: lt, value: 55}
  gravity: 0.25
  importance: 1
  region: yanshan
  text: 燕山富户、工匠或间道北走金境，金人纳而不遣；燕人观望未定，城中萧然。守臣请旨：宽其赋役以留之，或严关禁、捕亡者。逾期不决，依例听之。
  effects:
    - {op: adjust_region, region: yanshan, stat: prosperity, delta: -2}
  choices:
    - id: relief
      text: 宽燕地赋役以留其民
      effects:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 宽燕地赋役}
        - {op: adjust_region, region: yanshan, stat: prosperity, delta: 2}
        - {op: adjust_region, region: yanshan, stat: order, delta: 1}
    - id: strict
      text: 严关禁，捕亡者
      effects:
        - {op: adjust_region, region: yanshan, stat: order, delta: -3}
        - {op: adjust_region, region: yanshan, stat: prosperity, delta: 1}
    - id: none
      text: 依例听之
      effects:
        - {op: adjust_region, region: yanshan, stat: order, delta: -1}
  default_choice: none
  choice_deadline: 1
  illustration: event.famine

# 赎燕之后（yanjing_bought）：金人交割时驱北之燕民逃归，金人索之（史载金人索燕之逃民，为宋金之衅端之一；此处时点与人数为本游戏设定）。
- id: yan_returnees
  title: 燕民来归
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: yanjing_bought, value: true}
      - {kind: flag_age, key: yanjing_bought, operator: gte, value: 1}
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: region_controller, region: pingzhou, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: yan_returnees_done, operator: absent}
  gravity: 0.6
  importance: 1
  region: yanshan
  text: 金人交割燕京时驱以北徙之燕民，有自平州间道逃归者数千家，扶老携幼至燕山。金人移文燕山宣抚司索之甚急，言藏匿其民即是负约。逾期不决，依例给田安置。
  effects:
    - {op: set_flag, key: yan_returnees_done, value: true}
  choices:
    - id: settle
      text: 给田安置，不遣还
      effects:
        - {op: adjust_resource, resource: grain, delta: -20, reason: 安置逃归燕民}
        - {op: adjust_region, region: yanshan, stat: prosperity, delta: 3}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人索燕民不得}
    - id: send_back
      text: 遣还金境，以息边衅
      effects:
        - {op: adjust_resource, resource: authority, delta: -1, reason: 遣还逃民}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 燕民见弃}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋遣还燕民}
  default_choice: settle
  choice_deadline: 1
  illustration: event.famine

- id: yanshan_homesick
  title: 燕山戍卒思归
  kind: conditional
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: army_strength, army: yanshan_army, operator: gte, value: 15000}
      - {kind: flag_age, key: yanjing_song, operator: gte, value: 4}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: yanshan_homesick_done, operator: absent}
  gravity: 0.5
  importance: 1
  region: yanshan
  text: 燕山戍卒多自京师、河北更戍而来，久戍不代，衣粮仰给转输，时有不继；士卒思归，颇有逃亡者。守臣请旨：或更番轮戍，或依例留戍。逾期不决，依例留戍。
  effects:
    - {op: set_flag, key: yanshan_homesick_done, value: true}
  choices:
    - id: settle
      text: 更番轮戍，厚给冬衣
      effects:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 燕山戍卒更番与冬衣}
    - id: keep
      text: 依例留戍（逃亡者约一千五百人，燕山戍军素质 −0.04）
      effects:
        - {op: adjust_army, army: yanshan_army, delta: -1500, quality_delta: -0.04, reason: 戍卒思归逃亡一千五百}
  default_choice: keep
  choice_deadline: 1
  illustration: event.military_drill

# 奏疏 t18_yanshan「燕山馈运」批「屯田」且竣工（燕山粮产 ≥ 10）之后的秋季。
- id: yanshan_tuntian_harvest
  title: 燕山屯田有收
  kind: conditional
  conditions:
    all:
      - {kind: season, value: 秋}
      - {kind: flag, key: "memorial:t18_yanshan", value: tuntian}
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: region_stat, region: yanshan, stat: grain, operator: gte, value: 10}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: yanshan_tuntian_done, operator: absent}
  gravity: 0.9
  importance: 1
  region: yanshan
  text: 燕山屯田之兵秋收有获，戍兵口粮稍得自给，河北转输之役为之稍减。
  effects:
    - {op: set_flag, key: yanshan_tuntian_done, value: true}
    - {op: adjust_resource, resource: grain, delta: 20, reason: 燕山屯田秋收}
    - {op: adjust_region, region: hebei_dong, stat: order, delta: 2}
  illustration: event.qingming

# ======================== 谢绝金使而未联辽 ========================
- id: jin_riders_probe
  title: 金骑窥边
  kind: random
  repeatable: true
  cooldown: 4
  conditions:
    all:
      - {kind: flag, key: haishang_refused, value: true}
      - {kind: flag, key: lian_liao, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: gte, value: 10}
      - {kind: region_controller, region: yanshan, faction: jin}
      - {kind: region_controller, region: hebei_xi, faction: song}
  gravity: 0.35
  importance: 1
  region: hebei_xi
  text: 金游骑数百出没白沟之南，掠边民牛马而去，似以试我虚实。边将请旨：出兵逐之，或移文诘问，或闭壁自守。逾期不决，依例闭壁自守。
  choices:
    - id: repel
      text: 令边将出兵逐之（武备不足四十五则不可）
      conditions: {kind: resource, id: wubei, operator: gte, value: 45}
      effects:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 逐金游骑犒赏}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋兵逐金游骑}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 1}
    - id: frank
      text: 移文金人诘问
      effects:
        - {op: adjust_resource, resource: treasury, delta: -5, reason: 遣使移文}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人知宋只以文移相责}
    - id: none
      text: 闭壁自守
      effects:
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 宋边将闭壁不出}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: -2}
  default_choice: none
  choice_deadline: 1
  illustration: event.military_drill

# 奏疏 t_jin_suibi「金索岁币」批「不许」之后：金人陈兵试探。武备 < 50 则河北震动；≥ 50 则金人引去（宋自强之效）。二者互斥，只发其一。
- id: jin_suibi_pressure
  title: 金人陈兵白沟
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: "memorial:t_jin_suibi", value: refuse}
      - {kind: flag_age, key: "memorial:t_jin_suibi", operator: gte, value: 1}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: jin_suibi_probe_done, operator: absent}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: resource, id: wubei, operator: lt, value: 50}
  gravity: 0.8
  importance: 1
  region: hebei_xi
  text: 金人以宋不与岁币，陈兵数千于白沟之北，扬言秋高马肥即来取之。河北州县为之震动，民或负担南走。
  effects:
    - {op: set_flag, key: jin_suibi_probe_done, value: true}
    - {op: adjust_region, region: hebei_xi, stat: order, delta: -3}
    - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 河北震动}
  illustration: event.jin_envoy

- id: jin_suibi_withdraw
  title: 金人引去
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: "memorial:t_jin_suibi", value: refuse}
      - {kind: flag_age, key: "memorial:t_jin_suibi", operator: gte, value: 1}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: jin_suibi_probe_done, operator: absent}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: resource, id: wubei, operator: gte, value: 50}
  gravity: 0.8
  importance: 1
  region: hebei_xi
  text: 金人以宋不与岁币，陈兵数千于白沟之北。宋边将严阵以待，城守整肃，金人留数日引去，自是不复言岁币。
  effects:
    - {op: set_flag, key: jin_suibi_probe_done, value: true}
    - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 金人见宋有备}
    - {op: adjust_resource, resource: authority, delta: 1, reason: 金人引去}
  illustration: event.military_drill

# ======================== 随前作而变的后续 ========================
# 记账：常设奏疏「河北和籴」批「出钱和籴」、「宫观斋醮」批「照准」的次数（奏疏 cooldown ≥ 4，记账事件 cooldown 2，故每次批答只计一次）。
- id: hedi_tally
  title: 河北和籴计数
  kind: system
  repeatable: true
  cooldown: 2
  conditions:
    all:
      - {kind: flag, key: "memorial:s_hedi", value: buy}
      - {kind: flag_age, key: "memorial:s_hedi", operator: lte, value: 1}
  gravity: 1.0
  text: 河北和籴又行一次。
  effects:
    - {op: adjust_counter, key: hedi_buys, delta: 1}

- id: zhaijiao_tally
  title: 宫观斋醮计数
  kind: system
  repeatable: true
  cooldown: 2
  conditions:
    all:
      - {kind: flag, key: "memorial:s_zhaijiao", value: approve}
      - {kind: flag_age, key: "memorial:s_zhaijiao", operator: lte, value: 1}
  gravity: 1.0
  text: 宫观大斋醮又设一次。
  effects:
    - {op: adjust_counter, key: zhaijiao_approves, delta: 1}

- id: daoliu_arrogant
  title: 道流恃宠
  kind: conditional
  conditions:
    all:
      - {kind: counter, key: zhaijiao_approves, operator: gte, value: 2}
      - {kind: flag, key: daojiao_curbed, operator: absent}
      - {kind: flag, key: daoliu_done, operator: absent}
  gravity: 0.7
  importance: 1
  region: bianjing
  text: 宫观道流恃宠骄恣，或衣紫腰金、出入禁中，或侵夺民田、役使州县；言者以为道君崇道，而道流乃累圣德。逾期不决，依例不问。
  effects:
    - {op: set_flag, key: daoliu_done, value: true}
  choices:
    - id: punish
      text: 下诏究治侵夺民田者
      effects:
        - {op: adjust_resource, resource: ningxing, delta: -1, reason: 究治道流}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 民田得还}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 道君自责其徒}
    - id: none
      text: 依例不问
      effects:
        - {op: adjust_resource, resource: morale, delta: -1, reason: 道流侵民}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 州县畏道流}
  default_choice: none
  choice_deadline: 1
  illustration: event.daoist_rite

# 奏疏 t3_qianfa「钱监鼓铸」批「增铸当十大钱」之后两季。
- id: counterfeit_coins
  title: 盗铸蜂起
  kind: conditional
  conditions:
    all:
      - {kind: flag, key: "memorial:t3_qianfa", value: tax}
      - {kind: flag_age, key: "memorial:t3_qianfa", operator: gte, value: 2}
      - {kind: flag, key: counterfeit_done, operator: absent}
  gravity: 0.7
  importance: 1
  region: guanzhong
  text: 当十大钱既行，私铸者遍于乡野，市井以大钱折阅，物价翔踊，商旅不行。转运司请旨：或收大钱改铸，或严私铸之禁。逾期不决，依例严禁私铸。
  effects:
    - {op: set_flag, key: counterfeit_done, value: true}
    - {op: adjust_resource, resource: morale, delta: -1, reason: 大钱折阅，物价翔踊}
  choices:
    - id: settle
      text: 收大钱，改铸小平钱
      effects:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 收大钱改铸}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 钱法复旧}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 物价稍平}
    - id: strict
      text: 严私铸之禁
      effects:
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 捕私铸而胥吏为奸}
        - {op: adjust_region, region: guanzhong, stat: order, delta: -2}
  default_choice: strict
  choice_deadline: 1
  illustration: event.mianfu

# 奏疏 t2_changping「常平籴本」批「借常平钱」之后，遇夏秋告歉。
