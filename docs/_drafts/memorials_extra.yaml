      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: office_holder, office: changsheng_tong, character: guo_yaoshi}
      - {kind: army_strength, army: changsheng, operator: gte, value: 6000}
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: turn, operator: gte, value: 13}
      - any:
          - {kind: army_region, army: changsheng, region: yanshan}
          - {kind: army_region, army: changsheng, region: hebei_dong}
  proposal: favor
  keywords: [郭药师, 常胜军, 燕山, 降将]
  advisors:
    - {character: guo_yaoshi, stance: support, option: favor, requires: {region: [yanshan, hebei_dong]}, line: （驰奏）弟兄们拖家带口，没块田地，心里不安稳。朝廷给田，药师再募些燕地子弟，替朝廷守边。}
    - {character: ma_kuo, stance: neutral, option: settle, requires: {region: bianjing}, line: 给田可也，增额不可。降将之兵，宁少而精，不可多而骄。}
    - {character: zhong_shidao, stance: oppose, option: keep, line: 降人之兵，增一人则多一分可虑。田可给，兵不可增，且须约束其骚扰。}
  options:
    - id: favor
      label: 许增募燕人七千，扩常胜军之额
      memory: {character: guo_yaoshi, text: "{when}，朝廷许药师增募燕人七千"}
      ops:
        - {op: adjust_army, army: changsheng, delta: 7000, reason: 增募燕人七千}
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 常胜军增募安家钱}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: 1}
      hint: 常胜军 +7000，国库 −25；郭药师感恩（忠诚 +1）；此后养兵每季 +2.1 万缗、粮 +0.84 万石，而兵柄益重于药师
    - id: keep
      label: 不许，令河北守臣约束之
      ops:
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: -1}
        - {op: adjust_region, region: hebei_dong, stat: order, delta: 2}
      hint: 郭药师怏怏（忠诚 −1）；河北东路治安 +2
    - id: settle
      label: 以燕山官田给常胜军家属，不增其额
      ops:
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 给常胜军家属田宅}
        - {op: adjust_trait, character: guo_yaoshi, trait: loyalty, delta: 1}
        - {op: adjust_region, region: yanshan, stat: order, delta: -1}
      hint: 国库 −15；郭药师稍安（忠诚 +1）；燕京治安 −1（燕人田为所占）

- id: t_yanshan_qushi
  title: 燕山取士
  summary: 燕山府奏：燕地士人久习辽之科举，今归朝廷，多有观望。请特设燕山解额，许燕士就试礼部，以收其心。
  region: yanshan
  illustration: event.chen_dong
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: gte, value: 13}
  proposal: settle
  keywords: [燕山, 燕人, 科举]
  advisors:
    - {character: zhao_liangsi, stance: support, option: settle, line: 燕人思汉久矣！许其就试，则燕之士族皆知朝廷不弃燕人。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 燕人读的是辽国的书，考出来也是辽国的进士。}
    - {character: chen_dong, stance: neutral, option: limit, requires: {region: bianjing}, line: 燕士可试，然不宜骤与高第。先令附试河北诸州，以观其人。}
  options:
    - id: settle
      label: 特设燕山解额，许燕士就试礼部
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 燕山贡举}
        - {op: adjust_region, region: yanshan, stat: order, delta: 3}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 燕士来试}
      hint: 国库 −10，燕京治安 +3，君威 +1
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: zhao_liangsi, fact: "{when}，燕山取士之议未行"}
      hint: 无增减
    - id: limit
      label: 许燕士附试河北诸州
      ops:
        - {op: adjust_region, region: yanshan, stat: order, delta: 1}
      hint: 燕京治安 +1

# ============================== 谢绝金使而未联辽（haishang_refused，lian_liao absent） ==============================
- id: t6_jin_dushi
  turn: 6
  expires_after: 1
  title: 金使渡海
  summary: 金主遣使渡海至登州，入见诘问：南朝何以守辽人旧约，拒大金之好？言辞之间颇有恫吓，且请宋以旧输辽之岁币转输于金。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: haishang_refused, value: true}
      - {kind: flag, key: lian_liao, operator: absent}
  proposal: frank
  keywords: [金使, 女真, 岁币]
  advisors:
    - {character: ma_kuo, stance: support, option: frank, requires: {region: bianjing}, line: 女真重实而恶诈。直言宋守澶渊之约、不预辽金之争，彼虽不悦，犹敬之。}
    - {character: zhao_liangsi, stance: oppose, option: gifts, line: 金人方盛，拒之太峻，恐结怨于新兴之国。厚礼其使，许以互市，留个后路。}
    - {character: zhong_shidao, stance: neutral, option: spy, requires: {region: xibian}, line: （自泾原驰表）金使所言，虚实难知。宜遣能言之士报聘，观其兵马，再定可否。}
  options:
    - id: frank
      label: 申澶渊之约，告以宋不预辽金之争，岁币之请不许
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 答金使以正}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金使失意}
      hint: 君威 +1；金人轻宋（风闻）略↑
    - id: gifts
      label: 厚礼其使，许以登州互市
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 厚礼金使}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 金使得礼}
      hint: 国库 −30；金人轻宋（风闻）↓
    - id: spy
      label: 遣马扩报聘，兼觇其国
      memory: {character: ma_kuo, text: "{when}，奉命报聘于金，兼觇其国"}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 遣使报聘}
        - {op: set_flag, key: "intel:jin_contempt", value: true}
      hint: 国库 −20；得金人虚实之报（「金人轻宋」的风闻区间减半，只减半一次、不叠加）

- id: t_jin_suibi
  title: 金索岁币
  summary: 金既取燕京，遣使来言：燕地今为大金所有，宋旧输辽之岁币，当输于金；不然，燕山之兵旦夕可至白沟。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: haishang_refused, value: true}
      - {kind: flag, key: lian_liao, operator: absent}
      - {kind: flag, key: yanjing_jin, value: true}
      - {kind: flag_age, key: yanjing_jin, operator: gte, value: 1}
      - {kind: region_controller, region: yanshan, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: lte, value: 21}
  proposal: gifts
  keywords: [金使, 岁币, 燕京, 议和]
  advisors:
    - {character: li_gang, stance: oppose, option: refuse, requires: {region: bianjing}, line: 岁币者，澶渊之约所以与辽也。辽未尽亡，而金责之于我，是无约而索也。一许之，则后索无已。}
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 几十万匹绢，买个太平，划得来。}
    - {character: ma_kuo, stance: neutral, option: stall, requires: {region: bianjing}, line: 女真索币，意在试我。遣使往复，观其所欲，再作区处。}
  options:
    - id: refuse
      label: 不许，岁币仍循澶渊旧约
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 拒金人索币}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金人索币不得}
        - {op: adjust_resource, resource: nanmu, delta: 1, reason: 金人以拒币为辞}
      hint: 君威 +1；金人轻宋（风闻）↑，胡马南牧（风闻）略↑；金人或将陈兵试我
    - id: stall
      label: 遣使往复议之
      ops:
        - {op: adjust_resource, resource: treasury, delta: -15, reason: 遣使议币}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人以宋为拖延}
      hint: 国库 −15；金人轻宋（风闻）略↑
    - id: gifts
      label: 许岁输银绢于金（另立岁币）
      ops:
        - {op: add_ledger, id: suibi_jin, name: 岁币（金）, category: treasury, amount: -8, kind: recurring, reason: 许金岁币（游戏折算）, cancellable: false}
        - {op: adjust_resource, resource: authority, delta: -2, reason: 无约而输币}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 金人得币}
      hint: 每季另支岁币（金）8 万缗；君威 −2；金人轻宋（风闻）↓

- id: t_hebei_zishou
  title: 河北自守
  summary: 河北安抚司奏：自谢绝金使以来，河北修城练兵，边备渐整；金使过境，颇加敛容。请定久守之计：或募弓箭手屯田沿边，或遣使与金重申白沟旧界。
  region: hebei_xi
  illustration: event.tangluo
  conditions:
    all:
      - {kind: flag, key: haishang_refused, value: true}
      - {kind: flag, key: lian_liao, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: resource, id: wubei, operator: gte, value: 50}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: turn, operator: gte, value: 14}
  proposal: tuntian
  keywords: [河北, 屯田, 武备, 弓箭手]
  advisors:
    - {character: zong_ze, stance: support, option: tuntian, requires: {region: [jingdong, hebei_xi, hebei_dong]}, line: （自任所驰书）边备方整，正宜募民屯田，人自为守。十年之后，河北皆兵！}
    - {character: ma_kuo, stance: neutral, option: envoy, requires: {region: bianjing}, line: 金人敬我之备，此时遣使申明旧界，彼必不敢多求。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 城也修了，兵也练了，再屯田，钱从哪里来？}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: "{when}，河北自守之议未行"}
      hint: 无增减
    - id: tuntian
      label: 募弓箭手屯田沿边（三季）
      ops:
        - op: start_project
          name: 河北沿边屯田
          region: hebei_xi
          cost_per_turn: {treasury: 30}
          turns: 3
          on_complete:
            - {op: adjust_region, region: hebei_xi, stat: defense, delta: 4}
            - {op: adjust_region, region: hebei_xi, stat: grain, delta: 3}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 河北屯田有成}
      hint: 国库每季 −30 共三季；成后河北西路防务 +4、粮产 +3，武备 +1
    - id: envoy
      label: 遣使与金重申白沟旧界
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 遣使申界}
        - {op: adjust_resource, resource: jin_contempt, delta: -2, reason: 宋备而使至}
      hint: 国库 −20；金人轻宋（风闻）↓
