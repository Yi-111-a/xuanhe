  proposal: integrity
  keywords: [燕山, 燕人, 吏治, 归明]
  advisors:
    - {character: zhao_liangsi, stance: support, option: favor, line: 臣亦燕人也。燕人仕于辽者多通吏事，参用之，则燕人知朝廷不以夷狄视之。}
    - {character: ma_kuo, stance: neutral, option: integrity, requires: {region: bianjing}, line: 燕人可用，南吏亦可用；要在择廉，不在南北。}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [shaozai, taizai]}, line: 燕地新附，用燕人为官，万一有变，谁来担待？}
  options:
    - id: favor
      label: 以归明燕人为燕山诸州守令
      ops:
        - {op: adjust_region, region: yanshan, stat: order, delta: 3}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 燕人感恩}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 请托随之}
      hint: 燕京治安 +3，君威 +1，吏治积弊 +1（请托随之）
    - id: integrity
      label: 择廉干之吏守燕山，参用燕之旧人
      ops:
