# ============================== 河北和籴之后（读计数器） ==============================
# 计数器 hedi_buys：常设奏疏「河北和籴」每批「出钱和籴」一次即 +1（events 草稿的记账事件 hedi_tally）。满两次后言者论抑配。
- id: t_hedi_yipei
  title: 和籴抑配
  summary: 言者论河北和籴之弊：连岁出钱和籴，州县名为和籴，实则按户敷配，给价不及市直，又以茶盐钞、度牒折价，民有鬻牛以输者。请罢抑配之法。
  region: hebei_xi
  illustration: event.famine
  conditions:
    all:
      - {kind: counter, key: hedi_buys, operator: gte, value: 2}
      - {kind: region_controller, region: hebei_xi, faction: song}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: integrity
  keywords: [和籴, 边储, 河北, 吏治]
  advisors:
    - {character: li_gang, stance: support, option: integrity, requires: {region: bianjing}, line: 和籴本以便民，今乃病民。罢抑配，籴价依市，则民乐输而边储自实。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 州县不按户摊派，哪里凑得齐这许多粮？边储要紧，民间嚷嚷几句也就过去了。}
    - {character: ma_kuo, stance: neutral, option: halt, requires: {region: bianjing}, line: 臣在河北，见民间鬻牛以输籴粮。边储固要紧，然民力已竭，不如暂停一二年。}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 抑配如故}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: -3}
      hint: 吏治积弊 +1，河北西路治安 −3
    - id: halt
      label: 暂停河北和籴，边储改由漕运
      ops:
        - {op: adjust_resource, resource: grain, delta: -30, reason: 漕粮改输河北边储}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 2}
      hint: 粮储 −30，河北西路治安 +2
    - id: integrity
      label: 遣使按察，罢抑配，籴价依市
      ops:
        - {op: adjust_resource, resource: treasury, delta: -25, reason: 遣使按察并补籴价}
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 罢抑配}
        - {op: adjust_region, region: hebei_xi, stat: order, delta: 3}
      hint: 国库 −25，吏治积弊 −2，河北西路治安 +3

# ============================== 联辽之局（lian_liao） ==============================
- id: t_liao_queshang
  title: 雄州榷场
  summary: 燕京辽人遣使言：燕地兵兴，谷帛不继，请复雄州榷场，以燕地之马、羊易宋之粮帛；愿岁时通使，永为兄弟之邦。
  region: hebei_dong
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: region_controller, region: hebei_dong, faction: song}
      - {kind: turn, operator: gte, value: 9}
  proposal: lianliao
  keywords: [辽使, 联辽, 互市, 榷场, 燕京]
  advisors:
    - {character: li_gang, stance: support, option: lianliao, requires: {region: bianjing}, line: 榷场既开，燕人仰我之粟帛，辽之存亡与我相系，此不战而固藩篱之术也。}
    - {character: wang_fu, stance: oppose, option: keep, requires: {office: [shaozai, taizai]}, line: 粮米出境，河北先饥。辽人有求无已，开了这个口子，便没个了局。}
    - {character: ma_kuo, stance: neutral, option: limit, requires: {region: bianjing}, line: 市可开，粮不可多出。以帛易马，于我有益；以粟资辽，金人必怒。}
  options:
    - id: keep
      label: 不开
      ops:
        - {op: remember, character: ma_kuo, fact: "{when}，辽人请复雄州榷场，朝廷不许"}
      hint: 无增减
    - id: lianliao
      label: 开雄州榷场，许辽人市粮帛
      ops:
        - {op: adjust_resource, resource: treasury, delta: 15, reason: 雄州榷税}
        - {op: adjust_resource, resource: grain, delta: -30, reason: 榷场出粮}
        - {op: adjust_resource, resource: liao_zuo, delta: 3, reason: 燕地得宋粮帛}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋资辽}
        - {op: adjust_region, region: hebei_dong, stat: prosperity, delta: 2}
      hint: 国库 +15（榷税），粮储 −30，辽祚 +3，河北东路繁荣 +2；金人轻宋（风闻）略↑
    - id: limit
      label: 开市而禁粮米出境，只许以帛易马
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 以帛易马}
        - {op: adjust_resource, resource: liao_zuo, delta: 1, reason: 燕地稍得帛}
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 得燕马}
      hint: 国库 −10，辽祚 +1，武备 +1（得燕马）

- id: t_liao_wenzui
  title: 金使诘问助辽
  summary: 金使至汴京，执国书诘问：南朝既与大金通使，何以输粮帛资辽？请宋绝辽使、罢输粮，否则两国之好，自此而绝。金使留馆待报。
  region: bianjing
  illustration: event.jin_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: jin_questions_aid_done, value: true}
      - {kind: flag_age, key: jin_questions_aid_done, operator: lte, value: 2}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
  proposal: frank
  keywords: [金使, 联辽, 存辽, 女真]
  advisors:
    - {character: li_gang, stance: support, option: frank, requires: {region: bianjing}, line: 宋辽百年之好，天下共知。直告金使：宋不预辽金之争，亦不受人胁。}
    - {character: li_bangyan, stance: support, option: gifts, requires: {region: bianjing}, line: 金使脾气大，多送些礼，说几句软话，打发回去便是。}
    - {character: ma_kuo, stance: neutral, option: frank, requires: {region: bianjing}, line: 臣亲见女真，最恨人欺之以诈。实言以告，胜于支吾。}
  options:
    - id: frank
      label: 答以宋辽旧好，不预兵事，亦不绝辽
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 答金使不屈}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人怒宋不绝辽}
      hint: 君威 +1；金人轻宋（风闻）略↑
    - id: gifts
      label: 厚赂金使，言辞卑逊，阴助如故
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 厚赂金使}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 卑辞事金}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 金使得赂}
      hint: 国库 −40，君威 −1；金人轻宋（风闻）略↓
    - id: keep
      label: 留金使于馆，久不报
      ops:
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 金使久留不报}
        - {op: adjust_resource, resource: nanmu, delta: 1, reason: 金人以宋为辽之党}
      hint: 金人轻宋（风闻）↑，胡马南牧（风闻）略↑

- id: t_dashi
  title: 林牙去留
  summary: 雄州间者报：燕京守将、辽林牙耶律大石以其主远在塞外，燕京诸将议论不一，欲率精骑出塞以奉其主。燕人惶惧，辽使私请宋廷留之。
  region: yanshan
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: flag, key: dashi_west, operator: absent}
      - {kind: region_controller, region: yanshan, faction: liao}
      - {kind: character_status, character: yelu_dashi, value: alive}
      - {kind: character_region, character: yelu_dashi, region: yanshan, arrived: true}
      - {kind: turn, operator: gte, value: 13}
  proposal: liu
  keywords: [联辽, 存辽, 燕京, 耶律大石]
  advisors:
    - {character: zhong_shidao, stance: support, option: liu, requires: {region: xibian}, line: （自泾原驰表）燕京之可守，以有大石。大石去，燕京不过一空城耳。厚礼留之，所费不多。}
    - {character: tong_guan, stance: oppose, option: keep, line: 契丹的将，走便走了，与咱们何干？他一走，燕京的事反倒好商量。}
    - {character: li_gang, stance: support, option: aid, requires: {region: bianjing}, line: 大石善战，与其坐守燕京，不如资之甲械，使出居庸以扰金人之后。}
  options:
    - id: liu
      label: 厚赐大石，劝其留守燕京
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 厚赐耶律大石}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 燕京宿将留守}
      hint: 国库 −40，辽祚 +2；耶律大石留守燕京
    - id: aid
      label: 资大石粮帛甲械，使出居庸以扰金后
      ops:
        - {op: adjust_resource, resource: grain, delta: -40, reason: 资耶律大石粮}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 资耶律大石甲械}
        - {op: adjust_resource, resource: liao_zuo, delta: 4, reason: 大石出兵扰金}
        - {op: adjust_resource, resource: jin_contempt, delta: 2, reason: 宋资辽将扰金}
        - {op: adjust_resource, resource: nanmu, delta: 1, reason: 金人怒宋}
      hint: 粮储 −40，国库 −30，辽祚 +4；金人轻宋（风闻）↑，胡马南牧（风闻）略↑
    - id: keep
      label: 听其自处
      ops:
        - {op: remember, character: zhong_shidao, fact: "{when}，辽林牙耶律大石欲出塞，朝廷听其自处"}
      hint: 无增减；耶律大石或将出塞而去，燕京辽军失其宿将（辽祚 ↓）

- id: t_liao_hebing
  title: 辽人请合兵
  summary: 辽使言：金人连岁攻辽不下，师老于外；请宋陈河北之兵于白沟、雄州为声援，与辽夹击女真，愿以燕山以东诸州为谢。
  region: hebei_dong
  illustration: event.liao_envoy
  conditions:
    all:
      - {kind: flag, key: lian_liao, value: true}
      - {kind: flag, key: liao_fallen, operator: absent}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: resource, id: liao_zuo, operator: gte, value: 30}
      - {kind: region_controller, region: hebei_dong, faction: song}
      - {kind: turn, operator: gte, value: 14}
  proposal: aid
  keywords: [联辽, 存辽, 辽使, 河北]
  advisors:
    - {character: yao_pingzhong, stance: support, option: aid, requires: {region: xibian}, line: （自西边驰书）末将愿领精骑出白沟，与辽人夹击，女真可一战而走！}
    - {character: zhong_shidao, stance: oppose, option: gifts, requires: {region: xibian}, line: （自泾原驰表）助辽以粮可也，助辽以兵不可。兵一出，金人之怒移于我，非存辽之本意。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 人家两家打架，咱们出钱出粮已是仗义，再出兵，那是自己往刀口上撞。}
  options:
    - id: keep
      label: 守约不出兵
      ops:
        - {op: remember, character: zhong_shidao, fact: "{when}，辽人请宋合兵夹击女真，朝廷守约不出"}
      hint: 无增减
    - id: aid
      label: 令河北东路禁军陈兵白沟为声援
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 河北陈兵犒赏}
        - {op: adjust_resource, resource: liao_zuo, delta: 4, reason: 宋兵声援，辽人气振}
        - {op: adjust_resource, resource: jin_contempt, delta: 3, reason: 宋陈兵助辽}
        - {op: adjust_resource, resource: nanmu, delta: 2, reason: 金人移怒于宋}
      hint: 国库 −30，辽祚 +4；金人轻宋（风闻）↑，胡马南牧（风闻）↑
    - id: gifts
      label: 不出兵，资辽甲械弓弩
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 资辽甲械}
        - {op: adjust_resource, resource: liao_zuo, delta: 2, reason: 辽得宋甲械}
        - {op: adjust_resource, resource: jin_contempt, delta: 1, reason: 金人疑宋资辽}
      hint: 国库 −40，辽祚 +2；金人轻宋（风闻）略↑

# ============================== 燕京在宋手（region_controller yanshan song） ==============================
- id: t_yushan_guan
  title: 榆关之守
  summary: 燕山府奏：燕山北有居庸、古北、松亭诸口，东有榆关。今平州之地在金，榆关之险不在我；金骑自关外出入，旬日可至城下。请增修诸关隘，屯兵守之。
  region: yanshan
  illustration: event.military_drill
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: region_controller, region: pingzhou, faction: jin}
      - {kind: flag, key: jin_invaded, operator: absent}
      - {kind: turn, operator: gte, value: 12}
  proposal: fortify
  keywords: [燕山, 关隘, 城防, 武备]
  advisors:
    - {character: ma_kuo, stance: support, option: fortify, requires: {region: bianjing}, line: 臣亲见女真骑兵，一日夜可行三百里。关隘不守，燕山即是平地。}
    - {character: zhang_shuye, stance: support, option: fortify, requires: {office: yanshan_xuanfu, region: yanshan}, line: （自燕山驰奏）诸关之险，臣已亲历。古北、居庸犹可守；榆关在金人之手，臣请增戍松亭以当其冲。}
    - {character: li_bangyan, stance: oppose, option: envoy, requires: {region: bianjing}, line: 关隘修了，金人看着又要说咱们防他。不如派个使者去，把关外的界划清楚。}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: ma_kuo, fact: "{when}，燕山关隘之议未行"}
      hint: 无增减
    - id: envoy
      label: 遣使与金议定关外之界
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 遣使议界}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 示弱于金}
        - {op: adjust_resource, resource: jin_contempt, delta: -1, reason: 宋使恭谨}
      hint: 国库 −20，君威 −1；金人轻宋（风闻）略↓
    - id: fortify
      label: 修居庸、古北、松亭诸关隘（三季）
      ops:
        - op: start_project
          name: 修燕山诸关隘
          region: yanshan
          cost_per_turn: {treasury: 35}
          turns: 3
          on_complete:
            - {op: adjust_region, region: yanshan, stat: defense, delta: 8}
            - {op: adjust_resource, resource: wubei, delta: 1, reason: 燕山关隘修治}
      hint: 国库每季 −35 共三季；成后燕京防务 +8、武备 +1

- id: t_yan_guanli
  title: 燕山官吏
  summary: 燕山府奏：燕地新复，朝廷所遣守令多南人，不习燕俗，或以燕人为番人而侵渔之；燕之旧吏、豪族怏怏不平，至有私通关外者。请参用燕人为佐贰。
  region: yanshan
  illustration: event.court_debate
  conditions:
    all:
      - {kind: region_controller, region: yanshan, faction: song}
      - {kind: flag, key: jin_invaded, operator: absent}
