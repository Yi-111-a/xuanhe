# 补写奏疏草稿（第 3 批，22 条）。追加到 scenarios/xuanhe_1120/memorials.yaml 末尾即可；选项次序已按 tools/rotate_options.py 轮转。
# 一、补薄季：宣和二年秋（2 条）、冬（2 条）、宣和三年夏（2 条），固定回合，无路线前提。
# 二、反事实路线：联辽（4 条，正向守卫 lian_liao）、燕京在宋手（4 条，守卫 region_controller yanshan song）、
#     谢绝金使而未联辽（3 条，守卫 haishang_refused 且 lian_liao absent）。
# 三、地方与常设之外的变化：和籴抑配（读计数器 hedi_buys，由 events 草稿的记账事件累计）、川峡茶马、转般仓、福建海寇、关中弓箭手。
# 数值为本游戏设定（【设】）；史实依据与存疑之处见交付说明。hint 中「（风闻）」指隐藏数值，只写方向。

# ============================== 补薄季：宣和二年秋 ==============================
- id: t2_changping
  turn: 2
  title: 常平籴本
  summary: 司农寺奏：京畿、京东诸路秋稼稍登，请出钱籴入常平仓，以备来岁荒歉；又言常平钱物近岁屡为他司借用，所存不及旧额之半。
  region: bianjing
  illustration: event.qingming
  proposal: fair
  keywords: [常平, 籴, 赈济, 财赋]
  advisors:
    - {character: cai_jing, stance: oppose, option: tax, line: 常平之钱，岁岁闲置。借以给用，丰年无害；荒年再拨还，亦不为迟。}
    - {character: li_gang, stance: support, option: fair, requires: {region: bianjing}, line: 常平者，所以待凶年也。丰年不籴，凶年何以为赈？借用之钱，宜令有司限期拨还。}
    - {character: li_bangyan, stance: neutral, option: keep, requires: {region: bianjing}, line: 今年收成还过得去，仓里有多少算多少，明年的事明年再说。}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: "{when}，常平籴本之议未行"}
      hint: 无增减
    - id: tax
      label: 借常平钱四十万缗以充经费
      ops:
        - {op: adjust_resource, resource: treasury, delta: 40, reason: 借用常平钱}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 常平钱移用}
      hint: 国库 +40，吏治积弊 +1；常平空虚，日后诸路告歉时恐无以赈粜
    - id: fair
      label: 出钱四十万缗籴入常平，禁州县抑配
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 籴入常平}
        - {op: adjust_resource, resource: grain, delta: 35, reason: 常平籴入}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 禁抑配}
      hint: 国库 −40，粮储 +35，吏治积弊 −1

- id: t2_yubi
  turn: 2
  title: 御笔径下
  summary: 中书、门下省奏：近岁御笔手诏多自禁中径下有司，不由三省书读；有司稍有稽违，即以违御笔论，宰执或不得与闻。三省文书壅滞，诏令前后抵牾。请凡御笔皆经三省覆奏而后施行。
  region: bianjing
  illustration: event.court_debate
  conditions: {kind: office_holder, office: yubi, character: liang_shicheng}
  proposal: curb
  keywords: [御笔, 三省, 梁师成]
  advisors:
    - {character: liang_shicheng, stance: oppose, option: favor, requires: {office: yubi}, line: 御笔是官家亲书，外廷还要覆奏，岂不是信不过官家？奴婢只是替官家传话罢了。}
    - {character: li_gang, stance: support, option: curb, requires: {region: bianjing}, line: 政出多门，则天下不知所从。诏令不由三省，宰执不得与闻，是以近习之笔代朝廷之议也。}
    - {character: yu_shen, stance: neutral, option: keep, requires: {office: taizai}, line: 御笔以济急，三省以守常，二说皆有理。臣以为……当请圣裁。}
  options:
    - id: favor
      label: 申严违御笔之罚
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 御笔令行}
        - {op: adjust_resource, resource: ningxing, delta: 2, reason: 近习专御笔}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 诏令抵牾}
      hint: 君威 +1，佞幸 +2，吏治积弊 +1
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: liang_shicheng, fact: "{when}，三省请覆奏御笔，议不行"}
      hint: 无增减
    - id: curb
      label: 凡御笔须经三省覆奏而后施行
      memory: {character: liang_shicheng, text: "{when}，陛下令御笔须经三省覆奏"}
      ops:
        - {op: adjust_resource, resource: ningxing, delta: -2, reason: 御笔不得径下}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 御笔受三省覆奏}
        - {op: adjust_trait, character: liang_shicheng, trait: favor, delta: -1}
      hint: 佞幸 −2，君威 −1；梁师成不悦

# ============================== 补薄季：宣和二年冬 ==============================
- id: t3_qianfa
  turn: 3
  title: 钱监鼓铸
  summary: 陕西、河东转运司奏：铜锡不继，钱监岁铸不及旧额，而边费日增；请增铸当十大钱，或铸夹锡钱以济边用。言者谓大钱一行，私铸必起，物价翔踊。
  region: guanzhong
  illustration: event.mianfu
  proposal: tax
  keywords: [钱法, 钱监, 财赋, 边费]
  advisors:
    - {character: cai_jing, stance: support, option: tax, line: 当十之钱，以一当十，所省铜料无算。行之以渐，市井自然通行。}
    - {character: zhang_xiaochun, stance: oppose, option: settle, requires: {region: hedong}, line: （自太原驰奏）河东边费全仰钱监。然大钱一出，市井不受，兵士得钱而不得物。臣以为不如循小平钱之制，量增鼓铸。}
    - {character: li_bangyan, stance: neutral, option: keep, requires: {region: bianjing}, line: 钱的事最绕人。一当十也好，十当一也罢，臣只盼莫要一年三变。}
  options:
    - id: settle
      label: 罢大钱之议，循小平钱之制量增鼓铸
      ops:
        - {op: adjust_resource, resource: treasury, delta: -5, reason: 增铸小平钱之本}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 钱法不轻改}
        - {op: adjust_region, region: guanzhong, stat: order, delta: 2}
      hint: 国库 −5，吏治积弊 −1，关中治安 +2
    - id: tax
      label: 增铸当十大钱以济边用
      ops:
        - {op: adjust_resource, resource: treasury, delta: 60, reason: 增铸当十钱}
        - {op: adjust_resource, resource: corruption, delta: 2, reason: 大钱行而奸弊生}
      hint: 国库 +60，吏治积弊 +2；此后私铸或将蜂起，物价随之腾踊
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: zhang_xiaochun, fact: "{when}，钱监鼓铸之议未行"}
      hint: 无增减

- id: t3_xuehan
  turn: 3
  title: 雪寒
  summary: 开封府奏：入冬大雪，京城苦寒，贫民冻馁，有僵仆于道者。请依例放免公私僦舍之钱，出粜官米，给薪炭于贫乏之家。
  region: bianjing
  illustration: event.famine
  conditions: {kind: season, value: 冬}
  proposal: relief
  keywords: [赈济, 京城, 雪寒]
  advisors:
    - {character: chen_dong, stance: support, option: relief, requires: {region: bianjing}, line: 学生斗胆！天子脚下，冻死者相枕于道，四方何以观之？请陛下推一念之仁。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 放三日房钱便是天恩了，再多，开封府的账可就难看了。}
    - {character: wang_fu, stance: neutral, option: keep, requires: {office: [shaozai, taizai]}, line: 京城雪寒，岁岁有之。依例放免三日，此陛下圣德所致，都人自然感戴。}
  options:
    - id: relief
      label: 放免房钱、出粜官米、给薪炭
      ops:
        - {op: adjust_resource, resource: grain, delta: -25, reason: 雪寒出粜官米}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 雪寒赈恤}
        - {op: adjust_region, region: bianjing, stat: order, delta: 2}
      hint: 粮储 −25，民心 +1，汴京治安 +2
    - id: keep
      label: 依例只放免房钱三日
      ops:
        - {op: adjust_region, region: bianjing, stat: order, delta: -1}
      hint: 汴京治安 −1

# ============================== 补薄季：宣和三年夏 ==============================
- id: t5_sanshe
  turn: 5
  title: 州县三舍
  summary: 礼部奏：州县学三舍之法行之近二十年，养士之费仰给学田、常平，而升补之际请托冒滥，寒士反不得进。议者请罢州县三舍，复以科举取士，独太学仍存三舍。
  region: bianjing
  illustration: event.chen_dong
  proposal: thrift
  keywords: [三舍, 科举, 太学, 学校]
  advisors:
    - {character: cai_jing, stance: oppose, option: keep, line: 三舍之法，所以养士于学，不专以一日之文取人。罢之，是弃二十年之功。}
    - {character: li_gang, stance: support, option: thrift, requires: {region: bianjing}, line: 州县之学，以舍选为名，以请托为实。不如复科举，使天下之士以文自见。}
    - {character: chen_dong, stance: neutral, option: limit, requires: {region: bianjing}, line: 学生身在太学，受三舍之教，不敢尽言其非。州县之弊，在人不在法；汰其冒滥，可也。}
  options:
    - id: thrift
      label: 罢州县三舍，复以科举取士
      ops:
        - {op: adjust_resource, resource: treasury, delta: 30, reason: 省州县养士之费}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 升补请托之弊息}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 学制屡改，舍生失职者怨}
      hint: 国库 +30，吏治积弊 −1，君威 −1
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: "{when}，罢州县三舍之议未行"}
      hint: 无增减
    - id: limit
      label: 留三舍而严升补，汰其冒滥
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 遣官考覆舍生}
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 汰三舍冒滥}
      hint: 国库 −10，吏治积弊 −2

- id: t5_hushi
  turn: 5
  title: 夏人请市
  summary: 鄜延路奏：夏国遣使至保安军，请复榷场和市，以青盐、马驼易缯帛、茶叶。或言夏人得缯帛则益富，青盐入境则夺解盐之利。
  region: xibian
  illustration: event.xixia
  conditions: {kind: region_controller, region: xibian, faction: song}
  proposal: open
  keywords: [西夏, 互市, 榷场, 西边]
  advisors:
    - {character: zhong_shidao, stance: support, option: open, requires: {region: xibian}, line: （自泾原驰表）互市既开，夏人有所利而不轻动；我得其马，西兵亦可稍补。}
    - {character: tong_guan, stance: oppose, option: keep, line: 夏人反复。开了市，他们拿咱们的茶帛养兵，回头又来扰边。}
    - {character: cai_jing, stance: neutral, option: limit, line: 市可开，盐须禁。青盐一入，解盐之课便亏了。}
  options:
    - id: limit
      label: 许市而禁青盐入境
      ops:
        - {op: adjust_resource, resource: treasury, delta: 5, reason: 榷场之税}
        - {op: adjust_relation, a: song, b: xixia, delta: 3}
        - {op: adjust_relation, a: xixia, b: song, delta: 3}
      hint: 国库 +5，宋夏关系 +3
    - id: open
      label: 许复保安军榷场，以茶帛易马驼
      ops:
        - {op: adjust_resource, resource: treasury, delta: 10, reason: 榷场之税}
        - {op: adjust_relation, a: song, b: xixia, delta: 5}
        - {op: adjust_relation, a: xixia, b: song, delta: 5}
        - {op: adjust_region, region: xibian, stat: order, delta: 2}
      hint: 国库 +10（榷场之税），宋夏关系 +5，西北边治安 +2；此后或得夏马，而私贩青盐者亦将随之
    - id: keep
      label: 依旧闭市
      ops:
        - {op: remember, character: zhong_shidao, fact: "{when}，夏人请复和市，朝廷不许"}
      hint: 无增减

# ============================== 川峡、淮南、闽广、关中（地方） ==============================
- id: t8_chama
  turn: 8
  expires_after: 1
  title: 川峡茶马
  summary: 成都府路茶马司奏到：蜀茶博马，岁额不足；而茶场抑买茶户，给价不及市直，园户或伐茶而逃。请增茶额以博马，或宽茶户之抑买。
  region: chuanxia
  illustration: event.military_drill
  proposal: ma
  keywords: [茶马, 川峡, 马政]
  advisors:
    - {character: tong_guan, stance: support, option: ma, line: 西兵要马，北边也要马。蜀茶多换些马来，比什么都强。}
    - {character: li_gang, stance: oppose, option: kuan, requires: {region: bianjing}, line: 茶户困于抑买，则茶日少；茶日少，则马亦不至。宽其民，所以足其马也。}
    - {character: cai_jing, stance: neutral, option: keep, line: 茶马之法，行之有年，不必大改。}
  options:
    - id: keep
      label: 依旧
      ops:
        - {op: remember, character: cai_jing, fact: "{when}，川峡茶马之议未行"}
      hint: 无增减
    - id: kuan
      label: 宽茶户之抑买，茶价依市
      ops:
        - {op: adjust_resource, resource: treasury, delta: -10, reason: 增给茶本}
        - {op: adjust_region, region: chuanxia, stat: prosperity, delta: 3}
        - {op: adjust_region, region: chuanxia, stat: order, delta: 1}
      hint: 国库 −10，川峡繁荣 +3、治安 +1（令达于下季）
    - id: ma
      label: 增茶额以博马
      ops:
        - {op: adjust_resource, resource: wubei, delta: 1, reason: 博马增额}
        - {op: adjust_region, region: chuanxia, stat: order, delta: -3}
        - {op: adjust_region, region: chuanxia, stat: prosperity, delta: -1}
      hint: 武备 +1；川峡治安 −3、繁荣 −1（令达于下季）

- id: t10_zhuanban
  turn: 10
  expires_after: 1
  title: 转般仓
  summary: 发运司奏：东南纲船改行直达以来，船兵篙工经年在途，沿路侵盗、沉溺者众，真、扬、楚、泗诸仓多废。请复转般之法，分段转运；或只严押纲之法。
  region: huainan
  illustration: event.qingming
  proposal: zhuanban
  keywords: [漕运, 转般, 纲运, 淮南]
  advisors:
    - {character: cai_jing, stance: oppose, option: keep, line: 直达之法，船不停留，省仓廪之费，行之已久，何必复旧？}
    - {character: li_gang, stance: support, option: zhuanban, requires: {region: bianjing}, line: 转般之法，祖宗所以通东南之粟。直达行而纲船坏、仓储废，复之可也。}
    - {character: chen_dong, stance: neutral, option: strict, requires: {region: bianjing}, line: 纲运之弊，在于押纲之吏侵渔。不惩其人，法虽复旧，弊亦如故。}
  options:
    - id: strict
      label: 不复旧法，严押纲官吏之责
      ops:
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 严押纲之法}
        - {op: adjust_resource, resource: grain, delta: 15, reason: 纲运侵盗稍减}
        - {op: adjust_region, region: huainan, stat: order, delta: -1}
      hint: 吏治积弊 −1，粮储 +15，淮南治安 −1（纲兵怨）
    - id: zhuanban
      label: 复真、扬诸仓转般之法（两季）
      ops:
        - op: start_project
          name: 复转般仓
          region: huainan
          cost_per_turn: {treasury: 20}
          turns: 2
          on_complete:
            - {op: adjust_resource, resource: grain, delta: 50, reason: 转般复行，漕粮到京}
            - {op: adjust_region, region: huainan, stat: prosperity, delta: 2}
      hint: 国库每季 −20 共两季；成后粮储 +50、淮南繁荣 +2
    - id: keep
      label: 依旧直达
      ops:
        - {op: remember, character: cai_jing, fact: "{when}，复转般之议不行"}
      hint: 无增减

- id: t17_haikou
  turn: 17
  expires_after: 1
  title: 福建海寇
  summary: 福建路安抚司奏到：海寇出没泉、漳之间，劫掠蕃舶、商船，濒海之民或从之为盗。请置巡检、造战船以捕之，或招其胁从隶为水军。
  region: minguang
  illustration: event.goryeo_envoy
  proposal: fortify
  keywords: [海寇, 闽广, 市舶]
  advisors:
    - {character: cai_jing, stance: support, option: fortify, line: 泉、广市舶，岁入以百万计。海道不靖则蕃舶不来，置巡检之费，所值多矣。}
    - {character: zhang_shuye, stance: support, option: amnesty, requires: {region: jingdong}, line: （自海州驰奏）海寇所恃者舟楫。断其舟楫，招其胁从，可不战而散。}
    - {character: li_bangyan, stance: oppose, option: keep, requires: {region: bianjing}, line: 闽广天高地远，几个海贼，叫州县自己捉去。}
  options:
    - id: keep
      label: 令州县自行捕之
      ops:
        - {op: adjust_region, region: minguang, stat: order, delta: -2}
      hint: 闽广治安 −2（令达于下季）
    - id: amnesty
      label: 招其胁从，隶为水军
      ops:
        - {op: adjust_resource, resource: grain, delta: -15, reason: 招安海寇给粮}
        - {op: adjust_region, region: minguang, stat: order, delta: 2}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 招安冒滥}
      hint: 粮储 −15，闽广治安 +2（令达于下季），吏治积弊 +1
    - id: fortify
      label: 置巡检、造战船以捕海寇
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 置巡检造战船}
        - {op: adjust_region, region: minguang, stat: order, delta: 4}
        - {op: adjust_region, region: minguang, stat: prosperity, delta: 1}
      hint: 国库 −30；闽广治安 +4、繁荣 +1（令达于下季）

- id: t20_gongjianshou
  turn: 20
  expires_after: 1
  title: 关中弓箭手
  summary: 永兴军、秦凤诸路奏：沿边弓箭手田多为豪强、将校所占，弓箭手贫乏逃亡，阙额甚多。请括还其田，复招弓箭手。
  region: guanzhong
  illustration: event.military_drill
  conditions: {kind: region_controller, region: guanzhong, faction: song}
  proposal: settle
  keywords: [弓箭手, 西军, 关中, 武备]
  advisors:
    - {character: zhong_shidao, stance: support, option: settle, requires: {region: xibian}, line: （自泾原驰表）弓箭手者，西边之藩篱。田归其人，则人自为战，不烦馈饷。}
    - {character: tong_guan, stance: oppose, option: keep, line: 西边将校跟着老奴出生入死，占几亩田，算得什么？括起田来，军心先乱了。}
    - {character: zhong_shizhong, stance: support, option: settle, requires: {region: xibian}, line: （自秦州驰表）末将营中弓箭手，十人里逃了三人。田还了他们，人自然回来。}
  options:
